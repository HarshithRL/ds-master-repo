resources:
  jobs:
    lead_time_prediction:
      name: lead_time_prediction
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: Europe/Brussels
        pause_status: PAUSED
      tasks:
        - task_key: Ingest_MDP_Tables
          notebook_task:
            notebook_path: ../src/Notebooks/Ingest MDP Tables.py
          job_cluster_key: lead_time_prediction_cluster

        - task_key: Clean_Enrich_PO_Data
          depends_on:
            - task_key: Ingest_MDP_Tables
          notebook_task:
            notebook_path: ../src/Notebooks/Clean Enrich PO Data.py
          job_cluster_key: lead_time_prediction_cluster

        - task_key: Lead_Time_With_AI
          depends_on:
            - task_key: Clean_Enrich_PO_Data
          notebook_task:
            notebook_path: ../src/Notebooks/Lead Time with AI.py
          job_cluster_key: lead_time_prediction_cluster

      job_clusters:
        - job_cluster_key: lead_time_prediction_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 17.3.x-scala2.13
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            enable_elastic_disk: true
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 4
      queue:
        enabled: true
      permissions:
        - user_name: "mustafaarda.bicakci@etexgroup.com"
          level: "CAN_MANAGE"
        - user_name: "pierre.delaguiche@etexgroup.com"
          level: "CAN_MANAGE"
