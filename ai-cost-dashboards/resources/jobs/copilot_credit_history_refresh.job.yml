resources:
  jobs:
    copilot_credit_history_refresh:
      name: executive-copilot-credit-history-${bundle.target}

      schedule:
        quartz_cron_expression: 0 15 12 * * ?
        timezone_id: Europe/Brussels
        pause_status: ${var.copilot_credit_refresh_pause_status}

      tasks:
        - task_key: refresh_copilot_credit_history
          notebook_task:
            notebook_path: ../../src/notebooks/copilot_credit_history_refresh.py
            base_parameters:
              catalog: ${var.catalog}
              historical_as_of_date: ${var.copilot_credit_history_as_of_date}
          job_cluster_key: copilot_credit_history_cluster

      job_clusters:
        - job_cluster_key: copilot_credit_history_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            enable_elastic_disk: true
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 2

      queue:
        enabled: true