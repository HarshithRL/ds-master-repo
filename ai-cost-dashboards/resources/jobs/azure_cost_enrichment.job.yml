resources:
  jobs:
    azure_cost_enrichment:
      name: ai-cost-dashboard-enrichment-${bundle.target}

      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: Europe/Brussels
        pause_status: ${var.refresh_pause_status}

      tasks:
        - task_key: enrich_azure_costs
          notebook_task:
            notebook_path: ../../src/notebooks/azure_cost_enrichment.py
            base_parameters:
              catalog: ${var.catalog}
              source_table: ${var.source_table}
              write_gold: ${var.gold_refresh_enabled}
          job_cluster_key: azure_cost_enrichment_cluster

      job_clusters:
        - job_cluster_key: azure_cost_enrichment_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            enable_elastic_disk: true
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 2

      queue:
        enabled: true