# ==============================================================
# Air Monitoring — Migration Load: SITES only
#
# Reads sites_*.xlsx from the target volume and
# overwrites bronze.air_monitoring_sites (full replace).
#
# Run: databricks bundle run migration_load_sites --target A
# ==============================================================

resources:
  jobs:
    migration_load_sites:
      name: "air-monitoring-migration-load-sites-${bundle.target}"

      tasks:
        - task_key: load_sites_table
          notebook_task:
            notebook_path: ../src/migration_exports/3_Load_from_Excel_ACC_PRD.py
            base_parameters:
              TARGET_CATALOG: "${var.catalog}"
              OUTPUT_EXCEL:   "auto"
              SITES_EXCEL:    "auto"
              LOAD_WHAT:      "sites"
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id:  "Standard_DS3_v2"
            num_workers: 1
            policy_id: "${var.policy_id}"
            data_security_mode: "USER_ISOLATION"

      email_notifications:
        on_failure:
          - mustafaarda.bicakci@etexgroup.com

      # No recurring schedule — run on demand only.
