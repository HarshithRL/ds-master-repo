bundle:
  name: ai-cost-dashboards

include:
  - resources/dashboards/*.yml
  - resources/jobs/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that contains the dashboard source data
  source_table:
    description: Fully qualified Azure actual-cost source table
  policy_id:
    description: Cluster policy used by the enrichment job
  gold_refresh_enabled:
    description: Whether this target is allowed to replace its gold cost table
  refresh_pause_status:
    description: Databricks schedule pause status for the enrichment job
  warehouse_id:
    description: SQL warehouse ID used by the dashboards
  dashboard_host:
    description: Workspace host used in cross-dashboard links

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      catalog: automation_d
      source_table: ingestion_azure_p.costs.azure_actual_cost
      policy_id: 306312B9730019AB
      gold_refresh_enabled: "false"
      refresh_pause_status: PAUSED
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_host: adb-7181820732839861.1.azuredatabricks.net

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      catalog: automation_d
      source_table: ingestion_azure_p.costs.azure_actual_cost
      policy_id: 306312B9730019AB
      gold_refresh_enabled: "false"
      refresh_pause_status: PAUSED
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_host: adb-7181820732839861.1.azuredatabricks.net
    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: sahil.ailsingani@etexgroup.com
        level: CAN_MANAGE
