command:
  - python
  - run_app.py
env:
  # FLASK_SECRET_KEY is set by the bundle (config.env). Do not valueFrom
  # secret-key here: ACC/PRD have no procure-ai/secret-key scope.
  - name: MATE_ENV
    value: prod
  - name: MATE_LOG_FORMAT
    value: json
  - name: MATE_LOG_LEVEL
    value: INFO
  - name: BRAIN_BASE_URL
    value: http://127.0.0.1:8004
  - name: BRAIN_HOST
    value: 127.0.0.1
  - name: BRAIN_PORT
    value: "8004"
  - name: MLFLOW_TRACKING_URI
    value: databricks
  - name: MLFLOW_EXPERIMENT_NAME
    value: /Shared/ds-procure-ai/ai_brain
  # Pin Foundation Model API ids in the process env so a stale Apps
  # config.env (automation_d.ai_models.gw_*) cannot 404 chat.
  - name: DATABRICKS_MODEL
    value: system.ai.claude-opus-4-5
  - name: DATABRICKS_FAST_MODEL
    value: system.ai.claude-sonnet-4-5
  - name: DATABRICKS_THINKING_MODEL
    value: system.ai.claude-opus-4-6
  - name: DATABRICKS_FAST_ENDPOINT
    value: databricks-claude-sonnet-4-5
  - name: DATABRICKS_THINKING_ENDPOINT
    value: databricks-claude-opus-4-6
  # Lakebase STM/LTM (ai_brain). YAML defaults: ai_brain/core/config/memory.yaml.
  # Password is OAuth via generate_database_credential(endpoint=LAKEBASE_ENDPOINT).token
  # — never put a native PG password here.
  #
  # Platform injects PGHOST, PGPORT, PGUSER, PGSSLMODE when `postgres` is attached.
  # Omit PGHOST locally: runtime uses endpoint.status.hosts.host (direct). The
  # Neon-style -pooler host rejects search_path as a startup GUC and failed SASL
  # with OAuth tokens. Do not set DATABRICKS_CONFIG_PROFILE here — Apps runtime
  # uses WorkspaceClient() when DATABRICKS_APP_NAME or client id/secret is set.
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  - name: LAKEBASE_SCHEMA
    value: mate_agent
  - name: PGDATABASE
    value: databricks_postgres
  - name: PGSSLMODE
    value: require
  - name: BRAIN_CHECKPOINT_BACKEND
    value: lakebase
  - name: BRAIN_STORE_BACKEND
    value: lakebase
  - name: DATABRICKS_EMBEDDING_ENDPOINT
    value: databricks-gte-large-en

  # Azure Document Intelligence (form recogniser) for PDF/PPTX/DOCX parsing.
  # Same endpoint+key used by ds-air-monitoring-app.
  - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
    value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
  - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
    value: "1bdb532656d248bda3c6b58a9b75441f"
  # Mate UC app-data backend. Catalog and warehouse are auto-detected at
  # runtime from DATABRICKS_HOST (see shared/db/paths.py) so app.yaml
  # does not need per-target overrides.
  - name: MATE_DB_BACKEND
    value: uc
  - name: MATE_UC_AUTH
    value: obo
  - name: MATE_UC_SCHEMA
    value: bronze
  - name: MATE_UC_VOLUME
    value: bronze_volume
  - name: FLASK_SECRET_KEY
    value: ds-procure-ai
