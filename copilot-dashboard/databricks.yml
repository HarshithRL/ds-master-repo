bundle:
  name: copilot-dashboard

include:
  - resources/jobs/*.yml
  - resources/dashboards/*.yml


variables:
  catalog:
    description: Unity Catalog catalog (automation_d / automation_a / automation_p)
  warehouse_id:
    description: SQL warehouse ID for dashboard publishing
  policy_id:
    description: Cluster policy ID for job compute

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      catalog: automation_d
      warehouse_id: 69ada62b2fb9b9e2
      policy_id: 306312B9730019AB

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      catalog: automation_d
      warehouse_id: 69ada62b2fb9b9e2
      policy_id: 306312B9730019AB
    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: sahil.ailsingani@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/A
    variables:
      catalog: automation_a
      warehouse_id: 0ef3e37fbbd5b772
      policy_id: 306312B973005677
    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: sahil.ailsingani@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE
    resources:
      dashboards:
        agent_dashboard_phase_1:
          permissions:
            - group_name: AUTOMATION.AICOSTDASHBOARDS.CONSUMER.WRITE
              level: CAN_READ
        

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/P
    variables:
      catalog: automation_p
      warehouse_id: f500d0d670ae024b
      policy_id: 306312B973005150
    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: sahil.ailsingani@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE
