resources:
  dashboards:
    industry_quotations:
      display_name: "Industry Division \u2014 Quotations Dashboard"
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
      permissions:
        - user_name: david.hillier@etexgroup.com
          level: CAN_READ
        - user_name: federico.nidini@etexgroup.com
          level: CAN_READ
        - user_name: francois.leclercq@etexgroup.com
          level: CAN_MANAGE
        - user_name: iwona.lipinska@etexgroup.com
          level: CAN_READ
        - user_name: kamil.darczuk@etexgroup.com
          level: CAN_READ
        - user_name: kurt.avermate@etexgroup.com
          level: CAN_READ
        - user_name: roberta.villa@etexgroup.com
          level: CAN_READ
        - user_name: santiago.salvagno@etexgroup.com
          level: CAN_READ
        - user_name: sarah.drostel@etexgroup.com
          level: CAN_READ
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "ds_quotations",
              "displayName": "ds_quotations",
              "queryLines": [
                "WITH q AS (\n",
                "  SELECT\n",
                "    DATE_TRUNC('month', TO_DATE(CAST(i.`Created On` AS STRING), 'yyyyMMdd')) AS month_date,\n",
                "    COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "    i.`Sales Document Number` AS quote_number,\n",
                "    ROUND(SUM(i.`Measure Net Value in Euro`), 0) AS quote_value,\n",
                "    MAX(i.`Quotation Valid To`) AS valid_to_int,\n",
                "    MAX(\n",
                "      CASE\n",
                "        WHEN COALESCE(i.`Reason for Rejection`, '') != '' THEN 1\n",
                "        ELSE 0\n",
                "      END\n",
                "    ) AS is_rejected,\n",
                "    MAX(i.`Order Reason`) AS order_reason\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` i\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON i.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND i.`Sales Document Type` = 'YQT'\n",
                "    AND i.`Created On` >= CAST(DATE_FORMAT(ADD_MONTHS(CURRENT_DATE(), -12), 'yyyyMMdd') AS INT)\n",
                "    AND (\n",
                "      :segment_filter IS NULL\n",
                "      OR CARDINALITY(:segment_filter) = 0\n",
                "      OR array_contains(:segment_filter, i.`Application area Description`)\n",
                "    )\n",
                "  GROUP BY\n",
                "    1,\n",
                "    2,\n",
                "    3\n",
                "),\n",
                "converted AS (\n",
                "  SELECT DISTINCT\n",
                "    o.`Quote Number` AS quote_number\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` o\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON o.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND o.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    AND COALESCE(o.`Quote Number`, '') != ''\n",
                "    AND o.`Created On` >= CAST(CONCAT(YEAR(CURRENT_DATE()) - 2, '0101') AS INT)\n",
                ")\n",
                "SELECT\n",
                "  q.month_date,\n",
                "  q.cs_team,\n",
                "  COUNT(DISTINCT q.quote_number) AS total_quotes,\n",
                "  SUM(q.quote_value) AS total_quote_value,\n",
                "  COUNT(DISTINCT\n",
                "    CASE\n",
                "      WHEN c.quote_number IS NOT NULL OR q.order_reason = '24' THEN q.quote_number\n",
                "    END\n",
                "  ) AS converted_quotes,\n",
                "  COUNT(DISTINCT\n",
                "    CASE\n",
                "      WHEN\n",
                "        c.quote_number IS NULL\n",
                "        AND q.is_rejected = 0\n",
                "        AND COALESCE(q.order_reason, '') NOT IN ('24', '25')\n",
                "        AND q.valid_to_int > 0\n",
                "        AND TO_DATE(CAST(q.valid_to_int AS STRING), 'yyyyMMdd') >= CURRENT_DATE()\n",
                "      THEN\n",
                "        q.quote_number\n",
                "    END\n",
                "  ) AS open_quotes,\n",
                "  COUNT(DISTINCT\n",
                "    CASE\n",
                "      WHEN\n",
                "        c.quote_number IS NULL\n",
                "        AND q.is_rejected = 0\n",
                "        AND COALESCE(q.order_reason, '') NOT IN ('24', '25')\n",
                "        AND (\n",
                "          q.valid_to_int = 0\n",
                "          OR TO_DATE(CAST(q.valid_to_int AS STRING), 'yyyyMMdd') < CURRENT_DATE()\n",
                "        )\n",
                "      THEN\n",
                "        q.quote_number\n",
                "    END\n",
                "  ) AS expired_quotes,\n",
                "  COUNT(DISTINCT\n",
                "    CASE\n",
                "      WHEN q.is_rejected = 1 OR q.order_reason = '25' THEN q.quote_number\n",
                "    END\n",
                "  ) AS rejected_quotes\n",
                "FROM\n",
                "  q\n",
                "    LEFT JOIN converted c\n",
                "      ON c.quote_number = q.quote_number\n",
                "GROUP BY\n",
                "  1,\n",
                "  2"
              ],
              "parameters": [
                {
                  "displayName": "Segment Filter",
                  "keyword": "segment_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
                      "dataType": "STRING"
                    }
                  }
                }
              ],
              "columns": [
                {
                  "displayName": "Conversion Rate %",
                  "description": "",
                  "expression": "SUM(`converted_quotes`) * 100.0 / NULLIF(SUM(`total_quotes`), 0)"
                }
              ]
            },
            {
              "name": "ds_quotations_detail",
              "displayName": "ds_quotations_detail",
              "queryLines": [
                "WITH quotes AS (\n",
                "  SELECT\n",
                "    i.`Sales Document Number` AS quote_id,\n",
                "    MAX(i.`Sales Document Type Description`) AS doc_type,\n",
                "    TO_DATE(CAST(MAX(i.`Created On`) AS STRING), 'yyyyMMdd') AS created_date,\n",
                "    TO_DATE(CAST(MAX(i.`Quotation Valid From`) AS STRING), 'yyyyMMdd') AS valid_from,\n",
                "    TO_DATE(CAST(MAX(i.`Quotation Valid To`) AS STRING), 'yyyyMMdd') AS valid_to,\n",
                "    MAX(COALESCE(c.`Name 1`, i.`Sold To Party`)) AS customer,\n",
                "    MAX(c.`Country`) AS country,\n",
                "    MAX(COALESCE(csm.`cs_team`, 'Unmapped')) AS cs_team,\n",
                "    MAX(COALESCE(ph.`L2 Product Description`, 'Unknown')) AS product_group,\n",
                "    ROUND(SUM(i.`Measure Net Value in Euro`), 0) AS quote_value,\n",
                "    MAX(\n",
                "      COALESCE(rr.`Rejection Reason Description`, i.`Reason for Rejection`, '')\n",
                "    ) AS rejection_reason,\n",
                "    MAX(\n",
                "      CASE\n",
                "        WHEN COALESCE(i.`Reason for Rejection`, '') != '' THEN 1\n",
                "        ELSE 0\n",
                "      END\n",
                "    ) AS is_rejected,\n",
                "    MAX(i.`Order Reason`) AS order_reason,\n",
                "    MAX(COALESCE(se.`User Name`, i.`Sales Employee`)) AS sales_manager\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` i\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON i.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_customer` c\n",
                "        ON i.`Customer Key` = c.`Customer Key`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_material` m\n",
                "        ON i.`Material Key` = m.`Material Key`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_product_hierarchy` ph\n",
                "        ON ph.`Material Code` = m.`Material Code`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_rejection_reason` rr\n",
                "        ON rr.`Rejection Reason Id` = i.`Reason for Rejection`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_users` se\n",
                "        ON i.`Sales Employee` = se.`User ID`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND i.`Sales Document Type` = 'YQT'\n",
                "    AND i.`Created On` >= CAST(DATE_FORMAT(ADD_MONTHS(CURRENT_DATE(), -12), 'yyyyMMdd') AS INT)\n",
                "    AND (\n",
                "      :segment_filter IS NULL\n",
                "      OR CARDINALITY(:segment_filter) = 0\n",
                "      OR array_contains(:segment_filter, i.`Application area Description`)\n",
                "    )\n",
                "  GROUP BY\n",
                "    1\n",
                "),\n",
                "converted AS (\n",
                "  SELECT DISTINCT\n",
                "    o.`Quote Number` AS quote_number\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` o\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON o.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND o.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    AND COALESCE(o.`Quote Number`, '') != ''\n",
                "    AND o.`Created On` >= CAST(CONCAT(YEAR(CURRENT_DATE()) - 2, '0101') AS INT)\n",
                ")\n",
                "SELECT\n",
                "  q.quote_id,\n",
                "  q.doc_type,\n",
                "  q.created_date,\n",
                "  q.valid_from,\n",
                "  q.valid_to,\n",
                "  q.customer,\n",
                "  q.country,\n",
                "  q.cs_team,\n",
                "  q.product_group,\n",
                "  q.quote_value,\n",
                "  q.rejection_reason,\n",
                "  q.sales_manager,\n",
                "  CASE\n",
                "    WHEN c.quote_number IS NOT NULL OR q.order_reason = '24' THEN 'Converted'\n",
                "    WHEN q.is_rejected = 1 OR q.order_reason = '25' THEN 'Rejected'\n",
                "    WHEN q.valid_to < CURRENT_DATE() THEN 'Expired'\n",
                "    ELSE 'Open'\n",
                "  END AS status,\n",
                "  COALESCE(orr.`Description`, q.order_reason) AS order_reason\n",
                "FROM\n",
                "  quotes q\n",
                "    LEFT JOIN converted c\n",
                "      ON c.quote_number = q.quote_id\n",
                "    LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_order_reason_desc` orr\n",
                "      ON q.order_reason = orr.`Order Reason Code`\n",
                "      AND orr.`Language Code` = 'E'\n",
                "ORDER BY\n",
                "  q.created_date DESC"
              ],
              "parameters": [
                {
                  "displayName": "Segment Filter",
                  "keyword": "segment_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
                      "dataType": "STRING"
                    }
                  }
                }
              ],
              "columns": [
                {
                  "displayName": "Value Category",
                  "description": "",
                  "expression": "CASE WHEN `quote_value` < 1000 THEN 'Small (< 1k)' WHEN `quote_value` < 5000 THEN 'Medium (1k-5k)' WHEN `quote_value` < 25000 THEN 'Large (5k-25k)' WHEN `quote_value` < 100000 THEN 'Key (25k-100k)' ELSE 'Strategic (100k+)' END"
                }
              ]
            },
            {
              "name": "ds_segment_options",
              "displayName": "ds_segment_options",
              "queryLines": [
                "SELECT DISTINCT\n",
                "  item.`Application area Description` AS segment\n",
                "FROM\n",
                "  `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` item\n",
                "WHERE\n",
                "  item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "  AND item.`Application area Description` IS NOT NULL\n",
                "  AND TRIM(item.`Application area Description`) != ''\n",
                "ORDER BY\n",
                "  1"
              ]
            },
            {
              "name": "ds_expiring_quotes",
              "displayName": "ds_expiring_quotes",
              "queryLines": [
                "WITH quotes AS (\n",
                "  SELECT\n",
                "    i.`Sales Document Number` AS quote_id,\n",
                "    TO_DATE(CAST(MAX(i.`Created On`) AS STRING), 'yyyyMMdd') AS created_date,\n",
                "    TO_DATE(CAST(MAX(i.`Quotation Valid To`) AS STRING), 'yyyyMMdd') AS valid_to,\n",
                "    MAX(COALESCE(c.`Name 1`, i.`Sold To Party`)) AS customer,\n",
                "    MAX(c.`Country`) AS country,\n",
                "    MAX(COALESCE(csm.`cs_team`, 'Unmapped')) AS cs_team,\n",
                "    MAX(COALESCE(ph.`L2 Product Description`, 'Unknown')) AS product_group,\n",
                "    MAX(i.`Application area Description`) AS segment,\n",
                "    ROUND(SUM(i.`Measure Net Value in Euro`), 0) AS quote_value,\n",
                "    MAX(COALESCE(se.`User Name`, i.`Sales Employee`)) AS sales_manager,\n",
                "    MAX(\n",
                "      CASE\n",
                "        WHEN COALESCE(i.`Reason for Rejection`, '') != '' THEN 1\n",
                "        ELSE 0\n",
                "      END\n",
                "    ) AS is_rejected,\n",
                "    MAX(i.`Order Reason`) AS order_reason\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` i\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON i.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_customer` c\n",
                "        ON i.`Customer Key` = c.`Customer Key`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_material` m\n",
                "        ON i.`Material Key` = m.`Material Key`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_product_hierarchy` ph\n",
                "        ON ph.`Material Code` = m.`Material Code`\n",
                "      LEFT JOIN `${var.source_catalog}`.pbi.`dbx_dim_users` se\n",
                "        ON i.`Sales Employee` = se.`User ID`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND i.`Sales Document Type` = 'YQT'\n",
                "    AND (\n",
                "      :segment_filter IS NULL\n",
                "      OR CARDINALITY(:segment_filter) = 0\n",
                "      OR array_contains(:segment_filter, i.`Application area Description`)\n",
                "    )\n",
                "    AND (\n",
                "      :country_filter IS NULL\n",
                "      OR CARDINALITY(:country_filter) = 0\n",
                "      OR array_contains(:country_filter, c.`Country`)\n",
                "    )\n",
                "  GROUP BY\n",
                "    1\n",
                "),\n",
                "converted AS (\n",
                "  SELECT DISTINCT\n",
                "    o.`Quote Number` AS quote_number\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` o\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON o.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND o.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    AND COALESCE(o.`Quote Number`, '') != ''\n",
                "    AND o.`Created On` >= CAST(CONCAT(YEAR(CURRENT_DATE()) - 2, '0101') AS INT)\n",
                "),\n",
                "quote_items AS (\n",
                "  SELECT\n",
                "    i.`Sales Document Number` AS quote_number,\n",
                "    i.`Material Code` AS material_code,\n",
                "    i.`Customer Key` AS customer_key,\n",
                "    TO_DATE(CAST(i.`Created On` AS STRING), 'yyyyMMdd') AS quote_created,\n",
                "    CASE\n",
                "      WHEN i.`Quotation Valid To` > 19700101\n",
                "      THEN TO_DATE(CAST(i.`Quotation Valid To` AS STRING), 'yyyyMMdd')\n",
                "      ELSE NULL\n",
                "    END AS quote_valid_to\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` i\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON i.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND i.`Sales Document Type` = 'YQT'\n",
                "    AND COALESCE(i.`Material Code`, '') != ''\n",
                "    AND i.`Material Code` != 'HN_DUMMY'\n",
                "),\n",
                "unlinked_orders AS (\n",
                "  SELECT\n",
                "    o.`Material Code` AS material_code,\n",
                "    o.`Customer Key` AS customer_key,\n",
                "    TO_DATE(CAST(o.`Created On` AS STRING), 'yyyyMMdd') AS order_created\n",
                "  FROM\n",
                "    `${var.source_catalog}`.pbi.`dbx_fact_sales_distribution_sales_document_item` o\n",
                "      INNER JOIN `${var.source_catalog}`.pbi.`dbx_dim_sales_organization` sorg\n",
                "        ON o.`Sales Organization Key` = sorg.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND o.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    AND o.`Created On` >= CAST(DATE_FORMAT(ADD_MONTHS(CURRENT_DATE(), -18), 'yyyyMMdd') AS INT)\n",
                "    AND COALESCE(o.`Material Code`, '') != ''\n",
                "    AND COALESCE(o.`Quote Number`, '') = ''\n",
                "    AND COALESCE(o.`Reason for Rejection`, '') = ''\n",
                "),\n",
                "quotes_with_match AS (\n",
                "  SELECT DISTINCT\n",
                "    qi.quote_number\n",
                "  FROM\n",
                "    quote_items qi\n",
                "      INNER JOIN unlinked_orders uo\n",
                "        ON qi.customer_key = uo.customer_key\n",
                "        AND qi.material_code = uo.material_code\n",
                "        AND uo.order_created >= qi.quote_created\n",
                "        AND uo.order_created <= COALESCE(qi.quote_valid_to, DATE_ADD(qi.quote_created, 60))\n",
                "),\n",
                "base AS (\n",
                "  SELECT\n",
                "    q.quote_id,\n",
                "    q.created_date,\n",
                "    q.valid_to,\n",
                "    DATEDIFF(q.valid_to, CURRENT_DATE()) AS days_to_expiry,\n",
                "    q.customer,\n",
                "    q.country,\n",
                "    q.cs_team,\n",
                "    q.product_group,\n",
                "    q.segment,\n",
                "    q.quote_value,\n",
                "    q.sales_manager,\n",
                "    CASE\n",
                "      WHEN\n",
                "        q.quote_value >= 100000\n",
                "        AND DATEDIFF(q.valid_to, CURRENT_DATE()) <= 14\n",
                "      THEN\n",
                "        'P1 - Critical'\n",
                "      WHEN q.quote_value >= 50000 THEN 'P2 - High'\n",
                "      WHEN DATEDIFF(q.valid_to, CURRENT_DATE()) <= 3 THEN 'P2 - High'\n",
                "      WHEN\n",
                "        DATEDIFF(q.valid_to, CURRENT_DATE()) <= 7\n",
                "        AND q.quote_value >= 10000\n",
                "      THEN\n",
                "        'P2 - High'\n",
                "      WHEN DATEDIFF(q.valid_to, CURRENT_DATE()) <= 7 THEN 'P3 - Medium'\n",
                "      ELSE 'P4 - Low'\n",
                "    END AS priority,\n",
                "    CASE\n",
                "      WHEN DATEDIFF(q.valid_to, CURRENT_DATE()) <= 3 THEN '0-3 days'\n",
                "      WHEN DATEDIFF(q.valid_to, CURRENT_DATE()) <= 7 THEN '4-7 days'\n",
                "      ELSE '8-14 days'\n",
                "    END AS days_bucket,\n",
                "    CASE\n",
                "      WHEN qm.quote_number IS NOT NULL THEN 'Yes'\n",
                "      ELSE 'No'\n",
                "    END AS has_order_match\n",
                "  FROM\n",
                "    quotes q\n",
                "      LEFT JOIN converted c\n",
                "        ON c.quote_number = q.quote_id\n",
                "      LEFT JOIN quotes_with_match qm\n",
                "        ON qm.quote_number = q.quote_id\n",
                "  WHERE\n",
                "    c.quote_number IS NULL\n",
                "    AND q.is_rejected = 0\n",
                "    AND COALESCE(q.order_reason, '') NOT IN ('24', '25')\n",
                "    AND q.valid_to >= CURRENT_DATE()\n",
                "    AND q.valid_to <= DATE_ADD(CURRENT_DATE(), 14)\n",
                ")\n",
                "SELECT\n",
                "  *\n",
                "FROM\n",
                "  base\n",
                "WHERE\n",
                "  (\n",
                "    :priority_filter IS NULL\n",
                "    OR CARDINALITY(:priority_filter) = 0\n",
                "    OR array_contains(:priority_filter, priority)\n",
                "  )\n",
                "  AND (\n",
                "    :days_bucket_filter IS NULL\n",
                "    OR CARDINALITY(:days_bucket_filter) = 0\n",
                "    OR array_contains(:days_bucket_filter, days_bucket)\n",
                "  )\n",
                "ORDER BY\n",
                "  valid_to ASC"
              ],
              "parameters": [
                {
                  "displayName": "Segment Filter",
                  "keyword": "segment_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
                      "dataType": "STRING"
                    }
                  }
                },
                {
                  "displayName": "Country Filter",
                  "keyword": "country_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
                      "dataType": "STRING"
                    }
                  }
                },
                {
                  "displayName": "Priority Filter",
                  "keyword": "priority_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
                      "dataType": "STRING"
                    }
                  }
                },
                {
                  "displayName": "Days Bucket Filter",
                  "keyword": "days_bucket_filter",
                  "dataType": "STRING",
                  "complexType": "MULTI",
                  "defaultSelection": {
                    "values": {
