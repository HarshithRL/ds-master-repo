                "source": "SELECT\n  u.usage_date,\n  u.sku_name,\n  u.usage_quantity,\n  u.usage_unit,\n  u.workspace_id,\n  u.billing_origin_product,\n  u.usage_type,\n  COALESCE(u.product_features.jobs_tier, 'N/A') AS jobs_tier,\n  COALESCE(u.product_features.sql_tier, 'N/A') AS sql_tier,\n  COALESCE(u.product_features.dlt_tier, 'N/A') AS dlt_tier,\n  u.product_features.is_serverless AS is_serverless,\n  u.product_features.is_photon AS is_photon,\n  COALESCE(u.usage_metadata.warehouse_id, u.usage_metadata.cluster_id, u.usage_metadata.endpoint_id, 'N/A') AS resource_id,\n  COALESCE(u.usage_metadata.job_name, u.usage_metadata.notebook_path, u.usage_metadata.endpoint_name, u.usage_metadata.run_name, 'Unattributed') AS workload_name,\n  COALESCE(lp.pricing.default, 0) AS list_price_per_dbu,\n  u.usage_quantity * COALESCE(lp.pricing.default, 0) AS estimated_cost_usd\nFROM system.billing.usage u\nLEFT JOIN system.billing.list_prices lp\n  ON u.cloud = lp.cloud\n  AND u.sku_name = lp.sku_name\n  AND u.usage_start_time >= lp.price_start_time\n  AND (lp.price_end_time IS NULL OR u.usage_start_time < lp.price_end_time)\nWHERE u.cloud = 'AZURE'\n  AND u.usage_date >= '2024-01-01'\n",
