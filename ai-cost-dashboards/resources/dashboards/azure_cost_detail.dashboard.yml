                "      ('2026-08-01'::date, 'DEFAULT_STORAGE', 0.001) AS t(month, product, billed_cost_usd)\n",
                ")\n",
                "SELECT\n",
                "  COALESCE(l.month, b.month) AS month,\n",
                "  COALESCE(l.product, b.product) AS product,\n",
                "  COALESCE(l.list_price_usd, 0) AS list_price_usd,\n",
                "  COALESCE(b.billed_cost_usd, 0) AS billed_cost_usd,\n",
                "  COALESCE(l.list_price_usd, 0) - COALESCE(b.billed_cost_usd, 0) AS diff_usd,\n",
                "  CASE\n",
                "    WHEN\n",
                "      b.billed_cost_usd > 0\n",
