# =============================================================================
# JOB: hello_world — Bronze → Silver → Gold demo
# =============================================================================
# Minimal working job that creates sample data, transforms it, and aggregates.
# Use this as a reference when building real project jobs.
# =============================================================================

resources:
  jobs:
    hello_world:
      name: hello_world

      # ── Schedule ──────────────────────
      schedule:
        quartz_cron_expression: 0 0 7 * * ?
        timezone_id: Europe/Brussels
        pause_status: PAUSED

      # ── Tasks (Bronze → Silver → Gold) ─────────
      tasks:
        - task_key: Bronze_Ingest
          notebook_task:
            notebook_path: ../src/notebooks/01_bronze_ingest.py
          job_cluster_key: hello_world_cluster

        - task_key: Silver_Transform
          depends_on:
            - task_key: Bronze_Ingest
          notebook_task:
            notebook_path: ../src/notebooks/02_silver_transform.py
          job_cluster_key: hello_world_cluster

        - task_key: Gold_Aggregate
          depends_on:
            - task_key: Silver_Transform
          notebook_task:
            notebook_path: ../src/notebooks/03_gold_aggregate.py
          job_cluster_key: hello_world_cluster

      # ── Cluster Config ─────────────────
      job_clusters:
        - job_cluster_key: hello_world_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            enable_elastic_disk: true
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 2

      # ── Queue ─────────────────────────
      queue:
        enabled: true

      # ── Permissions ────────────────────
      # Add your team members here:
      #   - user_name: your.email@etexgroup.com
      #     level: CAN_MANAGE
