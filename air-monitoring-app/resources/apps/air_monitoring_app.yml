resources:
  apps:
    air_monitoring_app:
      name: air-monitoring-app
      description: "Air quality monitoring app for Etex manufacturing sites"
      source_code_path: ../../src
      user_api_scopes:
        - sql
      resources:
        - name: "sql-warehouse"
          description: "SQL warehouse for air monitoring queries"
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
