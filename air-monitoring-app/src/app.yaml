# Air Monitoring V2 App — TEST/DEV environment (automation_d)
# Workspace: https://adb-7181820732839861.1.azuredatabricks.net/
# NOTE: This file is the default for direct Git deploy (source_code_path: src).
# For ACC/PRD, the CI/CD pipeline uses config/app.{acc,prd}.yaml instead.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "69ada62b2fb9b9e2"
  - name: UNITY_CATALOG
    value: "automation_d"
  - name: BRONZE_SCHEMA
    value: "bronze"
  - name: VOLUME_NAME
    value: "bronze_volume"
  - name: AUTH_MODE
    value: "user"
  - name: DOC_INTELLIGENCE_ENDPOINT
    valueFrom: doc-intelligence-endpoint
  - name: DOC_INTELLIGENCE_KEY
    valueFrom: doc-intelligence-key
  - name: OPENAI_API_KEY
    valueFrom: openai-key

resources:
  - name: "sql-warehouse"
    sql_warehouse:
      id: "69ada62b2fb9b9e2"
      permission: "CAN_USE"
  - name: "doc-intelligence-endpoint"
    secret:
      scope: "WE-SPOKE-MDP-AUT-T-KV"
      key: "ds-we-spoke-mdp-formrecogniser-endpoint"
      permission: "READ"
  - name: "doc-intelligence-key"
    secret:
      scope: "WE-SPOKE-MDP-AUT-T-KV"
      key: "ds-we-spoke-mdp-t-formrecogniser-key1"
      permission: "READ"
  - name: "openai-key"
    secret:
      scope: "WE-SPOKE-MDP-AUT-T-KV"
      key: "ds-we-spoke-mdp-openai"
      permission: "READ"
