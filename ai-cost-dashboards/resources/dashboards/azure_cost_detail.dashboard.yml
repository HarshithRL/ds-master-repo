resources:
  dashboards:
    azure_cost_detail:
      display_name: "AI Cost Dashboard"
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "overview",
              "displayName": "Azure Costs by Domain excluding Infrastructure",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date,\n  subscriptionname,\n  resourcegroupname,\n  spoke,\n  COALESCE(application, 'Untagged') AS application,\n  environment,\n  cost_domain,\n  service_category,\n  is_ai,\n  SUM(cost_eur) AS cost_eur,\n  SUM(cost_usd) AS cost_usd,\n  SUM(quantity) AS quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain IS NULL OR cost_domain <> 'Infrastructure'\nGROUP BY ALL\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  },
                  {
                    "name": "is_ai",
                    "expr": "is_ai"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_quantity",
                    "expr": "SUM(quantity)"
                  },
                  {
                    "name": "foundry_cost_eur",
                    "expr": "SUM(CASE WHEN cost_domain = 'AI Foundry' THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "copilot_cost_eur",
                    "expr": "SUM(CASE WHEN cost_domain = 'Copilot' THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "databricks_ai_cost_eur",
                    "expr": "SUM(CASE WHEN cost_domain = 'Databricks' AND is_ai THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "infrastructure_cost_eur",
                    "expr": "SUM(CASE WHEN cost_domain = 'Infrastructure' THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "ai_cost_eur",
                    "expr": "SUM(CASE WHEN is_ai THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  }
                ]
              }
            },
            {
              "name": "copilot",
              "displayName": "GitHub Copilot Costs",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date, subscriptionname, resourcegroupname, resource_name, resource_type, azure_region,\n  metername, productname, cost_domain, service_category, spoke,\n  COALESCE(application, 'Untagged') AS application,\n  service,\n  COALESCE(model, 'Not specified') AS model,\n  COALESCE(ai_capability, 'Other AI') AS ai_capability,\n  environment, company, application_inferred, spoke_inferred, model_inferred,\n  cost_eur, cost_usd, quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain = 'Copilot'\n  AND COALESCE(ai_capability, '') <> 'Copilot Studio'\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "metername",
                    "expr": "metername"
                  },
                  {
                    "name": "productname",
                    "expr": "productname"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "service",
                    "expr": "service"
                  },
                  {
                    "name": "model",
                    "expr": "model"
                  },
                  {
                    "name": "ai_capability",
                    "expr": "ai_capability"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "model_group",
                    "expr": "CASE\n  WHEN model = 'GitHub Copilot' THEN 'GitHub Copilot'\n  WHEN UPPER(model) LIKE '%GROK%' THEN 'Grok'\n  WHEN model = 'Copilot Studio' THEN 'Copilot Studio'\n  WHEN model = 'Not specified' THEN 'Not specified'\n  ELSE 'Other'\nEND\n"
                  },
                  {
                    "name": "rg_group",
                    "expr": "CASE\n  WHEN UPPER(resourcegroupname) LIKE '%COPILOT%' THEN 'Copilot'\n  WHEN resourcegroupname = '' OR resourcegroupname IS NULL THEN 'GitHub Copilot (SaaS)'\n  ELSE 'Other'\nEND\n"
                  },
                  {
                    "name": "app_group",
                    "expr": "CASE\n  WHEN application = 'GitHub Copilot' THEN 'GitHub Copilot'\n  WHEN application = 'Copilot Studio' THEN 'Copilot Studio'\n  WHEN application = 'Low Code Copilot' THEN 'Low Code Copilot'\n  WHEN application = 'Untagged' THEN 'Untagged'\n  ELSE 'Other Apps'\nEND\n"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  },
                  {
                    "name": "azure_resource_name",
                    "expr": "resource_name",
                    "displayName": "Azure Resource Name"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_quantity",
                    "expr": "SUM(quantity)"
                  },
                  {
                    "name": "line_items",
                    "expr": "COUNT(*)"
                  },
                  {
                    "name": "active_applications",
                    "expr": "COUNT(DISTINCT CASE WHEN application <> 'Untagged' THEN application END)"
                  },
                  {
                    "name": "billing_days",
                    "expr": "COUNT(DISTINCT cost_date)"
                  },
                  {
                    "displayName": "Avg Daily Seats",
                    "format": {
                      "type": "number",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 1.0
                      }
                    },
                    "name": "avg_daily_seats",
                    "expr": "SUM(quantity) / COUNT(DISTINCT cost_date)",
                    "comment": "Average number of GitHub Copilot seats billed per day"
                  },
                  {
                    "displayName": "Cost per Seat-Day (EUR)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    },
                    "name": "cost_per_seat_day",
                    "expr": "SUM(cost_eur) / NULLIF(SUM(quantity), 0)",
                    "comment": "Average EUR cost per seat per day"
                  },
                  {
                    "displayName": "Copilot Seats",
                    "format": {
                      "type": "number",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 0.0
                      }
                    },
                    "name": "copilot_seats",
                    "expr": "MAX(CASE WHEN metername = 'Business User' THEN ROUND(quantity * DAY(LAST_DAY(cost_date))) END)",
                    "comment": "Number of GitHub Copilot Business seats (derived from prorated daily quantity)"
                  },
                  {
                    "displayName": "Monthly Cost per Seat (EUR)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    },
                    "name": "monthly_cost_per_seat",
                    "expr": "SUM(CASE WHEN metername = 'Business User' THEN cost_eur ELSE 0 END) / NULLIF(MAX(CASE WHEN metername = 'Business User' THEN ROUND(quantity * DAY(LAST_DAY(cost_date))) END), 0)",
                    "comment": "Average monthly seat license cost in EUR (Business User meter total / seat count)"
                  }
                ]
              }
            },
            {
              "name": "copilot_studio",
              "displayName": "Copilot Studio Costs",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date, subscriptionname, resourcegroupname, resource_name, resource_type, azure_region,\n  metername, productname, cost_domain, service_category, spoke,\n  COALESCE(application, 'Untagged') AS application,\n  service,\n  COALESCE(model, 'Not specified') AS model,\n  COALESCE(ai_capability, 'Other AI') AS ai_capability,\n  environment, company, application_inferred, spoke_inferred, model_inferred,\n  cost_eur, cost_usd, quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain = 'Copilot'\n  AND ai_capability = 'Copilot Studio'\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "metername",
                    "expr": "metername"
                  },
                  {
                    "name": "productname",
                    "expr": "productname"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "service",
                    "expr": "service"
                  },
                  {
                    "name": "model",
                    "expr": "model"
                  },
                  {
                    "name": "ai_capability",
                    "expr": "ai_capability"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  },
                  {
                    "name": "azure_resource_name",
                    "expr": "resource_name",
                    "displayName": "Azure Resource Name"
                  },
                  {
                    "name": "billing_policy",
                    "expr": "resource_name",
                    "displayName": "Billing Policy / Environment",
                    "comment": "Power Platform billing policy or environment charged for the credits"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_credits",
                    "expr": "SUM(quantity)",
                    "displayName": "Copilot Credits",
                    "format": {
                      "type": "number",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 0.0
                      }
                    }
                  },
                  {
                    "name": "cost_per_credit",
                    "expr": "SUM(cost_eur) / NULLIF(SUM(quantity), 0)",
                    "displayName": "Cost per Credit (EUR)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 4.0
                      }
                    }
                  },
                  {
                    "name": "line_items",
                    "expr": "COUNT(*)"
                  }
                ]
              }
            },
            {
              "name": "ai_foundry",
              "displayName": "Azure AI Foundry Costs",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date, subscriptionname, resourcegroupname, resource_name, resource_type, azure_region,\n  metername, productname, cost_domain, service_category, spoke,\n  COALESCE(application, 'Untagged') AS application,\n  service,\n  COALESCE(model, 'Not specified') AS model,\n  COALESCE(ai_capability, 'Other AI') AS ai_capability,\n  environment, company, application_inferred, spoke_inferred, model_inferred,\n  cost_eur, cost_usd, quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain = 'AI Foundry'\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "metername",
                    "expr": "metername"
                  },
                  {
                    "name": "productname",
                    "expr": "productname"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "service",
                    "expr": "service"
                  },
                  {
                    "name": "model",
                    "expr": "model"
                  },
                  {
                    "name": "ai_capability",
                    "expr": "ai_capability"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "model_group",
                    "expr": "CASE\n  WHEN UPPER(model) LIKE '%GPT-4O%' OR UPPER(model) LIKE '%GPT-40%' OR UPPER(model) LIKE '%GPT-4-O%' OR model = 'cog-genai-openai-4o' THEN 'GPT-4o family'\n  WHEN UPPER(model) LIKE '%GPT-4.1%' OR UPPER(model) LIKE '%GPT-4-1%' THEN 'GPT-4.1 family'\n  WHEN UPPER(model) LIKE '%GPT-5%' THEN 'GPT-5 family'\n  WHEN UPPER(model) LIKE '%GPT-3%' THEN 'GPT-3.5'\n  WHEN UPPER(model) LIKE '%GPT-IMAGE%' OR UPPER(model) LIKE '%SORA%' THEN 'GPT Image / Video'\n  WHEN UPPER(model) LIKE '%O1%' OR UPPER(model) LIKE '%O3%' THEN 'o-series (o1/o3)'\n  WHEN UPPER(model) LIKE '%EMBEDDING%' THEN 'Embeddings'\n  WHEN model LIKE 'cog-genai%' THEN 'Cognitive Services'\n  WHEN UPPER(model) LIKE '%MISTRAL%' THEN 'Mistral'\n  WHEN UPPER(model) LIKE '%CLAUDE%' OR UPPER(model) LIKE '%ANTHROPIC%' THEN 'Claude / Anthropic'\n  WHEN model LIKE 'Premium%DBU' THEN 'Databricks Inference'\n  WHEN UPPER(model) LIKE '%GROK%' THEN 'Grok'\n  WHEN model = 'Copilot Studio' THEN 'Copilot Studio'\n  WHEN model = 'Not specified' THEN 'Not specified'\n  ELSE 'Other'\nEND\n"
                  },
                  {
                    "name": "rg_group",
                    "expr": "CASE\n  WHEN UPPER(resourcegroupname) LIKE '%ETEXMATE%' THEN 'Etex Mate'\n  WHEN UPPER(resourcegroupname) LIKE '%MDP-COGNITIVE%' THEN 'MDP Cognitive'\n  WHEN UPPER(resourcegroupname) LIKE '%MDP-DBW%' THEN 'MDP Databricks'\n  WHEN UPPER(resourcegroupname) LIKE '%COGNIZANT%' OR UPPER(resourcegroupname) LIKE '%VOICEAI%' THEN 'Cognizant / DMZ'\n  WHEN UPPER(resourcegroupname) LIKE '%UIPATH%' THEN 'UiPath'\n  WHEN UPPER(resourcegroupname) LIKE '%DIGITAL%' THEN 'Digital'\n  WHEN UPPER(resourcegroupname) LIKE '%GAMAI%' THEN 'GAM AI Assistant'\n  WHEN UPPER(resourcegroupname) LIKE '%PLAYGROUND%' OR UPPER(resourcegroupname) LIKE '%SANDBOX%' THEN 'Sandbox / Test'\n  ELSE 'Other'\nEND\n"
                  },
                  {
                    "name": "azure_resource_name",
                    "expr": "resource_name",
                    "displayName": "Azure Resource Name",
                    "comment": "Standardised Azure resource name (upper-case, parent resource, marketplace suffix removed)"
                  },
                  {
                    "name": "azure_region",
                    "expr": "azure_region",
                    "displayName": "Azure Region",
                    "comment": "Derived from resource group prefix"
                  },
                  {
                    "name": "app_group",
                    "expr": "CASE\n  WHEN application = 'Etex Mate' THEN 'Etex Mate'\n  WHEN application LIKE 'MDP%' THEN 'MDP Platform'\n  WHEN application IN ('GenAI', 'GenAI-ChatBot', 'Cognizant GenAI Bot') THEN 'GenAI Apps'\n  WHEN application = 'UiPath' THEN 'UiPath'\n  WHEN application = 'VAP' THEN 'VAP'\n  WHEN application IN ('SB', 'Sandbox', 'Azure OpenAI', 'Citadel') THEN 'Sandbox / Test'\n  WHEN application = 'Untagged' THEN 'Untagged'\n  ELSE 'Other Apps'\nEND\n"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_quantity",
                    "expr": "SUM(quantity)"
                  },
                  {
                    "name": "line_items",
                    "expr": "COUNT(*)"
                  },
                  {
                    "name": "active_applications",
                    "expr": "COUNT(DISTINCT CASE WHEN application <> 'Untagged' THEN application END)"
                  },
                  {
                    "name": "avg_unit_cost",
                    "expr": "SUM(cost_eur) / NULLIF(SUM(quantity), 0)"
                  }
                ]
              }
            },
            {
              "name": "infrastructure",
              "displayName": "Infrastructure Costs",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date,\n  subscriptionname,\n  resourcegroupname,\n  spoke,\n  COALESCE(application, 'Untagged') AS application,\n  environment,\n  cost_domain,\n  service_category,\n  metercategory,\n  metersubcategory,\n  metername,\n  SUM(cost_eur) AS cost_eur,\n  SUM(cost_usd) AS cost_usd,\n  SUM(quantity) AS quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain = 'Infrastructure'\nGROUP BY ALL\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  },
                  {
                    "name": "metercategory",
                    "expr": "metercategory"
                  },
                  {
                    "name": "metersubcategory",
                    "expr": "metersubcategory"
                  },
                  {
                    "name": "metername",
                    "expr": "metername"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_quantity",
                    "expr": "SUM(quantity)"
                  },
                  {
                    "name": "avg_daily_cost_eur",
                    "expr": "SUM(cost_eur) / NULLIF(COUNT(DISTINCT cost_date), 0)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    },
                    "comment": "Average cost per billing day, EUR"
                  },
                  {
                    "name": "resource_groups",
                    "expr": "COUNT(DISTINCT resourcegroupname)"
                  }
                ]
              }
            },
            {
              "name": "databricks_azure",
              "displayName": "Databricks Costs (Azure invoice)",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT\n  cost_date,\n  subscriptionname,\n  resourcegroupname,\n  spoke,\n  COALESCE(application, 'Untagged') AS application,\n  environment,\n  cost_domain,\n  service_category,\n  resource_name,\n  metercategory,\n  metersubcategory,\n  metername,\n  ai_capability,\n  is_ai,\n  SUM(cost_eur) AS cost_eur,\n  SUM(cost_usd) AS cost_usd,\n  SUM(quantity) AS quantity\nFROM ${var.catalog}.gold.ai_foundry_costs_enriched\nWHERE cost_domain = 'Databricks'\nGROUP BY ALL\n",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "subscriptionname",
                    "expr": "subscriptionname"
                  },
                  {
                    "name": "resourcegroupname",
                    "expr": "resourcegroupname"
                  },
                  {
                    "name": "spoke",
                    "expr": "spoke"
                  },
                  {
                    "name": "application",
                    "expr": "application"
                  },
                  {
                    "name": "environment",
                    "expr": "environment"
                  },
                  {
                    "name": "cost_domain",
                    "expr": "cost_domain"
                  },
                  {
                    "name": "service_category",
                    "expr": "service_category"
                  },
                  {
                    "name": "resource_name",
                    "expr": "resource_name"
                  },
                  {
                    "name": "metercategory",
                    "expr": "metercategory"
                  },
                  {
                    "name": "metersubcategory",
                    "expr": "metersubcategory"
                  },
                  {
                    "name": "metername",
                    "expr": "metername"
                  },
                  {
                    "name": "ai_capability",
                    "expr": "ai_capability"
                  },
                  {
                    "name": "is_ai",
                    "expr": "is_ai"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    }
                  },
                  {
                    "name": "total_cost_usd",
                    "expr": "SUM(cost_usd)"
                  },
                  {
                    "name": "total_quantity",
                    "expr": "SUM(quantity)"
                  },
                  {
                    "name": "databricks_ai_cost_eur",
                    "expr": "SUM(CASE WHEN is_ai THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
                        "type": "exact",
                        "places": 2.0
                      }
                    },
                    "comment": "Azure-billed Databricks services classified as AI, including Claude via Databricks and model serving"
                  },
                  {
                    "name": "databricks_infrastructure_cost_eur",
                    "expr": "SUM(CASE WHEN COALESCE(is_ai, FALSE) = FALSE THEN cost_eur ELSE 0 END)",
                    "format": {
                      "type": "currency",
                      "currencyCode": "EUR",
                      "decimalPlaces": {
