# Air Monitoring App — managed by Declarative Automation Bundle
# SQL_WAREHOUSE_ID is injected via the app resource (valueFrom).
# UNITY_CATALOG is auto-detected from DATABRICKS_HOST at runtime by config.py.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"
env:
