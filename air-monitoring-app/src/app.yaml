# Air Monitoring V2 App — TEST/DEV environment (automation_d)
# Workspace: https://adb-7181820732839861.1.azuredatabricks.net/
# Secrets: Read at runtime via Databricks SDK using the user's OAuth token.
#          The secret resources below grant the 'secrets' OAuth scope to the token.
#          The user's own Azure AD identity provides Key Vault access.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "69ada62b2fb9b9e2"
  - name: UNITY_CATALOG
    value: "automation_d"
  - name: BRONZE_SCHEMA
    value: "bronze"
  - name: VOLUME_NAME
    value: "bronze_volume"
  - name: AUTH_MODE
    value: "user"
  - name: DOC_INTELLIGENCE_ENDPOINT
    value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
  - name: DOC_INTELLIGENCE_KEY
    value: "1bdb532656d248bda3c6b58a9b75441f"
  - name: OPENAI_API_KEY
    value: "CqKjJbBku9Uf2PQLxKvDgaXF5xt3BU5u8yvQJsev3cwfycMxVosuJQQJ99BCACHYHv6XJ3w3AAAAACOGmDfg"
  - name: AZURE_TENANT_ID
    value: "e23c7299-f64d-4de4-a6a1-b40d3145528c"
  - name: USE_KEYVAULT
    value: "false"

resources:
  - name: "sql-warehouse"
    sql_warehouse:
      id: "69ada62b2fb9b9e2"
      permission: "CAN_USE"


