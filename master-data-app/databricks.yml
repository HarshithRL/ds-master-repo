bundle:
  name: ds-master-data-app

include:
  - resources/jobs/*.yml

variables:
  catalog:
    description: Existing environment catalog. The setup job writes only to its bronze schema.

  policy_id:
    description: Existing cluster policy used by the setup job.

  warehouse_id:
    description: Environment-specific SQL warehouse used by the app.
    default: "69ada62b2fb9b9e2"

  sap_user:
    description: SAP technical username.
    default: "INT_DATABRIK"

  sap_password:
    description: Environment-specific SAP password. Supplied during deployment.

targets:
  D:
    mode: development
    default: true

    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}

    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      sap_password: "XrU7ZvCiTF\rjKy"

    resources:
      jobs:
        master_data_app_setup_tables:
          permissions:
            - user_name: mustafaarda.bicakci@etexgroup.com
              level: CAN_MANAGE

  T:
    mode: production

    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}

    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      warehouse_id: "69ada62b2fb9b9e2"
      sap_password: "XrU7ZvCiTF\rjKy"

    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE

    resources:
      apps:
        ds_master_data_app:
          name: ds-master-data-app
          description: Customer master data request app (test)
          source_code_path: src

          user_api_scopes:
            - sql

          config:
            env:
              - name: SAP_USER
                value: ${var.sap_user}

              - name: SAP_PASSWORD
                value: ${var.sap_password}

          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE

  A:
    mode: production

    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}

    variables:
      catalog: automation_a
      policy_id: 306312B973005677
      warehouse_id: "d0aa411377ac7611"
      sap_password: "RvRBoKHd)xki8vZ"

    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE

    resources:
      apps:
        ds_master_data_app:
          name: ds-master-data-app
          description: Customer master data request app (acceptance)
          source_code_path: src

          permissions:
            - user_name: anastasija.lebedeva@etexgroup.com
              level: CAN_MANAGE

            - group_name: AUTOMATION.MASTERDATAAPP.CONSUMER.WRITE
              level: CAN_USE

            - group_name: AUTOMATION.MASTERDATAAPP.CONSUMER.READ
              level: CAN_USE

          user_api_scopes:
            - sql

          config:
            env:
              - name: SAP_USER
                value: ${var.sap_user}

              - name: SAP_PASSWORD
                value: ${var.sap_password}

          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE

  P:
    mode: production

    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}

    variables:
      catalog: automation_p
      policy_id: 306312B973005150
      warehouse_id: "71c2830f1b638f65"
      sap_password: "bTf7BYm(KUvovNb"

    permissions:
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE

    resources:
      apps:
        ds_master_data_app:
          name: ds-master-data-app
          description: Customer master data request app (production)
          source_code_path: src

          permissions:
            - user_name: anastasija.lebedeva@etexgroup.com
              level: CAN_MANAGE

            - group_name: AUTOMATION.MASTERDATAAPP.CONSUMER.WRITE
              level: CAN_USE

            - group_name: AUTOMATION.MASTERDATAAPP.CONSUMER.READ
              level: CAN_USE

          user_api_scopes:
            - sql

          config:
            env:
              - name: SAP_USER
                value: ${var.sap_user}

              - name: SAP_PASSWORD
                value: ${var.sap_password}

          resources:
            - name: sql-warehouse
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE

                