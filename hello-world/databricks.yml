# =============================================================================
# DATABRICKS ASSET BUNDLE — hello-world
# =============================================================================
# Self-contained example project demonstrating the DS-Master-Repo pattern.
# Copy this entire folder to create a new project.
#
# This bundle deploys a simple Bronze → Silver → Gold job to demonstrate
# environment-aware catalog resolution, medallion layering, and scheduling.
# =============================================================================

bundle:
  name: ds-cicd-hello-world

include:
  - resources/*.yml

variables:
  policy_id:
    description: Cluster policy ID to use
  catalog:
    description: The Unity Catalog to use (contains bronze/silver/gold schemas)

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005677
      catalog: automation_a
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005150
      catalog: automation_p
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE