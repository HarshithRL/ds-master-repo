# Air Monitoring V2 App — TEST/DEV environment (automation_d)
# Workspace: https://adb-7181820732839861.1.azuredatabricks.net/
# NOTE: This file is the default for direct Git deploy (source_code_path: src).
# For ACC/PRD, the CI/CD pipeline uses config/app.{acc,prd}.yaml instead.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "69ada62b2fb9b9e2"
  - name: UNITY_CATALOG
    value: "automation_d"
  - name: BRONZE_SCHEMA
    value: "bronze"
  - name: VOLUME_NAME
    value: "bronze_volume"
  - name: AUTH_MODE
    value: "user"
  - name: AZURE_KEYVAULT_URL
    value: "https://WE-SPOKE-MDP-AUT-T-KV.vault.azure.net/"
  - name: AZURE_TENANT_ID
    value: "e23c7299-f64d-4de4-a6a1-b40d3145528c"

resources:
  - name: "sql-warehouse"
    sql_warehouse:
      id: "69ada62b2fb9b9e2"
      permission: "CAN_USE"
