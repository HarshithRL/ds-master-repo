name: "Automation_Deploy_Databricks_ACC"

resources:
  repositories:
    - repository: da-mdp-foundations-deployments
      type: git
      name: da-mdp-foundations-deployments
      ref: refs/heads/main

trigger:
  branches:
    include:
      - acc
  paths:
    exclude:
      - '*.md'
      - 'pipelines/**'

variables:
  - template: variables/databricks_variables_acc.yml

stages:
  # Stage 1: Bundle deploy (uploads src/ including updated config.py to workspace)
  - template: pipelines/templates/deploy_databricks.yml@da-mdp-foundations-deployments
    parameters:
      env: ${{ variables.PIPELINE_ENV }}
      envLong: ${{ variables.ENV_LONG }}
      subscriptionName: ${{ variables.SUBSCRIPTION_NAME }}
      keyVaultName: ${{ variables.KEYVAULT_NAME }}
      spnIdSecretName: ${{ variables.SPN_ID_SECRET_NAME }}
      spnSecretSecretName: ${{ variables.SPN_SECRET_SECRET_NAME }}
      tenantIdSecretName: ${{ variables.TENANT_SECRET_NAME }}
      adbHostnameSecretName: ${{ variables.ADB_HOST_SECRET_NAME }}
      dbxProfile: ${{ variables.DBX_PROFILE }}

  # Stage 2: Trigger app deployment (restart with new code)
  # config.py now auto-detects environment from DATABRICKS_HOST,
  # so even if app.yaml has stale values, the app self-corrects.
  - stage: Deploy_App
    displayName: 'Deploy Air Monitoring App'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: deploy_app
        displayName: 'Deploy App to ACC'
        steps:
          - checkout: self

          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'

          # Read Databricks SPN from Foundations Key Vault
          # NOTE: If this fails due to KV IP firewall, manually press
          # Deploy in the ACC Apps UI — Stage 1 already uploaded the code.
          - task: AzureKeyVault@2
            inputs:
              azureSubscription: ${{ variables.SUBSCRIPTION_NAME }}
              KeyVaultName: ${{ variables.KEYVAULT_NAME }}
              SecretsFilter: '${{ variables.SPN_ID_SECRET_NAME }},${{ variables.SPN_SECRET_SECRET_NAME }},${{ variables.TENANT_SECRET_NAME }},${{ variables.ADB_HOST_SECRET_NAME }}'
              RunAsPreJob: false
            displayName: 'Read SPN credentials from Key Vault'

          - script: |
              set -euo pipefail

              # OAuth M2M auth (same SPN as Stage 1)
              export DATABRICKS_HOST="https://$(etex-spoke-mdp-adb-a-hostname)"
              export ARM_CLIENT_ID="$(etex-spoke-mdp-automation-devops-acc-id)"
              export ARM_CLIENT_SECRET="$(etex-spoke-mdp-automation-devops-acc-secret)"
              export ARM_TENANT_ID="$(etex-tenant-id)"

              echo "Deploying app on: $DATABRICKS_HOST"

              # Trigger app deploy (restarts app with latest code from workspace)
              # config.py will auto-detect ACC env from DATABRICKS_HOST
              databricks apps deploy air-monitoring-app \
                --source-code-path "/Workspace/automation/ds-air-monitoring-app/A/files/src"

              echo "✅ App deployment triggered"
            displayName: 'Trigger App Deploy'
