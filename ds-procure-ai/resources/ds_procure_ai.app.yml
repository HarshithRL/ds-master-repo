resources:
  apps:
    ds_procure_ai:
      name: ds-procure-ai
      description: Mate procurement AI assistant (Flask + React + AI Brain)
      source_code_path: ..
      compute_size: LARGE
      lifecycle:
        started: true
      user_api_scopes:
        # Visitor OBO (X-Forwarded-Access-Token) for ChatDatabricks / system.ai.
        # iam.current-user:read is a platform default; sending it on create
        # returns 400 INVALID_PARAMETER_VALUE on this workspace.
        # serving.serving-endpoints is deprecated; keep it plus model-serving.
        # sql: required for Mate UC DBSQL via visitor OBO (warehouse + Delta).
        # files.files: UC volume mkdir/upload via visitor OBO (WRITE VOLUME on the user).
        - ai-gateway
        - model-serving
        - serving.serving-endpoints
        - postgres
        - catalog.catalogs
        - catalog.schemas
        - sql
        - files.files
      config:
        env:
          - name: DATABRICKS_MODEL
            value: ${var.databricks_model}
          - name: DATABRICKS_FAST_MODEL
            value: ${var.fast_model}
          - name: DATABRICKS_THINKING_MODEL
            value: ${var.thinking_model}
          - name: FLASK_SECRET_KEY
            value: ${bundle.name}-${bundle.target}
          # Mate UC app-data (default sqlite until cutover). Catalog from var.catalog per target.
          - name: MATE_DB_BACKEND
            value: uc
          - name: MATE_UC_AUTH
            value: obo
          - name: MATE_UC_CATALOG
            value: ${var.catalog}
          - name: MATE_UC_SCHEMA
            value: bronze
          - name: MATE_UC_VOLUME
            value: bronze_volume
          - name: DATABRICKS_FAST_ENDPOINT
            value: databricks-claude-sonnet-4-5
          - name: DATABRICKS_THINKING_ENDPOINT
            value: databricks-claude-opus-4-6
          # Warehouse id from var.sql_warehouse_id per target (D/T vs A).
          - name: DATABRICKS_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
      resources:
        # Keep existing attachments. Replacing this array wholesale (update_mask=resources)
        # would detach anything omitted here.
        # ChatDatabricks uses visitor OBO + AI Gateway (system.ai.*). These FM
        # serving endpoints also grant the app SP CAN_QUERY as a fallback.
        - name: serving-endpoint
          serving_endpoint:
            name: databricks-claude-sonnet-4-5
            permission: CAN_QUERY
        - name: serving-endpoint-opus-46
          serving_endpoint:
            name: databricks-claude-opus-4-6
            permission: CAN_QUERY
        - name: serving-endpoint-opus-45
          serving_endpoint:
            name: databricks-claude-opus-4-5
            permission: CAN_QUERY
        - name: embedding-endpoint
          serving_endpoint:
            name: databricks-gte-large-en
            permission: CAN_QUERY
        # secret-key (scope procure-ai) is attached only on D/T, where it exists.
        # Autoscaling Lakebase — use `postgres` (branch + database paths).
        # Legacy `database` / instance_name is Provisioned-only and will fail.
        # Schema mate_agent is created by the app SP on first ACC boot.
        # Do not DROP it on later deploys.
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
