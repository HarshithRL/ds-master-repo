resources:
  dashboards:
    industry_open_orders:
      display_name: "Industry Division \u2014 Open Orders CX Summary"
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
      permissions:
        - user_name: blossom.alva@etexgroup.com
          level: CAN_READ
        - user_name: francois.leclercq@etexgroup.com
          level: CAN_MANAGE
        - user_name: roberta.villa@etexgroup.com
          level: CAN_READ
        - user_name: sabu.thomas@etexgroup.com
          level: CAN_READ
        - user_name: wouter.toonder@etexgroup.com
          level: CAN_READ
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "ds_current_month_by_team",
              "displayName": "Current Month by Team",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_current_month_by_team_result${var.result_suffix}`\n",
                "ORDER BY total_eur DESC\n"
              ],
              "columns": [
                {
                  "displayName": "Total Allocated EUR",
                  "description": "",
                  "expression": "SUM(`total_eur`)"
                },
                {
                  "displayName": "Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(`open_past_due_eur`)"
                },
                {
                  "displayName": "Billed + Delivered Pct",
                  "description": "",
                  "expression": "SUM(`billed_eur` + `delivered_not_billed_eur`) / SUM(`total_eur`)"
                }
              ]
            },
            {
              "name": "ds_order_size_dist",
              "displayName": "Order Size Distribution",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_order_size_dist_result${var.result_suffix}`\n",
                "ORDER BY segment, bucket_order\n"
              ]
            },
            {
              "name": "ds_daily_tracking",
              "displayName": "Daily Tracking - Quotations & Complaints",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_daily_tracking_result${var.result_suffix}`\n",
                "ORDER BY category\n"
              ]
            },
            {
              "name": "ds_all_open_orders",
              "displayName": "All Open Orders with Priority",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_all_open_orders_result${var.result_suffix}`\n"
              ],
              "columns": [
                {
                  "displayName": "Date Bucket",
                  "description": "",
                  "expression": "CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) AND `planned_gi_date` <= CAST(LAST_DAY(CURRENT_DATE()) AS DATE) THEN 'Current Month' WHEN `planned_gi_date` < CAST(CURRENT_DATE() AS DATE) AND `planned_gi_date` >= CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) THEN 'Past Due YTD' WHEN `planned_gi_date` < CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) THEN 'Past Due Prior Year' ELSE 'Future' END"
                },
                {
                  "displayName": "CM Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) AND `planned_gi_date` < CAST(CURRENT_DATE() AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Not Yet Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(CURRENT_DATE() AS DATE) AND `planned_gi_date` <= CAST(LAST_DAY(CURRENT_DATE()) AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "YTD Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) AND `planned_gi_date` < CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "Total Open EUR",
                  "description": "",
                  "expression": "SUM(`open_value_eur`)"
                }
              ]
            },
            {
              "name": "ds_overview_allocation",
              "displayName": "Overview Allocation (Consolidated)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_overview_allocation_result${var.result_suffix}`\n"
              ],
              "columns": [
                {
                  "displayName": "CM Total EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Billed+Delivered EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket` IN ('Billed', 'Delivered (not billed)') THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Open Past Due' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "YTD Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='YTD' AND `bucket`='Open Past Due' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "Billed+Delivered Pct",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket` IN ('Billed', 'Delivered (not billed)') THEN `value_eur` ELSE 0 END) / NULLIF(SUM(CASE WHEN `scope`='CM' THEN `value_eur` ELSE 0 END), 0)"
                },
                {
                  "displayName": "CM Billed EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Billed' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Delivered EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Delivered (not billed)' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Open Not Yet Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Open Not Yet Due' THEN `value_eur` ELSE 0 END)"
                }
              ]
            },
            {
              "name": "ds_cm_daily_billing",
              "displayName": "CM Daily Cumulative Billing",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_cm_daily_billing_result${var.result_suffix}`\n",
                "ORDER BY billing_date\n"
              ]
            },
            {
              "name": "ds_segment_focus",
              "displayName": "Segment Focus - Past Due Orders",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_segment_focus_result${var.result_suffix}`\n",
                "ORDER BY open_value_eur DESC\n"
              ],
              "columns": [
                {
                  "displayName": "priority",
                  "description": "",
                  "expression": "CASE WHEN `open_value_eur` >= 25000 THEN '1 - Critical' WHEN `open_value_eur` >= 10000 THEN '2 - High' WHEN `open_value_eur` >= 2500 THEN '3 - Medium' ELSE '4 - Low' END"
                }
              ]
            },
            {
              "name": "ds_cancellations_detail_7d",
              "displayName": "Cancellations Detail",
              "queryLines": [
                "SELECT\n",
                "  `__input_0` AS order_id,\n",
                "  `__input_1` AS item_no,\n",
                "  TO_DATE(CAST(`__input_19` AS STRING), 'yyyyMMdd') AS created_date,\n",
                "  TO_DATE(CAST(`__input_20` AS STRING), 'yyyyMMdd') AS cancelled_date,\n",
                "  COALESCE(`__input_3`, CAST(`__input_14` AS STRING)) AS customer,\n",
                "  `__input_2` AS country,\n",
                "  COALESCE(`__input_4`, 'Unmapped') AS cs_team,\n",
                "  CASE\n",
                "    WHEN `__input_5` IN ('01', '10') THEN 'Customer-driven'\n",
                "    WHEN `__input_5` = '02' THEN 'Internal error'\n",
                "    WHEN `__input_5` IN ('Z6', '12') THEN 'Material change'\n",
                "    WHEN `__input_5` IN ('08', '14') THEN 'Logistics'\n",
                "    WHEN `__input_5` IN ('04', '05') THEN 'Supply issue'\n",
                "    WHEN `__input_5` IN ('03', '06', '11') THEN 'Administrative'\n",
                "    WHEN `__input_5` = '09' THEN 'Pricing'\n",
                "    ELSE 'Other'\n",
                "  END AS reason_category,\n",
                "  COALESCE(`__input_5`, 'Unknown') AS rejection_reason,\n",
                "  COALESCE(`__input_6`, 'Unknown') AS product_group,\n",
                "  COALESCE(`__input_7`, CAST(`__input_15` AS STRING)) AS material,\n",
                "  COALESCE(`__input_8`, 'Unknown') AS segment,\n",
                "  ROUND(COALESCE(`__input_21`, 0), 0) AS value_eur,\n",
                "  DATEDIFF(\n",
                "    TO_DATE(CAST(`__input_20` AS STRING), 'yyyyMMdd'),\n",
                "    TO_DATE(CAST(`__input_19` AS STRING), 'yyyyMMdd')\n",
                "  ) AS days_to_cancel\n",
                "FROM `${var.catalog}`.gold.`SC_BI_industry_sales_open_orders_ds_cancellations_detail_7d_filtered_rows${var.result_suffix}`\n",
                "WHERE\n",
                "  `__input_25` = '34'\n",
                "  AND `__input_26` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "  AND `__input_24` = 'C'\n",
                "  AND (:cancel_date.min IS NULL OR TO_DATE(CAST(`__input_20` AS STRING), 'yyyyMMdd') >= :cancel_date.min)\n",
                "  AND (:cancel_date.max IS NULL OR TO_DATE(CAST(`__input_20` AS STRING), 'yyyyMMdd') <= :cancel_date.max)\n",
                "ORDER BY\n",
                "  value_eur DESC\n"
              ],
              "parameters": [
                {
                  "displayName": "Cancellation Date",
                  "keyword": "cancel_date",
                  "dataType": "DATE",
                  "complexType": "RANGE",
                  "defaultSelection": {
                    "range": {
                      "dataType": "DATE",
                      "min": {
                        "value": "now-7d/d"
                      },
                      "max": {
                        "value": "now/d"
                      }
                    }
                  }
                }
              ]
            }
          ],
          "relationshipGraphs": [
            {
              "sources": [
                {
                  "name": "Current_Month_by_CS_Team",
                  "datasetName": "ds_current_month_by_team"
                },
                {
                  "name": "Order_Size_Distribution",
                  "datasetName": "ds_order_size_dist"
                },
                {
                  "name": "Daily_Tracking__Quotations__Complaints",
                  "datasetName": "ds_daily_tracking"
                },
                {
                  "name": "All_Open_Orders_with_Priority",
                  "datasetName": "ds_all_open_orders"
                },
                {
                  "name": "Overview_Allocation_Consolidated",
                  "datasetName": "ds_overview_allocation"
                },
                {
                  "name": "CM_Daily_Cumulative_Billing",
                  "datasetName": "ds_cm_daily_billing"
                },
                {
                  "name": "Segment_Focus__Past_Due_Orders",
                  "datasetName": "ds_segment_focus"
                },
                {
                  "name": "Cancellations_Detail_Last_7_Days",
                  "datasetName": "ds_cancellations_detail_7d"
                }
              ]
            }
          ],
          "pages": [
            {
              "name": "376008e2",
              "displayName": "overview",
              "layout": [
                {
                  "widget": {
                    "name": "title_header",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## Industry Division \u2014 Open Orders CX Summary\n",
