bundle:
  name: ursa-kpi-dashboards

include:
  - resources/dashboards/ursa_ps4.dashboard.yml
  - resources/jobs/ursa_kpi_refresh.job.yml

sync:
  exclude:
    - source_dashboards/**
    - tests/**
    - scripts/**
    - validation/**
    - __pycache__/**
    - "**/__pycache__/**"

variables:
  catalog:
    description: Target automation catalog with existing bronze, silver and gold schemas
  source_catalog:
    description: Read-only upstream used only by the refresh job identity
    default: synapse-prd
  policy_id:
    description: Target workspace Job Compute policy
  warehouse_id:
    description: SQL warehouse for the local-only dashboard queries
  result_suffix:
    description: DEV-only isolation for URSA_KPI results
    default: ""
  refresh_pause_status:
    description: Schedule pause status; DEV and TEST paused, ACC and PRD enabled
    default: PAUSED

permissions:
  - user_name: mustafaarda.bicakci@etexgroup.com
    level: CAN_MANAGE
  - user_name: pierre.delaguiche@etexgroup.com
    level: CAN_MANAGE

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/D
    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      warehouse_id: 69ada62b2fb9b9e2
      result_suffix: _dev
      refresh_pause_status: PAUSED

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/T
    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      warehouse_id: 69ada62b2fb9b9e2
      refresh_pause_status: PAUSED
    permissions:
      - service_principal_name: 1ff203aa-a0ad-475e-85aa-4eac5c23bdc7
        level: CAN_MANAGE
      - group_name: SEC.RBAC.MDP.DATAAUTOMATION.AUTOMATION.DATAANALYST.DEFAULT
        level: CAN_MANAGE
      - group_name: SEC.RBAC.MDP.DATAAUTOMATION.AUTOMATION.DATASCIENTIST.DEFAULT
        level: CAN_MANAGE

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/A
    variables:
      catalog: automation_a
      policy_id: 306312B973005677
      warehouse_id: 0ef3e37fbbd5b772
      refresh_pause_status: UNPAUSED
    permissions:
      - service_principal_name: 9e7c67eb-3d7a-4b0a-8338-f2ecc4d386e8
        level: CAN_MANAGE

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/P
    variables:
      catalog: automation_p
      policy_id: 306312B973005150
      warehouse_id: f500d0d670ae024b
      refresh_pause_status: UNPAUSED