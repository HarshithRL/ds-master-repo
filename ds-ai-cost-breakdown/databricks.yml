# Databricks asset bundle for AI cost enrichment and reporting.
# Data flow per environment: ingestion_azure_{env}.costs.azure_actual_cost
#   -> automation_{env}.bronze.azure_actual_cost (table)
#   -> automation_{env}.gold.ai_foundry_costs_enriched (view, read by the dashboard)
bundle:
  name: ds-ai-cost-breakdown

include:
  - resources/*.yml
  - resources/jobs/*.yml

variables:
  policy_id:
    description: Cluster policy ID to use
  catalog:
    description: Unity Catalog for this environment (bronze + gold schemas)
  source_table:
    description: Azure actual-cost source table of the same environment
  warehouse_id:
    description: SQL warehouse ID for the AI cost dashboard

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d
      source_table: ingestion_azure_d.costs.azure_actual_cost
      warehouse_id: 69ada62b2fb9b9e2

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d
      source_table: ingestion_azure_d.costs.azure_actual_cost
      warehouse_id: 69ada62b2fb9b9e2
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - group_name: AUTOMATION.DSAICOSTBREAKDOWN.CONSUMER.READ
        level: CAN_VIEW

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005677
      catalog: automation_a
      source_table: ingestion_azure_a.costs.azure_actual_cost
      warehouse_id: f68599b38752394a
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - group_name: AUTOMATION.DSAICOSTBREAKDOWN.CONSUMER.READ
        level: CAN_VIEW

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005150
      catalog: automation_p
      source_table: ingestion_azure_p.costs.azure_actual_cost
      warehouse_id: efc56ffbe4189cdf
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - group_name: AUTOMATION.DSAICOSTBREAKDOWN.CONSUMER.READ
        level: CAN_VIEW
