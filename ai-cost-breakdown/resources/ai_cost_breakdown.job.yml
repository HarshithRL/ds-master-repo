resources:
  jobs:
    ai_cost_breakdown_enrichment:
      name: ai_cost_breakdown_enrichment

      schedule:
        quartz_cron_expression: 0 0 6 * * ?
        timezone_id: Europe/Brussels
        pause_status: UNPAUSED

      tasks:
        - task_key: enrich_ai_costs
          notebook_task:
            notebook_path: ../RG Tag Mapping - AI Cost Enrichment.py
            base_parameters:
              CATALOG: ${var.catalog}
          job_cluster_key: ai_cost_breakdown_cluster

      job_clusters:
        - job_cluster_key: ai_cost_breakdown_cluster
          new_cluster:
            cluster_name: ""
            spark_version: 15.4.x-scala2.12
            azure_attributes:
              first_on_demand: 1
              availability: SPOT_WITH_FALLBACK_AZURE
              spot_bid_max_price: 100
            node_type_id: Standard_DS3_v2
            enable_elastic_disk: true
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
            runtime_engine: PHOTON
            autoscale:
              min_workers: 1
              max_workers: 2

      queue:
        enabled: true

      permissions:
        - user_name: pierre.delaguiche@etexgroup.com
          level: CAN_MANAGE
        - user_name: mustafaarda.bicakci@etexgroup.com
          level: CAN_MANAGE