resources:
  dashboards:
    industry_open_orders:
      display_name: "Industry Division \u2014 Open Orders CX Summary"
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
      permissions:
        - user_name: blossom.alva@etexgroup.com
          level: CAN_READ
        - user_name: francois.leclercq@etexgroup.com
          level: CAN_MANAGE
        - user_name: roberta.villa@etexgroup.com
          level: CAN_READ
        - user_name: sabu.thomas@etexgroup.com
          level: CAN_READ
        - user_name: wouter.toonder@etexgroup.com
          level: CAN_READ
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "ds_current_month_by_team",
              "displayName": "Current Month by Team",
              "queryLines": [
                "WITH industry_orders AS (\n",
                "  SELECT\n",
                "    item.`Sales Document Number`,\n",
                "    item.`Sales Document Item Number`,\n",
                "    item.`Measure Net Value in Euro` AS order_value_eur,\n",
                "    item.`Measure Sales Order Quantity` AS order_qty,\n",
                "    item.`Delivery Date To Key`,\n",
                "    COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "    item.`Order Status` AS order_status\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND (\n",
                "      item.`Rejection Status` != 'C'\n",
                "      OR item.`Rejection Status` IS NULL\n",
                "    )\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` IN (\n",
                "        'Standard Order', 'Rush Order', 'Consignment Issue'\n",
                "      )\n",
                "      OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    )\n",
                "    AND item.`Created On` >= 20260101\n",
                "    ),\n",
                "all_confirmed_sl_raw AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Confirmed Quantity` AS confirmed_qty,\n",
                "    sl.`Measure Order Quantity` AS sl_oq\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN industry_orders io\n",
                "        ON sl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Measure Confirmed Quantity` > 0\n",
                "    AND sl.`Goods Issue Date`\n",
                "      >= 20260101\n",
                "),\n",
                "-- Dedup: if item has confirmed lines with order_qty > 0,\n",
                "-- drop confirmed lines with order_qty = 0 (old rescheduled)\n",
                "all_confirmed_sl AS (\n",
                "  SELECT `Sales Document Number`, `Sales Document Item Number`, gi_date, confirmed_qty\n",
                "  FROM (\n",
                "    SELECT r.*,\n",
                "      MAX(CASE WHEN r.sl_oq > 0 THEN 1 ELSE 0 END)\n",
                "        OVER (PARTITION BY r.`Sales Document Number`, r.`Sales Document Item Number`) AS has_oq\n",
                "    FROM all_confirmed_sl_raw r\n",
                "  )\n",
                "  WHERE sl_oq > 0 OR has_oq = 0\n",
                "),\n",
                "all_unconfirmed_sl AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Order Quantity` AS sl_order_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN industry_orders io\n",
                "        ON sl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Measure Confirmed Quantity` = 0\n",
                "    AND sl.`Measure Order Quantity` > 0\n",
                "    AND sl.`Goods Issue Date`\n",
                "      >= CAST(DATE_FORMAT(DATE_TRUNC('YEAR', CURRENT_DATE()), 'yyyyMMdd') AS INT)\n",
                "),\n",
                "item_confirmed_total AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    SUM(confirmed_qty) AS total_confirmed\n",
                "  FROM\n",
                "    all_confirmed_sl\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "),\n",
                "item_unconfirmed_total AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    SUM(sl_order_qty) AS total_unconfirmed\n",
                "  FROM\n",
                "    all_unconfirmed_sl\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "),\n",
                "items_with_any_sl AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_confirmed_sl\n",
                "  WHERE\n",
                "    gi_date >= DATE_TRUNC('YEAR', CURRENT_DATE())\n",
                "  UNION\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_unconfirmed_sl\n",
                "),\n",
                "-- Rule 1a: confirmed schedule lines (full history for FIFO, tag CM vs non-CM)\n",
                "rule1a AS (\n",
                "  SELECT\n",
                "    s.gi_date AS delivery_date,\n",
                "    CASE\n",
                "      WHEN\n",
                "        ict.total_confirmed >= io.order_qty\n",
                "        OR io.order_qty = 0\n",
                "      THEN\n",
                "        io.order_value_eur * (s.confirmed_qty / ict.total_confirmed)\n",
                "      ELSE io.order_value_eur * (s.confirmed_qty / GREATEST(io.order_qty, ict.total_confirmed))\n",
                "    END AS allocated_value,\n",
                "    io.order_qty,\n",
                "    io.`Sales Document Number`,\n",
                "    io.`Sales Document Item Number`,\n",
                "    io.cs_team,\n",
                "    s.confirmed_qty AS line_qty,\n",
                "    CASE\n",
                "      WHEN s.gi_date BETWEEN DATE_TRUNC('MONTH', CURRENT_DATE()) AND LAST_DAY(CURRENT_DATE()) THEN 1\n",
                "      ELSE 0\n",
                "    END AS is_cm,\n",
                "    io.order_status\n",
                "  FROM\n",
                "    industry_orders io\n",
                "      JOIN item_confirmed_total ict\n",
                "        ON ict.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND ict.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN all_confirmed_sl s\n",
                "        ON s.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND s.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "),\n",
                "-- Rule 1b partial: unconfirmed CM SLs for partially-confirmed items\n",
                "rule1b_partial AS (\n",
                "  SELECT\n",
                "    s.gi_date AS delivery_date,\n",
                "    io.order_value_eur\n",
                "      * (1.0 - LEAST(ict.total_confirmed / GREATEST(io.order_qty, 1), 1.0))\n",
                "      * (s.sl_order_qty / iut.total_unconfirmed) AS allocated_value,\n",
                "    io.order_qty,\n",
                "    io.`Sales Document Number`,\n",
                "    io.`Sales Document Item Number`,\n",
                "    io.cs_team,\n",
                "    s.sl_order_qty AS line_qty,\n",
                "    1 AS is_cm,\n",
                "    io.order_status\n",
                "  FROM\n",
                "    industry_orders io\n",
                "      JOIN item_confirmed_total ict\n",
                "        ON ict.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND ict.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN item_unconfirmed_total iut\n",
                "        ON iut.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND iut.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN all_unconfirmed_sl s\n",
                "        ON s.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND s.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    ict.total_confirmed < io.order_qty\n",
                "    AND io.order_qty > 0\n",
                "    AND s.gi_date BETWEEN DATE_TRUNC('MONTH', CURRENT_DATE()) AND LAST_DAY(CURRENT_DATE())\n",
                "),\n",
                "-- Rule 1b full: unconfirmed CM SLs for fully unconfirmed items\n",
                "rule1b_full AS (\n",
                "  SELECT\n",
                "    s.gi_date AS delivery_date,\n",
                "    io.order_value_eur * (s.sl_order_qty / iut.total_unconfirmed) AS allocated_value,\n",
                "    io.order_qty,\n",
                "    io.`Sales Document Number`,\n",
                "    io.`Sales Document Item Number`,\n",
                "    io.cs_team,\n",
                "    s.sl_order_qty AS line_qty,\n",
                "    1 AS is_cm,\n",
                "    io.order_status\n",
                "  FROM\n",
                "    industry_orders io\n",
                "      LEFT JOIN item_confirmed_total ict\n",
                "        ON ict.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND ict.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN item_unconfirmed_total iut\n",
                "        ON iut.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND iut.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN all_unconfirmed_sl s\n",
                "        ON s.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND s.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    ict.`Sales Document Number` IS NULL\n",
                "    AND s.gi_date BETWEEN DATE_TRUNC('MONTH', CURRENT_DATE()) AND LAST_DAY(CURRENT_DATE())\n",
                "),\n",
                "-- Rule 2: no schedule lines at all \u2014 use delivery date dimension (CM only)\n",
                "rule2 AS (\n",
                "  SELECT\n",
                "    dd.dim_date AS delivery_date,\n",
                "    io.order_value_eur AS allocated_value,\n",
                "    io.order_qty,\n",
                "    io.`Sales Document Number`,\n",
                "    io.`Sales Document Item Number`,\n",
                "    io.cs_team,\n",
                "    io.order_qty AS line_qty,\n",
                "    1 AS is_cm,\n",
                "    io.order_status\n",
                "  FROM\n",
                "    industry_orders io\n",
                "      LEFT JOIN items_with_any_sl isl\n",
                "        ON isl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND isl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "      JOIN (\n",
                "        SELECT\n",
                "          `Date Delivery Key`,\n",
                "          `Date Delivery` AS dim_date\n",
                "        FROM\n",
                "          `${var.catalog}`.silver.`industry_sales_src_dbx_date_delivery${var.source_snapshot_suffix}`\n",
                "      ) dd\n",
                "        ON dd.`Date Delivery Key` = io.`Delivery Date To Key`\n",
                "  WHERE\n",
                "    isl.`Sales Document Number` IS NULL\n",
                "    AND dd.dim_date BETWEEN DATE_TRUNC('MONTH', CURRENT_DATE()) AND LAST_DAY(CURRENT_DATE())\n",
                "),\n",
                "all_alloc AS (\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1a\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b_partial\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b_full\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule2\n",
                "),\n",
                "orders_in_scope AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_alloc\n",
                "),\n",
                "billing AS (\n",
                "  SELECT\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`,\n",
                "    SUM(b.`Billed Quantity`) AS billed_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_billing_document_line_item${var.source_snapshot_suffix}` b\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = b.`Sales Document Number`\n",
                "        AND ois.`Sales Document Item Number` = b.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    b.`Billed Quantity` > 0\n",
                "    AND b.`SD Document Category` = 'M'\n",
                "  GROUP BY\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`\n",
                "),\n",
                "delivery_tbl AS (\n",
                "  SELECT\n",
                "    d.`Reference Document` AS `Sales Document Number`,\n",
                "    d.`Reference Item` AS `Sales Document Item Number`,\n",
                "    SUM(d.`Measure Actual Delivery Quantity`) AS delivered_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_delivery_item${var.source_snapshot_suffix}` d\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = d.`Reference Document`\n",
                "        AND ois.`Sales Document Item Number` = d.`Reference Item`\n",
                "  WHERE\n",
                "    d.`Goods Movement Status` = 'C'\n",
                "  GROUP BY\n",
                "    d.`Reference Document`,\n",
                "    d.`Reference Item`\n",
                "),\n",
                "combined AS (\n",
                "  SELECT\n",
                "    a.cs_team,\n",
                "    a.delivery_date,\n",
                "    a.allocated_value,\n",
                "    a.order_qty,\n",
                "    a.line_qty,\n",
                "    a.is_cm,\n",
                "    a.order_status,\n",
                "    COALESCE(b.billed_qty, 0) AS billed_qty,\n",
                "    GREATEST(COALESCE(d.delivered_qty, 0), COALESCE(b.billed_qty, 0)) AS fulfilled_qty,\n",
                "    SUM(a.line_qty) OVER (\n",
                "        PARTITION BY a.`Sales Document Number`, a.`Sales Document Item Number`\n",
                "        ORDER BY a.delivery_date\n",
                "        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n",
                "      ) AS cumul_qty\n",
                "  FROM\n",
                "    all_alloc a\n",
                "      LEFT JOIN billing b\n",
                "        ON b.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND b.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "      LEFT JOIN delivery_tbl d\n",
                "        ON d.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND d.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "),\n",
                "bucketed AS (\n",
                "  SELECT\n",
                "    cs_team,\n",
                "    delivery_date,\n",
                "    allocated_value,\n",
                "    CASE\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        allocated_value\n",
                "          * LEAST(\n",
                "            GREATEST(LEAST(billed_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "            1.0\n",
                "          )\n",
                "      ELSE\n",
                "        CASE\n",
                "          WHEN fulfilled_qty > 0 THEN allocated_value\n",
                "          ELSE 0\n",
                "        END\n",
                "    END AS billed_value,\n",
                "    CASE\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        GREATEST(\n",
                "          allocated_value\n",
                "            * LEAST(\n",
                "              GREATEST(LEAST(fulfilled_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "              1.0\n",
                "            )\n",
                "            - allocated_value\n",
                "              * LEAST(\n",
                "                GREATEST(LEAST(billed_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "                1.0\n",
                "              ),\n",
                "          0\n",
                "        )\n",
                "      ELSE 0\n",
                "    END AS delivered_not_billed_value,\n",
                "    CASE\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        allocated_value\n",
                "          * (\n",
                "            1\n",
                "              - LEAST(\n",
                "                GREATEST(LEAST(fulfilled_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "                1.0\n",
                "              )\n",
                "          )\n",
                "      ELSE\n",
                "        CASE\n",
                "          WHEN fulfilled_qty > 0 THEN 0\n",
                "          ELSE allocated_value\n",
                "        END\n",
                "    END\n",
                "      * CASE\n",
                "        WHEN order_status = 'C' THEN 0\n",
                "        ELSE 1\n",
                "      END AS open_value\n",
                "  FROM\n",
                "    combined\n",
                "  WHERE\n",
                "    is_cm = 1\n",
                "),\n",
                "team_agg AS (\n",
                "  SELECT\n",
                "    cs_team,\n",
                "    ROUND(SUM(GREATEST(billed_value, 0)), 0) AS billed_eur,\n",
                "    ROUND(SUM(GREATEST(delivered_not_billed_value, 0)), 0) AS delivered_not_billed_eur,\n",
                "    ROUND(\n",
                "      SUM(\n",
                "        CASE\n",
                "          WHEN delivery_date < DATE_SUB(CURRENT_DATE(), 1) THEN GREATEST(open_value, 0)\n",
                "          ELSE 0\n",
                "        END\n",
                "      ),\n",
                "      0\n",
                "    ) AS open_past_due_eur,\n",
                "    ROUND(\n",
                "      SUM(\n",
                "        CASE\n",
                "          WHEN delivery_date >= DATE_SUB(CURRENT_DATE(), 1) THEN GREATEST(open_value, 0)\n",
                "          ELSE 0\n",
                "        END\n",
                "      ),\n",
                "      0\n",
                "    ) AS open_not_yet_due_eur,\n",
                "    ROUND(SUM(allocated_value), 0) AS total_eur\n",
                "  FROM\n",
                "    bucketed\n",
                "  GROUP BY\n",
                "    cs_team\n",
                "),\n",
                "working_days AS (\n",
                "  SELECT\n",
                "    SIZE(\n",
                "      FILTER(\n",
                "        SEQUENCE(DATE_TRUNC('MONTH', CURRENT_DATE()), DATE_SUB(CURRENT_DATE(), 1), INTERVAL 1 DAY),\n",
                "        d -> DAYOFWEEK(d) NOT IN (1, 7)\n",
                "      )\n",
                "    ) AS elapsed_wd,\n",
                "    SIZE(\n",
                "      FILTER(\n",
                "        SEQUENCE(DATE_TRUNC('MONTH', CURRENT_DATE()), LAST_DAY(CURRENT_DATE()), INTERVAL 1 DAY),\n",
                "        d -> DAYOFWEEK(d) NOT IN (1, 7)\n",
                "      )\n",
                "    ) AS total_wd\n",
                ")\n",
                "SELECT\n",
                "  cs_team,\n",
                "  billed_eur,\n",
                "  delivered_not_billed_eur,\n",
                "  open_past_due_eur,\n",
                "  open_not_yet_due_eur,\n",
                "  total_eur,\n",
                "  CASE\n",
                "    WHEN total_eur > 0 THEN ROUND((billed_eur + delivered_not_billed_eur) / total_eur, 4)\n",
                "    ELSE 0\n",
                "  END AS billed_delivered_pct,\n",
                "  ROUND(wd.elapsed_wd * 1.0 / wd.total_wd, 4) AS month_progress,\n",
                "  CASE\n",
                "    WHEN\n",
                "      total_eur > 0\n",
                "    THEN\n",
                "      ROUND(\n",
                "        (billed_eur + delivered_not_billed_eur) / total_eur - wd.elapsed_wd * 1.0 / wd.total_wd,\n",
                "        4\n",
                "      )\n",
                "    ELSE NULL\n",
                "  END AS run_rate_gap,\n",
                "  CASE\n",
                "    WHEN total_eur <= 0 THEN 'N/A'\n",
                "    WHEN\n",
                "      (billed_eur + delivered_not_billed_eur) / total_eur\n",
                "        >= wd.elapsed_wd * 1.0 / wd.total_wd - 0.05\n",
                "    THEN\n",
                "      '\ud83d\udfe2 On Track'\n",
                "    WHEN\n",
                "      (billed_eur + delivered_not_billed_eur) / total_eur\n",
                "        >= wd.elapsed_wd * 1.0 / wd.total_wd - 0.25\n",
                "    THEN\n",
                "      '\ud83d\udfe0 Behind'\n",
                "    ELSE '\ud83d\udd34 Significantly Behind'\n",
                "  END AS run_rate_status\n",
                "FROM\n",
                "  team_agg CROSS JOIN working_days wd\n",
                "ORDER BY\n",
                "  total_eur DESC"
              ],
              "columns": [
                {
                  "displayName": "Total Allocated EUR",
                  "description": "",
                  "expression": "SUM(`total_eur`)"
                },
                {
                  "displayName": "Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(`open_past_due_eur`)"
                },
                {
                  "displayName": "Billed + Delivered Pct",
                  "description": "",
                  "expression": "SUM(`billed_eur` + `delivered_not_billed_eur`) / SUM(`total_eur`)"
                }
              ]
            },
            {
              "name": "ds_order_size_dist",
              "displayName": "Order Size Distribution",
              "queryLines": [
                "WITH last_day AS (\n",
                "  SELECT\n",
                "    MAX(TO_DATE(CAST(`Created On` AS STRING), 'yyyyMMdd')) AS max_date\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` IN (\n",
                "        'Standard Order', 'Rush Order', 'Consignment Issue'\n",
                "      )\n",
                "      OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    )\n",
                "    AND item.`Created On` >= CAST(DATE_FORMAT(DATE_ADD(CURRENT_DATE(), -30), 'yyyyMMdd') AS INT)\n",
                ")\n",
                "SELECT\n",
                "  COALESCE(item.`Application area Description`, 'Unknown') AS segment,\n",
                "  CASE\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 500 THEN '<\u20ac500'\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 1000 THEN '\u20ac500\u2013\u20ac1K'\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 2500 THEN '\u20ac1K\u2013\u20ac2.5K'\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 5000 THEN '\u20ac2.5K\u2013\u20ac5K'\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 25000 THEN '\u20ac5K\u2013\u20ac25K'\n",
                "    ELSE '>\u20ac25K'\n",
                "  END AS value_bucket,\n",
                "  CASE\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 500 THEN 1\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 1000 THEN 2\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 2500 THEN 3\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 5000 THEN 4\n",
                "    WHEN ABS(item.`Measure Net Value in Euro`) < 25000 THEN 5\n",
                "    ELSE 6\n",
                "  END AS bucket_order,\n",
                "  COUNT(DISTINCT item.`Sales Document Number`) AS order_count\n",
                "FROM\n",
                "  `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "    JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "      ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "    CROSS JOIN last_day ld\n",
                "WHERE\n",
                "  sorg.`Business Unit 2` = '34'\n",
                "  AND (\n",
                "    item.`Rejection Status` != 'C'\n",
                "    OR item.`Rejection Status` IS NULL\n",
                "  )\n",
                "  AND (\n",
                "    item.`Sales Document Type Description` IN ('Standard Order', 'Rush Order', 'Consignment Issue')\n",
                "    OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "  )\n",
                "  AND TO_DATE(CAST(item.`Created On` AS STRING), 'yyyyMMdd') = ld.max_date\n",
                "GROUP BY\n",
                "  1,\n",
                "  2,\n",
                "  3\n",
                "ORDER BY\n",
                "  segment,\n",
                "  bucket_order"
              ]
            },
            {
              "name": "ds_daily_tracking",
              "displayName": "Daily Tracking - Quotations & Complaints",
              "queryLines": [
                "WITH item_data AS (\n",
                "  SELECT\n",
                "    CASE\n",
                "      WHEN\n",
                "        item.`Sales Document Type Description` LIKE '%Quotation%'\n",
                "        OR item.`Sales Document Type` = 'YQT'\n",
                "      THEN\n",
                "        'Quotations'\n",
                "      WHEN item.`Sales Document Type Description` = 'General complaint' THEN 'Complaints'\n",
                "    END AS category,\n",
                "    TO_DATE(CAST(item.`Created On` AS STRING), 'yyyyMMdd') AS creation_date,\n",
                "    item.`Sales Document Number`,\n",
                "    item.`Sales Document Item Number`,\n",
                "    ABS(item.`Measure Net Value in Euro`) AS value_eur\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND item.`Created On` >= CAST(DATE_FORMAT(DATE_ADD(CURRENT_DATE(), -30), 'yyyyMMdd') AS INT)\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` LIKE '%Quotation%'\n",
                "      OR item.`Sales Document Type` = 'YQT'\n",
                "      OR item.`Sales Document Type Description` = 'General complaint'\n",
                "    )\n",
                "),\n",
                "last_dates AS (\n",
                "  SELECT\n",
                "    category,\n",
                "    MAX(creation_date) AS last_date\n",
                "  FROM\n",
                "    item_data\n",
                "  WHERE\n",
                "    category IS NOT NULL\n",
                "  GROUP BY\n",
                "    category\n",
                ")\n",
                "SELECT\n",
                "  d.category,\n",
                "  d.last_date,\n",
                "  COUNT(DISTINCT i.`Sales Document Number`) AS num_documents,\n",
                "  COUNT(*) AS num_lines,\n",
                "  ROUND(SUM(i.value_eur), 0) AS total_value_eur\n",
                "FROM\n",
                "  last_dates d\n",
                "    JOIN item_data i\n",
                "      ON i.category = d.category\n",
                "      AND i.creation_date = d.last_date\n",
                "GROUP BY\n",
                "  d.category,\n",
                "  d.last_date\n",
                "ORDER BY\n",
                "  d.category"
              ]
            },
            {
              "name": "ds_all_open_orders",
              "displayName": "All Open Orders with Priority",
              "queryLines": [
                "WITH industry_orders AS (\n",
                "  SELECT\n",
                "    item.`Sales Document Number`,\n",
                "    item.`Sales Document Item Number`,\n",
                "    item.`Measure Net Value in Euro` AS order_value_eur,\n",
                "    item.`Measure Sales Order Quantity` AS order_qty,\n",
                "    item.`Delivery Date To Key`,\n",
                "    item.`Customer Key`,\n",
                "    item.`Material Key`,\n",
                "    item.`Plant Key`,\n",
                "    COALESCE(item.`Application area Description`, 'Unknown') AS segment,\n",
                "    COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "    CASE\n",
                "      WHEN item.`Incoterms Description` LIKE '%Ex Works%' THEN 'EXW'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Free Carrier%' THEN 'FCA'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Free on Board%' THEN 'FOB'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Carriage paid to%' THEN 'CPT'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Carriage%Insurance%' THEN 'CIF'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Delivered at place%' THEN 'DAP'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Delivered Duty Paid%' THEN 'DDP'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Cost and Freight%' THEN 'CFR'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Delivered at Place Unloaded%' THEN 'DPU'\n",
                "      WHEN item.`Incoterms Description` LIKE '%Free Alongside%' THEN 'FAS'\n",
                "      ELSE item.`Incoterms Description`\n",
                "    END AS incoterm,\n",
                "    item.`Shipping Conditions Description` AS shipping_condition,\n",
                "    item.`Created By` AS created_by,\n",
                "    item.`Delivery Block` AS delivery_block,\n",
                "    item.`Delivery Block Description` AS delivery_block_desc\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND (\n",
                "      item.`Rejection Status` != 'C'\n",
                "      OR item.`Rejection Status` IS NULL\n",
                "    )\n",
                "    AND item.`Order Status` != 'C'\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` IN (\n",
                "        'Standard Order', 'Rush Order', 'Consignment Issue'\n",
                "      )\n",
                "      OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    )\n",
                "    AND item.`Created On` >= 20260101\n",
                "),\n",
                "all_schedule_lines_raw AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    sl.`Schedule Line Number` AS sl_no,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Confirmed Quantity` AS confirmed_qty,\n",
                "    sl.`Measure Order Quantity` AS sl_order_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN industry_orders io\n",
                "        ON sl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Goods Issue Date` >= 20260101\n",
                "    AND (sl.`Measure Order Quantity` > 0 OR sl.`Measure Confirmed Quantity` > 0)\n",
                "),\n",
                "-- Dedup: drop old rescheduled confirmed lines (confirmed > 0, order = 0)\n",
                "-- only when the same item has a confirmed line with order > 0\n",
                "all_schedule_lines AS (\n",
                "  SELECT `Sales Document Number`, `Sales Document Item Number`, sl_no,\n",
                "    gi_date, confirmed_qty, sl_order_qty\n",
                "  FROM (\n",
                "    SELECT r.*,\n",
                "      MAX(CASE WHEN r.confirmed_qty > 0 AND r.sl_order_qty > 0 THEN 1 ELSE 0 END)\n",
                "        OVER (PARTITION BY r.`Sales Document Number`, r.`Sales Document Item Number`) AS has_oq_conf\n",
                "    FROM all_schedule_lines_raw r\n",
                "  )\n",
                "  WHERE NOT (confirmed_qty > 0 AND sl_order_qty = 0 AND has_oq_conf = 1)\n",
                "),\n",
                "item_has_confirmed AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    SUM(confirmed_qty) AS total_confirmed_qty\n",
                "  FROM\n",
                "    all_schedule_lines\n",
                "  WHERE\n",
                "    confirmed_qty > 0\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "),\n",
                "item_unconfirmed_total AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    all_schedule_lines asl\n",
                "      LEFT JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    ihc.`Sales Document Number` IS NULL\n",
                "    AND asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "item_partial_unconfirmed AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    all_schedule_lines asl\n",
                "      INNER JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "      INNER JOIN industry_orders io\n",
                "        ON io.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND io.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "    AND ihc.total_confirmed_qty < io.order_qty\n",
                "    AND io.order_qty > 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "items_with_any_sl AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_schedule_lines\n",
                "),\n",
                "date_dim AS (\n",
                "  SELECT\n",
                "    `Date Delivery Key`,\n",
                "    `Date Delivery` AS dim_date\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_date_delivery${var.source_snapshot_suffix}`\n",
                "),\n",
                "rule1a AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    CASE\n",
                "      WHEN ihc.total_confirmed_qty >= o.order_qty OR o.order_qty = 0\n",
                "      THEN o.order_value_eur * (asl.confirmed_qty / ihc.total_confirmed_qty)\n",
                "      ELSE o.order_value_eur * (asl.confirmed_qty / GREATEST(o.order_qty, ihc.total_confirmed_qty))\n",
                "    END AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.`Plant Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.incoterm,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    asl.confirmed_qty AS line_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_schedule_lines asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty > 0\n",
                "),\n",
                "rule1b AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur * (asl.sl_order_qty / iut.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.`Plant Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.incoterm,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    asl.sl_order_qty AS line_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_unconfirmed_total iut\n",
                "        ON iut.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND iut.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_schedule_lines asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule1b_partial AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur\n",
                "      * (1.0 - LEAST(ihc.total_confirmed_qty / GREATEST(o.order_qty, 1), 1.0))\n",
                "      * (asl.sl_order_qty / ipu.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.`Plant Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.incoterm,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    asl.sl_order_qty AS line_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN item_partial_unconfirmed ipu\n",
                "        ON ipu.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ipu.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_schedule_lines asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule2 AS (\n",
                "  SELECT\n",
                "    dd.dim_date AS delivery_date,\n",
                "    o.order_value_eur AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.`Plant Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.incoterm,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    o.order_qty AS line_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      LEFT JOIN items_with_any_sl isl\n",
                "        ON isl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND isl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN date_dim dd\n",
                "        ON dd.`Date Delivery Key` = o.`Delivery Date To Key`\n",
                "  WHERE\n",
                "    isl.`Sales Document Number` IS NULL\n",
                "),\n",
                "all_alloc AS (\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1a\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b_partial\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule2\n",
                "),\n",
                "orders_in_scope AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_alloc\n",
                "),\n",
                "billing AS (\n",
                "  SELECT\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`,\n",
                "    SUM(b.`Billed Quantity`) AS billed_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_billing_document_line_item${var.source_snapshot_suffix}` b\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = b.`Sales Document Number`\n",
                "        AND ois.`Sales Document Item Number` = b.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    b.`Billed Quantity` > 0\n",
                "    AND b.`SD Document Category` = 'M'\n",
                "  GROUP BY\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`\n",
                "),\n",
                "delivery_tbl AS (\n",
                "  SELECT\n",
                "    d.`Reference Document` AS `Sales Document Number`,\n",
                "    d.`Reference Item` AS `Sales Document Item Number`,\n",
                "    SUM(d.`Measure Actual Delivery Quantity`) AS delivered_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_delivery_item${var.source_snapshot_suffix}` d\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = d.`Reference Document`\n",
                "        AND ois.`Sales Document Item Number` = d.`Reference Item`\n",
                "  WHERE\n",
                "    d.`Goods Movement Status` = 'C'\n",
                "  GROUP BY\n",
                "    d.`Reference Document`,\n",
                "    d.`Reference Item`\n",
                "),\n",
                "combined AS (\n",
                "  SELECT\n",
                "    a.*,\n",
                "    GREATEST(COALESCE(d.delivered_qty, 0), COALESCE(b.billed_qty, 0)) AS fulfilled_qty,\n",
                "    SUM(a.line_qty) OVER (\n",
                "        PARTITION BY a.`Sales Document Number`, a.`Sales Document Item Number`\n",
                "        ORDER BY a.delivery_date\n",
                "        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n",
                "      ) AS cumul_qty\n",
                "  FROM\n",
                "    all_alloc a\n",
                "      LEFT JOIN billing b\n",
                "        ON b.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND b.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "      LEFT JOIN delivery_tbl d\n",
                "        ON d.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND d.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "),\n",
                "with_open AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    `Plant Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    incoterm,\n",
                "    shipping_condition,\n",
                "    created_by,\n",
                "    delivery_block,\n",
                "    delivery_block_desc,\n",
                "    delivery_date,\n",
                "    CASE\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        allocated_value\n",
                "          * (\n",
                "            1\n",
                "              - LEAST(\n",
                "                GREATEST(LEAST(fulfilled_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "                1.0\n",
                "              )\n",
                "          )\n",
                "      ELSE\n",
                "        CASE\n",
                "          WHEN fulfilled_qty > 0 THEN 0\n",
                "          ELSE allocated_value\n",
                "        END\n",
                "    END AS open_value_eur\n",
                "  FROM\n",
                "    combined\n",
                "),\n",
                "item_agg AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    `Plant Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    incoterm,\n",
                "    shipping_condition,\n",
                "    created_by,\n",
                "    delivery_block,\n",
                "    delivery_block_desc,\n",
                "    SUM(open_value_eur) AS total_open_value,\n",
                "    MIN(delivery_date) AS min_open_date\n",
                "  FROM\n",
                "    with_open\n",
                "  WHERE\n",
                "    open_value_eur > 0\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    `Plant Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    incoterm,\n",
                "    shipping_condition,\n",
                "    created_by,\n",
                "    delivery_block,\n",
                "    delivery_block_desc\n",
                ")\n",
                "SELECT\n",
                "  o.`Sales Document Number` AS order_number,\n",
                "  o.`Sales Document Item Number` AS item_number,\n",
                "  COALESCE(c.`Customer & Text`, CAST(o.`Customer Key` AS STRING)) AS customer,\n",
                "  COALESCE(m.`Material Text`, CAST(o.`Material Key` AS STRING)) AS material,\n",
                "  o.segment,\n",
                "  o.cs_team,\n",
                "  COALESCE(p.`Plant Code & Text`, CAST(o.`Plant Key` AS STRING)) AS plant,\n",
                "  o.incoterm,\n",
                "  o.shipping_condition,\n",
                "  COALESCE(un.`User Name`, o.created_by) AS created_by,\n",
                "  o.min_open_date AS planned_gi_date,\n",
                "  ROUND(o.total_open_value, 0) AS open_value_eur,\n",
                "  CASE\n",
                "    WHEN o.total_open_value >= 25000 THEN '1 - Critical'\n",
                "    WHEN o.total_open_value >= 10000 THEN '2 - High'\n",
                "    WHEN o.total_open_value >= 2500 THEN '3 - Medium'\n",
                "    ELSE '4 - Low'\n",
                "  END AS priority,\n",
                "  CASE\n",
                "    WHEN o.min_open_date < DATE_SUB(CURRENT_DATE(), 1) THEN 'Past Due'\n",
                "    ELSE 'Not Yet Due'\n",
                "  END AS due_status,\n",
                "  DATEDIFF(CURRENT_DATE(), o.min_open_date) AS days_overdue,\n",
                "  CASE WHEN o.delivery_block IS NOT NULL AND o.delivery_block != '' THEN 'Yes' ELSE 'No' END AS delivery_blocked,\n",
                "  COALESCE(NULLIF(o.delivery_block_desc, ''), '-') AS delivery_block_reason\n",
                "FROM\n",
                "  item_agg o\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_customer${var.source_snapshot_suffix}` c\n",
                "      ON c.`Customer Key` = o.`Customer Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_material${var.source_snapshot_suffix}` m\n",
                "      ON m.`Material Key` = o.`Material Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_plant${var.source_snapshot_suffix}` p\n",
                "      ON p.`Plant Key` = o.`Plant Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_users${var.source_snapshot_suffix}` un\n",
                "      ON un.`User ID` = o.created_by\n",
                "WHERE\n",
                "  o.min_open_date >= DATE '2026-01-01'"
              ],
              "columns": [
                {
                  "displayName": "Date Bucket",
                  "description": "",
                  "expression": "CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) AND `planned_gi_date` <= CAST(LAST_DAY(CURRENT_DATE()) AS DATE) THEN 'Current Month' WHEN `planned_gi_date` < CAST(CURRENT_DATE() AS DATE) AND `planned_gi_date` >= CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) THEN 'Past Due YTD' WHEN `planned_gi_date` < CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) THEN 'Past Due Prior Year' ELSE 'Future' END"
                },
                {
                  "displayName": "CM Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) AND `planned_gi_date` < CAST(CURRENT_DATE() AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Not Yet Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(CURRENT_DATE() AS DATE) AND `planned_gi_date` <= CAST(LAST_DAY(CURRENT_DATE()) AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "YTD Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `planned_gi_date` >= CAST(DATE_TRUNC('year', CURRENT_DATE()) AS DATE) AND `planned_gi_date` < CAST(DATE_TRUNC('month', CURRENT_DATE()) AS DATE) THEN `open_value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "Total Open EUR",
                  "description": "",
                  "expression": "SUM(`open_value_eur`)"
                }
              ]
            },
            {
              "name": "ds_overview_allocation",
              "displayName": "Overview Allocation (Consolidated)",
              "queryLines": [
                "SELECT scope, cs_team, segment, plant, bucket, value_eur\n",
                "FROM ${var.catalog}.gold.${var.allocation_table_name}\n"
              ],
              "columns": [
                {
                  "displayName": "CM Total EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Billed+Delivered EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket` IN ('Billed', 'Delivered (not billed)') THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Open Past Due' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "YTD Open Past Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='YTD' AND `bucket`='Open Past Due' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "Billed+Delivered Pct",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket` IN ('Billed', 'Delivered (not billed)') THEN `value_eur` ELSE 0 END) / NULLIF(SUM(CASE WHEN `scope`='CM' THEN `value_eur` ELSE 0 END), 0)"
                },
                {
                  "displayName": "CM Billed EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Billed' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Delivered EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Delivered (not billed)' THEN `value_eur` ELSE 0 END)"
                },
                {
                  "displayName": "CM Open Not Yet Due EUR",
                  "description": "",
                  "expression": "SUM(CASE WHEN `scope`='CM' AND `bucket`='Open Not Yet Due' THEN `value_eur` ELSE 0 END)"
                }
              ]
            },
            {
              "name": "ds_top_late_orders",
              "displayName": "Top Late Orders (CM + YTD)",
              "queryLines": [
                "WITH industry_orders AS (\n",
                "  SELECT\n",
                "    item.`Sales Document Number`,\n",
                "    item.`Sales Document Item Number`,\n",
                "    item.`Measure Net Value in Euro` AS order_value_eur,\n",
                "    item.`Measure Sales Order Quantity` AS order_qty,\n",
                "    item.`Delivery Date To Key`,\n",
                "    item.`Customer Key`,\n",
                "    item.`Material Key`,\n",
                "    COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "    item.`Delivery Block` AS delivery_block,\n",
                "    item.`Delivery Block Description` AS delivery_block_desc\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND (\n",
                "      item.`Rejection Status` != 'C'\n",
                "      OR item.`Rejection Status` IS NULL\n",
                "    )\n",
                "    AND item.`Order Status` != 'C'\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` IN (\n",
                "        'Standard Order', 'Rush Order', 'Consignment Issue'\n",
                "      )\n",
                "      OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    )\n",
                "    AND item.`Created On` >= 20260101\n",
                "),\n",
                "-- Pass 1: YTD+ schedule lines only\n",
                "ytd_future_schedule_lines_raw AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Confirmed Quantity` AS confirmed_qty,\n",
                "    sl.`Measure Order Quantity` AS sl_order_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN industry_orders io\n",
                "        ON sl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Goods Issue Date`\n",
                "      >= CAST(DATE_FORMAT(DATE_TRUNC('YEAR', CURRENT_DATE()), 'yyyyMMdd') AS INT)\n",
                "    AND (sl.`Measure Order Quantity` > 0 OR sl.`Measure Confirmed Quantity` > 0)\n",
                "),\n",
                "ytd_future_schedule_lines AS (\n",
                "  SELECT `Sales Document Number`, `Sales Document Item Number`,\n",
                "    gi_date, confirmed_qty, sl_order_qty\n",
                "  FROM (\n",
                "    SELECT r.*,\n",
                "      MAX(CASE WHEN r.confirmed_qty > 0 AND r.sl_order_qty > 0 THEN 1 ELSE 0 END)\n",
                "        OVER (PARTITION BY r.`Sales Document Number`, r.`Sales Document Item Number`) AS has_oq_conf\n",
                "    FROM ytd_future_schedule_lines_raw r\n",
                "  )\n",
                "  WHERE NOT (confirmed_qty > 0 AND sl_order_qty = 0 AND has_oq_conf = 1)\n",
                "),\n",
                "confirmed_items AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    ytd_future_schedule_lines\n",
                "  WHERE\n",
                "    confirmed_qty > 0\n",
                "),\n",
                "-- Pass 2: Full history only for confirmed items\n",
                "history_schedule_lines_raw AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Confirmed Quantity` AS confirmed_qty,\n",
                "    sl.`Measure Order Quantity` AS sl_oq\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN confirmed_items ci\n",
                "        ON sl.`Sales Document Number` = ci.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = ci.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Goods Issue Date` >= 20260101\n",
                "    AND sl.`Measure Confirmed Quantity` > 0\n",
                "),\n",
                "history_schedule_lines AS (\n",
                "  SELECT `Sales Document Number`, `Sales Document Item Number`, gi_date, confirmed_qty\n",
                "  FROM (\n",
                "    SELECT r.*,\n",
                "      MAX(CASE WHEN r.sl_oq > 0 THEN 1 ELSE 0 END)\n",
                "        OVER (PARTITION BY r.`Sales Document Number`, r.`Sales Document Item Number`) AS has_oq\n",
                "    FROM history_schedule_lines_raw r\n",
                "  )\n",
                "  WHERE sl_oq > 0 OR has_oq = 0\n",
                "),\n",
                "item_has_confirmed AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    SUM(confirmed_qty) AS total_confirmed_qty\n",
                "  FROM\n",
                "    history_schedule_lines\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "),\n",
                "item_unconfirmed_total AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    ytd_future_schedule_lines asl\n",
                "      LEFT JOIN confirmed_items ci\n",
                "        ON ci.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ci.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    ci.`Sales Document Number` IS NULL\n",
                "    AND asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "item_partial_unconfirmed AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    ytd_future_schedule_lines asl\n",
                "      INNER JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "      INNER JOIN industry_orders io\n",
                "        ON io.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND io.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "    AND ihc.total_confirmed_qty < io.order_qty\n",
                "    AND io.order_qty > 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "items_with_any_sl AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    ytd_future_schedule_lines\n",
                "),\n",
                "date_dim AS (\n",
                "  SELECT\n",
                "    `Date Delivery Key`,\n",
                "    `Date Delivery` AS dim_date\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_date_delivery${var.source_snapshot_suffix}`\n",
                "),\n",
                "rule1a AS (\n",
                "  SELECT\n",
                "    hsl.gi_date AS delivery_date,\n",
                "    CASE\n",
                "      WHEN ihc.total_confirmed_qty >= o.order_qty OR o.order_qty = 0\n",
                "      THEN o.order_value_eur * (hsl.confirmed_qty / ihc.total_confirmed_qty)\n",
                "      ELSE o.order_value_eur * (hsl.confirmed_qty / GREATEST(o.order_qty, ihc.total_confirmed_qty))\n",
                "    END AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.cs_team,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    hsl.confirmed_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN history_schedule_lines hsl\n",
                "        ON hsl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND hsl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    hsl.gi_date >= DATE_TRUNC('YEAR', CURRENT_DATE())\n",
                "),\n",
                "rule1b AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur * (asl.sl_order_qty / iut.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.cs_team,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    asl.sl_order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_unconfirmed_total iut\n",
                "        ON iut.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND iut.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN ytd_future_schedule_lines asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule1b_partial AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur\n",
                "      * (1.0 - LEAST(ihc.total_confirmed_qty / GREATEST(o.order_qty, 1), 1.0))\n",
                "      * (asl.sl_order_qty / ipu.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.cs_team,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    asl.sl_order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN item_partial_unconfirmed ipu\n",
                "        ON ipu.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ipu.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN ytd_future_schedule_lines asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule2 AS (\n",
                "  SELECT\n",
                "    dd.dim_date AS delivery_date,\n",
                "    o.order_value_eur AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.cs_team,\n",
                "    o.delivery_block,\n",
                "    o.delivery_block_desc,\n",
                "    o.order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      LEFT JOIN items_with_any_sl isl\n",
                "        ON isl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND isl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN date_dim dd\n",
                "        ON dd.`Date Delivery Key` = o.`Delivery Date To Key`\n",
                "  WHERE\n",
                "    isl.`Sales Document Number` IS NULL\n",
                "    AND dd.dim_date >= DATE_TRUNC('YEAR', CURRENT_DATE())\n",
                "),\n",
                "all_alloc AS (\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1a\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b_partial\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule2\n",
                "),\n",
                "orders_in_scope AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_alloc\n",
                "),\n",
                "billing AS (\n",
                "  SELECT\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`,\n",
                "    SUM(b.`Billed Quantity`) AS billed_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_billing_document_line_item${var.source_snapshot_suffix}` b\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = b.`Sales Document Number`\n",
                "        AND ois.`Sales Document Item Number` = b.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    b.`Billed Quantity` > 0\n",
                "    AND b.`SD Document Category` = 'M'\n",
                "  GROUP BY\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`\n",
                "),\n",
                "delivery_tbl AS (\n",
                "  SELECT\n",
                "    d.`Reference Document` AS `Sales Document Number`,\n",
                "    d.`Reference Item` AS `Sales Document Item Number`,\n",
                "    SUM(d.`Measure Actual Delivery Quantity`) AS delivered_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_delivery_item${var.source_snapshot_suffix}` d\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = d.`Reference Document`\n",
                "        AND ois.`Sales Document Item Number` = d.`Reference Item`\n",
                "  WHERE\n",
                "    d.`Goods Movement Status` = 'C'\n",
                "  GROUP BY\n",
                "    d.`Reference Document`,\n",
                "    d.`Reference Item`\n",
                "),\n",
                "combined AS (\n",
                "  SELECT\n",
                "    a.delivery_date,\n",
                "    a.allocated_value,\n",
                "    a.`Sales Document Number`,\n",
                "    a.`Sales Document Item Number`,\n",
                "    a.`Customer Key`,\n",
                "    a.`Material Key`,\n",
                "    a.cs_team,\n",
                "    a.delivery_block,\n",
                "    a.delivery_block_desc,\n",
                "    a.line_qty,\n",
                "    a.order_qty,\n",
                "    GREATEST(COALESCE(d.delivered_qty, 0), COALESCE(b.billed_qty, 0)) AS fulfilled_qty,\n",
                "    SUM(a.line_qty) OVER (\n",
                "        PARTITION BY a.`Sales Document Number`, a.`Sales Document Item Number`\n",
                "        ORDER BY a.delivery_date\n",
                "        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n",
                "      ) AS cumul_qty\n",
                "  FROM\n",
                "    all_alloc a\n",
                "      LEFT JOIN billing b\n",
                "        ON b.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND b.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "      LEFT JOIN delivery_tbl d\n",
                "        ON d.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND d.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "),\n",
                "with_open AS (\n",
                "  SELECT\n",
                "    *,\n",
                "    CASE\n",
                "      WHEN fulfilled_qty >= order_qty AND order_qty > 0 THEN 0\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        allocated_value\n",
                "          * (\n",
                "            1\n",
                "              - LEAST(\n",
                "                GREATEST(LEAST(fulfilled_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "                1.0\n",
                "              )\n",
                "          )\n",
                "      ELSE\n",
                "        CASE\n",
                "          WHEN fulfilled_qty > 0 THEN 0\n",
                "          ELSE allocated_value\n",
                "        END\n",
                "    END AS open_value_eur,\n",
                "    CASE\n",
                "      WHEN\n",
                "        delivery_date BETWEEN DATE_TRUNC('MONTH', CURRENT_DATE()) AND LAST_DAY(CURRENT_DATE())\n",
                "      THEN\n",
                "        'CM'\n",
                "      WHEN\n",
                "        delivery_date >= DATE_TRUNC('YEAR', CURRENT_DATE())\n",
                "        AND delivery_date < DATE_TRUNC('MONTH', CURRENT_DATE())\n",
                "      THEN\n",
                "        'YTD'\n",
                "    END AS scope\n",
                "  FROM\n",
                "    combined\n",
                "),\n",
                "past_due AS (\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    with_open\n",
                "  WHERE\n",
                "    open_value_eur > 0\n",
                "    AND delivery_date < DATE_SUB(CURRENT_DATE(), 1)\n",
                "    AND scope IS NOT NULL\n",
                "),\n",
                "ranked_cm AS (\n",
                "  SELECT\n",
                "    *,\n",
                "    ROW_NUMBER() OVER (ORDER BY open_value_eur DESC) AS rn\n",
                "  FROM\n",
                "    past_due\n",
                "  WHERE\n",
                "    scope = 'CM'\n",
                "),\n",
                "ranked_ytd AS (\n",
                "  SELECT\n",
                "    *,\n",
                "    ROW_NUMBER() OVER (ORDER BY open_value_eur DESC) AS rn\n",
                "  FROM\n",
                "    past_due\n",
                "  WHERE\n",
                "    scope = 'YTD'\n",
                ")\n",
                "SELECT\n",
                "  'Current Month' AS period,\n",
                "  o.`Sales Document Number` AS order_number,\n",
                "  COALESCE(c.`Customer & Text`, CAST(o.`Customer Key` AS STRING)) AS customer,\n",
                "  COALESCE(m.`Material Text`, CAST(o.`Material Key` AS STRING)) AS material,\n",
                "  o.delivery_date AS planned_gi_date,\n",
                "  o.cs_team,\n",
                "  ROUND(o.open_value_eur, 0) AS open_value_eur,\n",
                "  CASE WHEN o.delivery_block IS NOT NULL AND o.delivery_block != '' THEN 'Yes' ELSE 'No' END AS delivery_blocked,\n",
                "  COALESCE(NULLIF(o.delivery_block_desc, ''), '-') AS delivery_block_reason\n",
                "FROM\n",
                "  ranked_cm o\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_customer${var.source_snapshot_suffix}` c\n",
                "      ON c.`Customer Key` = o.`Customer Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_material${var.source_snapshot_suffix}` m\n",
                "      ON m.`Material Key` = o.`Material Key`\n",
                "WHERE\n",
                "  o.rn <= 10\n",
                "UNION ALL\n",
                "SELECT\n",
                "  'YTD Prior' AS period,\n",
                "  o.`Sales Document Number` AS order_number,\n",
                "  COALESCE(c.`Customer & Text`, CAST(o.`Customer Key` AS STRING)) AS customer,\n",
                "  COALESCE(m.`Material Text`, CAST(o.`Material Key` AS STRING)) AS material,\n",
                "  o.delivery_date AS planned_gi_date,\n",
                "  o.cs_team,\n",
                "  ROUND(o.open_value_eur, 0) AS open_value_eur,\n",
                "  CASE WHEN o.delivery_block IS NOT NULL AND o.delivery_block != '' THEN 'Yes' ELSE 'No' END AS delivery_blocked,\n",
                "  COALESCE(NULLIF(o.delivery_block_desc, ''), '-') AS delivery_block_reason\n",
                "FROM\n",
                "  ranked_ytd o\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_customer${var.source_snapshot_suffix}` c\n",
                "      ON c.`Customer Key` = o.`Customer Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_material${var.source_snapshot_suffix}` m\n",
                "      ON m.`Material Key` = o.`Material Key`\n",
                "WHERE\n",
                "  o.rn <= 5\n",
                "ORDER BY\n",
                "  period,\n",
                "  open_value_eur DESC"
              ]
            },
            {
              "name": "ds_cm_daily_billing",
              "displayName": "CM Daily Cumulative Billing",
              "queryLines": [
                "WITH daily_billing AS (\n",
                "  SELECT\n",
                "    TO_DATE(CAST(b.`Billing Date` AS STRING), 'yyyyMMdd') AS billing_date,\n",
                "    SUM(b.`NET Value in Statistical Currency`) AS daily_value_eur\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_billing_document_line_item${var.source_snapshot_suffix}` b\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = b.`Sales Organization Key`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND b.`Billing Date`\n",
                "      >= CAST(DATE_FORMAT(DATE_TRUNC('MONTH', CURRENT_DATE()), 'yyyyMMdd') AS INT)\n",
                "    AND b.`Billing Date` <= CAST(DATE_FORMAT(CURRENT_DATE(), 'yyyyMMdd') AS INT)\n",
                "    AND b.`SD Document Category` = 'M'\n",
                "  GROUP BY\n",
                "    TO_DATE(CAST(b.`Billing Date` AS STRING), 'yyyyMMdd')\n",
                ")\n",
                "SELECT\n",
                "  billing_date,\n",
                "  daily_value_eur,\n",
                "  SUM(daily_value_eur) OVER (\n",
                "      ORDER BY billing_date\n",
                "      ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n",
                "    ) AS cumulative_value_eur\n",
                "FROM\n",
                "  daily_billing\n",
                "ORDER BY\n",
                "  billing_date"
              ]
            },
            {
              "name": "ds_segment_focus",
              "displayName": "Segment Focus - Past Due Orders",
              "queryLines": [
                "WITH industry_orders AS (\n",
                "  SELECT\n",
                "    item.`Sales Document Number`,\n",
                "    item.`Sales Document Item Number`,\n",
                "    item.`Measure Net Value in Euro` AS order_value_eur,\n",
                "    item.`Measure Sales Order Quantity` AS order_qty,\n",
                "    item.`Delivery Date To Key`,\n",
                "    item.`Customer Key`,\n",
                "    item.`Material Key`,\n",
                "    COALESCE(item.`Application area Description`, 'Unknown') AS segment,\n",
                "    COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "    item.`Shipping Conditions Description` AS shipping_condition,\n",
                "    item.`Created By` AS created_by\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "        ON sorg.`Sales Organization Key` = item.`Sales Organization Key`\n",
                "      LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "        ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "  WHERE\n",
                "    sorg.`Business Unit 2` = '34'\n",
                "    AND (\n",
                "      item.`Rejection Status` != 'C'\n",
                "      OR item.`Rejection Status` IS NULL\n",
                "    )\n",
                "    AND item.`Order Status` != 'C'\n",
                "    AND (\n",
                "      item.`Sales Document Type Description` IN (\n",
                "        'Standard Order', 'Rush Order', 'Consignment Issue'\n",
                "      )\n",
                "      OR item.`Sales Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "    )\n",
                "    AND item.`Created On` >= 20260101\n",
                "),\n",
                "-- Pass 1: All schedule lines for 2026+ orders via INNER JOIN\n",
                "all_sl_raw AS (\n",
                "  SELECT\n",
                "    sl.`Sales Document Number`,\n",
                "    sl.`Sales Document Item Number`,\n",
                "    TO_DATE(CAST(sl.`Goods Issue Date` AS STRING), 'yyyyMMdd') AS gi_date,\n",
                "    sl.`Measure Confirmed Quantity` AS confirmed_qty,\n",
                "    sl.`Measure Order Quantity` AS sl_order_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_schedule_line${var.source_snapshot_suffix}` sl\n",
                "      INNER JOIN industry_orders io\n",
                "        ON sl.`Sales Document Number` = io.`Sales Document Number`\n",
                "        AND sl.`Sales Document Item Number` = io.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    sl.`Goods Issue Date` >= 20260101\n",
                "    AND (sl.`Measure Order Quantity` > 0 OR sl.`Measure Confirmed Quantity` > 0)\n",
                "),\n",
                "all_sl AS (\n",
                "  SELECT `Sales Document Number`, `Sales Document Item Number`,\n",
                "    gi_date, confirmed_qty, sl_order_qty\n",
                "  FROM (\n",
                "    SELECT r.*,\n",
                "      MAX(CASE WHEN r.confirmed_qty > 0 AND r.sl_order_qty > 0 THEN 1 ELSE 0 END)\n",
                "        OVER (PARTITION BY r.`Sales Document Number`, r.`Sales Document Item Number`) AS has_oq_conf\n",
                "    FROM all_sl_raw r\n",
                "  )\n",
                "  WHERE NOT (confirmed_qty > 0 AND sl_order_qty = 0 AND has_oq_conf = 1)\n",
                "),\n",
                "-- Items with confirmed lines (need full history for FIFO)\n",
                "confirmed_items AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_sl\n",
                "  WHERE\n",
                "    confirmed_qty > 0\n",
                "),\n",
                "item_has_confirmed AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    SUM(confirmed_qty) AS total_confirmed_qty\n",
                "  FROM\n",
                "    all_sl\n",
                "  WHERE\n",
                "    confirmed_qty > 0\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "),\n",
                "item_unconfirmed_total AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    all_sl asl\n",
                "      LEFT JOIN confirmed_items ci\n",
                "        ON ci.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ci.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    ci.`Sales Document Number` IS NULL\n",
                "    AND asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "item_partial_unconfirmed AS (\n",
                "  SELECT\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`,\n",
                "    SUM(asl.sl_order_qty) AS total_unconfirmed_order_qty\n",
                "  FROM\n",
                "    all_sl asl\n",
                "      INNER JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "      INNER JOIN industry_orders io\n",
                "        ON io.`Sales Document Number` = asl.`Sales Document Number`\n",
                "        AND io.`Sales Document Item Number` = asl.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.sl_order_qty > 0\n",
                "    AND asl.confirmed_qty = 0\n",
                "    AND ihc.total_confirmed_qty < io.order_qty\n",
                "    AND io.order_qty > 0\n",
                "  GROUP BY\n",
                "    asl.`Sales Document Number`,\n",
                "    asl.`Sales Document Item Number`\n",
                "),\n",
                "items_with_any_sl AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_sl\n",
                "),\n",
                "date_dim AS (\n",
                "  SELECT\n",
                "    `Date Delivery Key`,\n",
                "    `Date Delivery` AS dim_date\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_date_delivery${var.source_snapshot_suffix}`\n",
                "),\n",
                "rule1a AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    CASE\n",
                "      WHEN ihc.total_confirmed_qty >= o.order_qty OR o.order_qty = 0\n",
                "      THEN o.order_value_eur * (asl.confirmed_qty / ihc.total_confirmed_qty)\n",
                "      ELSE o.order_value_eur * (asl.confirmed_qty / GREATEST(o.order_qty, ihc.total_confirmed_qty))\n",
                "    END AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    asl.confirmed_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_sl asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty > 0\n",
                "),\n",
                "rule1b AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur * (asl.sl_order_qty / iut.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    asl.sl_order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_unconfirmed_total iut\n",
                "        ON iut.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND iut.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_sl asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule1b_partial AS (\n",
                "  SELECT\n",
                "    asl.gi_date AS delivery_date,\n",
                "    o.order_value_eur\n",
                "      * (1.0 - LEAST(ihc.total_confirmed_qty / GREATEST(o.order_qty, 1), 1.0))\n",
                "      * (asl.sl_order_qty / ipu.total_unconfirmed_order_qty) AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    asl.sl_order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      JOIN item_has_confirmed ihc\n",
                "        ON ihc.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ihc.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN item_partial_unconfirmed ipu\n",
                "        ON ipu.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND ipu.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN all_sl asl\n",
                "        ON asl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND asl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    asl.confirmed_qty = 0\n",
                "    AND asl.sl_order_qty > 0\n",
                "),\n",
                "rule2 AS (\n",
                "  SELECT\n",
                "    dd.dim_date AS delivery_date,\n",
                "    o.order_value_eur AS allocated_value,\n",
                "    o.`Sales Document Number`,\n",
                "    o.`Sales Document Item Number`,\n",
                "    o.`Customer Key`,\n",
                "    o.`Material Key`,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.shipping_condition,\n",
                "    o.created_by,\n",
                "    o.order_qty AS line_qty,\n",
                "    o.order_qty\n",
                "  FROM\n",
                "    industry_orders o\n",
                "      LEFT JOIN items_with_any_sl isl\n",
                "        ON isl.`Sales Document Number` = o.`Sales Document Number`\n",
                "        AND isl.`Sales Document Item Number` = o.`Sales Document Item Number`\n",
                "      JOIN date_dim dd\n",
                "        ON dd.`Date Delivery Key` = o.`Delivery Date To Key`\n",
                "  WHERE\n",
                "    isl.`Sales Document Number` IS NULL\n",
                "),\n",
                "all_alloc AS (\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1a\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule1b_partial\n",
                "  UNION ALL\n",
                "  SELECT\n",
                "    *\n",
                "  FROM\n",
                "    rule2\n",
                "),\n",
                "orders_in_scope AS (\n",
                "  SELECT DISTINCT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`\n",
                "  FROM\n",
                "    all_alloc\n",
                "),\n",
                "billing AS (\n",
                "  SELECT\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`,\n",
                "    SUM(b.`Billed Quantity`) AS billed_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_billing_document_line_item${var.source_snapshot_suffix}` b\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = b.`Sales Document Number`\n",
                "        AND ois.`Sales Document Item Number` = b.`Sales Document Item Number`\n",
                "  WHERE\n",
                "    b.`Billed Quantity` > 0\n",
                "    AND b.`SD Document Category` = 'M'\n",
                "  GROUP BY\n",
                "    b.`Sales Document Number`,\n",
                "    b.`Sales Document Item Number`\n",
                "),\n",
                "delivery_tbl AS (\n",
                "  SELECT\n",
                "    d.`Reference Document` AS `Sales Document Number`,\n",
                "    d.`Reference Item` AS `Sales Document Item Number`,\n",
                "    SUM(d.`Measure Actual Delivery Quantity`) AS delivered_qty\n",
                "  FROM\n",
                "    `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_delivery_item${var.source_snapshot_suffix}` d\n",
                "      INNER JOIN orders_in_scope ois\n",
                "        ON ois.`Sales Document Number` = d.`Reference Document`\n",
                "        AND ois.`Sales Document Item Number` = d.`Reference Item`\n",
                "  WHERE\n",
                "    d.`Goods Movement Status` = 'C'\n",
                "  GROUP BY\n",
                "    d.`Reference Document`,\n",
                "    d.`Reference Item`\n",
                "),\n",
                "combined AS (\n",
                "  SELECT\n",
                "    a.*,\n",
                "    GREATEST(COALESCE(d.delivered_qty, 0), COALESCE(b.billed_qty, 0)) AS fulfilled_qty,\n",
                "    SUM(a.line_qty) OVER (\n",
                "        PARTITION BY a.`Sales Document Number`, a.`Sales Document Item Number`\n",
                "        ORDER BY a.delivery_date\n",
                "        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n",
                "      ) AS cumul_qty\n",
                "  FROM\n",
                "    all_alloc a\n",
                "      LEFT JOIN billing b\n",
                "        ON b.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND b.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "      LEFT JOIN delivery_tbl d\n",
                "        ON d.`Sales Document Number` = a.`Sales Document Number`\n",
                "        AND d.`Sales Document Item Number` = a.`Sales Document Item Number`\n",
                "),\n",
                "with_open AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    shipping_condition,\n",
                "    created_by,\n",
                "    delivery_date,\n",
                "    CASE\n",
                "      WHEN fulfilled_qty >= order_qty AND order_qty > 0 THEN 0\n",
                "      WHEN\n",
                "        line_qty > 0\n",
                "      THEN\n",
                "        allocated_value\n",
                "          * (\n",
                "            1\n",
                "              - LEAST(\n",
                "                GREATEST(LEAST(fulfilled_qty, cumul_qty) - (cumul_qty - line_qty), 0) / line_qty,\n",
                "                1.0\n",
                "              )\n",
                "          )\n",
                "      ELSE\n",
                "        CASE\n",
                "          WHEN fulfilled_qty > 0 THEN 0\n",
                "          ELSE allocated_value\n",
                "        END\n",
                "    END AS open_value_eur\n",
                "  FROM\n",
                "    combined\n",
                "),\n",
                "item_agg AS (\n",
                "  SELECT\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    shipping_condition,\n",
                "    created_by,\n",
                "    SUM(open_value_eur) AS total_open_value,\n",
                "    MIN(delivery_date) AS min_open_date\n",
                "  FROM\n",
                "    with_open\n",
                "  WHERE\n",
                "    open_value_eur > 0\n",
                "  GROUP BY\n",
                "    `Sales Document Number`,\n",
                "    `Sales Document Item Number`,\n",
                "    `Customer Key`,\n",
                "    `Material Key`,\n",
                "    segment,\n",
                "    cs_team,\n",
                "    shipping_condition,\n",
                "    created_by\n",
                "),\n",
                "ranked AS (\n",
                "  SELECT\n",
                "    o.`Sales Document Number` AS order_number,\n",
                "    o.`Sales Document Item Number` AS item_number,\n",
                "    COALESCE(c.`Customer & Text`, CAST(o.`Customer Key` AS STRING)) AS customer,\n",
                "    COALESCE(m.`Material Text`, CAST(o.`Material Key` AS STRING)) AS material,\n",
                "    o.segment,\n",
                "    o.cs_team,\n",
                "    o.shipping_condition,\n",
                "    COALESCE(un.`User Name`, o.created_by) AS created_by,\n",
                "    o.min_open_date AS planned_gi_date,\n",
                "    ROUND(o.total_open_value, 0) AS open_value_eur,\n",
                "    DATEDIFF(CURRENT_DATE(), o.min_open_date) AS days_overdue,\n",
                "    CASE\n",
                "      WHEN o.min_open_date >= DATE_TRUNC('MONTH', CURRENT_DATE()) THEN 'Current Month'\n",
                "      ELSE 'Prior YTD Months'\n",
                "    END AS period,\n",
                "    CASE\n",
                "      WHEN DATEDIFF(CURRENT_DATE(), o.min_open_date) <= 7 THEN '1-7 days'\n",
                "      WHEN DATEDIFF(CURRENT_DATE(), o.min_open_date) <= 14 THEN '8-14 days'\n",
                "      WHEN DATEDIFF(CURRENT_DATE(), o.min_open_date) <= 30 THEN '15-30 days'\n",
                "      ELSE '30+ days'\n",
                "    END AS aging_bucket\n",
                "  FROM\n",
                "    item_agg o\n",
                "      LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_customer${var.source_snapshot_suffix}` c\n",
                "        ON c.`Customer Key` = o.`Customer Key`\n",
                "      LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_material${var.source_snapshot_suffix}` m\n",
                "        ON m.`Material Key` = o.`Material Key`\n",
                "      LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_users${var.source_snapshot_suffix}` un\n",
                "        ON un.`User ID` = o.created_by\n",
                "  WHERE\n",
                "    o.min_open_date < DATE_SUB(CURRENT_DATE(), 1)\n",
                ")\n",
                "SELECT\n",
                "  *,\n",
                "  ROW_NUMBER() OVER (PARTITION BY period ORDER BY open_value_eur DESC) AS rank_in_period\n",
                "FROM ranked\n",
                "ORDER BY\n",
                "  open_value_eur DESC"
              ],
              "columns": [
                {
                  "displayName": "priority",
                  "description": "",
                  "expression": "CASE WHEN `open_value_eur` >= 25000 THEN '1 - Critical' WHEN `open_value_eur` >= 10000 THEN '2 - High' WHEN `open_value_eur` >= 2500 THEN '3 - Medium' ELSE '4 - Low' END"
                }
              ]
            },
            {
              "name": "ds_cancellations_trend",
              "displayName": "Cancellations Daily Trend",
              "queryLines": [
                "SELECT\n",
                "  TO_DATE(CAST(o.`Date - Item Creation` AS STRING), 'yyyyMMdd') AS cancel_date,\n",
                "  COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "  CASE\n",
                "    WHEN o.`Rejection Reason` IN ('01', '10') THEN 'Customer-driven'\n",
                "    WHEN o.`Rejection Reason` = '02' THEN 'Internal error'\n",
                "    WHEN o.`Rejection Reason` IN ('Z6', '12') THEN 'Material change'\n",
                "    WHEN o.`Rejection Reason` IN ('08', '14') THEN 'Logistics'\n",
                "    WHEN o.`Rejection Reason` IN ('04', '05') THEN 'Supply issue'\n",
                "    WHEN o.`Rejection Reason` IN ('03', '06', '11') THEN 'Administrative'\n",
                "    WHEN o.`Rejection Reason` = '09' THEN 'Pricing'\n",
                "    ELSE 'Other'\n",
                "  END AS reason_category,\n",
                "  COUNT(*) AS cancelled_lines,\n",
                "  ROUND(SUM(COALESCE(o.`Net Value Euro`, 0)), 0) AS cancelled_value_eur\n",
                "FROM\n",
                "  `${var.catalog}`.silver.`industry_sales_src_dbx_fact_o2c___self_service___sales_orders${var.source_snapshot_suffix}` o\n",
                "    INNER JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "      ON o.`FK Sales Organization` = sorg.`Sales Organization Key`\n",
                "    LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "      ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "WHERE\n",
                "  sorg.`Business Unit 2` = '34'\n",
                "  AND o.`Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "  AND o.`Rejection Status` = 'C'\n",
                "  AND TO_DATE(CAST(o.`Date - Item Creation` AS STRING), 'yyyyMMdd')\n",
                "    >= DATE_ADD(CURRENT_DATE(), -180)\n",
                "GROUP BY\n",
                "  1,\n",
                "  2,\n",
                "  3\n",
                "ORDER BY\n",
                "  cancel_date"
              ]
            },
            {
              "name": "ds_cancellations_detail_7d",
              "displayName": "Cancellations Detail",
              "queryLines": [
                "SELECT\n",
                "  o.`Order Number` AS order_id,\n",
                "  o.`Order Item Number` AS item_no,\n",
                "  TO_DATE(CAST(o.`Date - Item Creation` AS STRING), 'yyyyMMdd') AS created_date,\n",
                "  TO_DATE(CAST(o.`Date - Item Changed` AS STRING), 'yyyyMMdd') AS cancelled_date,\n",
                "  COALESCE(c.`Name 1`, CAST(o.`FK Sold to Party` AS STRING)) AS customer,\n",
                "  sorg.`Country key` AS country,\n",
                "  COALESCE(csm.`cs_team`, 'Unmapped') AS cs_team,\n",
                "  CASE\n",
                "    WHEN o.`Rejection Reason` IN ('01', '10') THEN 'Customer-driven'\n",
                "    WHEN o.`Rejection Reason` = '02' THEN 'Internal error'\n",
                "    WHEN o.`Rejection Reason` IN ('Z6', '12') THEN 'Material change'\n",
                "    WHEN o.`Rejection Reason` IN ('08', '14') THEN 'Logistics'\n",
                "    WHEN o.`Rejection Reason` IN ('04', '05') THEN 'Supply issue'\n",
                "    WHEN o.`Rejection Reason` IN ('03', '06', '11') THEN 'Administrative'\n",
                "    WHEN o.`Rejection Reason` = '09' THEN 'Pricing'\n",
                "    ELSE 'Other'\n",
                "  END AS reason_category,\n",
                "  COALESCE(o.`Rejection Reason`, 'Unknown') AS rejection_reason,\n",
                "  COALESCE(ph.`L2 Product Description`, 'Unknown') AS product_group,\n",
                "  COALESCE(m.`Material Text`, CAST(o.`FK Material` AS STRING)) AS material,\n",
                "  COALESCE(item.`Application area Description`, 'Unknown') AS segment,\n",
                "  ROUND(COALESCE(o.`Net Value Euro`, 0), 0) AS value_eur,\n",
                "  DATEDIFF(\n",
                "    TO_DATE(CAST(o.`Date - Item Changed` AS STRING), 'yyyyMMdd'),\n",
                "    TO_DATE(CAST(o.`Date - Item Creation` AS STRING), 'yyyyMMdd')\n",
                "  ) AS days_to_cancel\n",
                "FROM\n",
                "  `${var.catalog}`.silver.`industry_sales_src_dbx_fact_o2c___self_service___sales_orders${var.source_snapshot_suffix}` o\n",
                "    INNER JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_sales_organization${var.source_snapshot_suffix}` sorg\n",
                "      ON o.`FK Sales Organization` = sorg.`Sales Organization Key`\n",
                "    LEFT JOIN ${var.catalog}.gold.${var.mapping_table_name} csm\n",
                "      ON sorg.`Sales_Organization ID` = csm.`sales_org_code`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_customer${var.source_snapshot_suffix}` c\n",
                "      ON c.`Customer Key` = o.`FK Sold to Party`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_material${var.source_snapshot_suffix}` m\n",
                "      ON o.`FK Material` = m.`Material Key`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_dim_product_hierarchy${var.source_snapshot_suffix}` ph\n",
                "      ON ph.`Material Code` = m.`Material Code`\n",
                "    LEFT JOIN `${var.catalog}`.silver.`industry_sales_src_dbx_fact_sales_distribution_sales_document_item${var.source_snapshot_suffix}` item\n",
                "      ON item.`Sales Document Number` = o.`Order Number`\n",
                "      AND item.`Sales Document Item Number` = o.`Order Item Number`\n",
                "WHERE\n",
                "  sorg.`Business Unit 2` = '34'\n",
                "  AND o.`Document Type` IN ('YOR', 'YSO', 'YKE', 'YKB')\n",
                "  AND o.`Rejection Status` = 'C'\n",
                "  AND (:cancel_date.min IS NULL OR TO_DATE(CAST(o.`Date - Item Changed` AS STRING), 'yyyyMMdd') >= :cancel_date.min)\n",
                "  AND (:cancel_date.max IS NULL OR TO_DATE(CAST(o.`Date - Item Changed` AS STRING), 'yyyyMMdd') <= :cancel_date.max)\n",
                "ORDER BY\n",
                "  value_eur DESC"
              ],
              "parameters": [
                {
                  "displayName": "Cancellation Date",
                  "keyword": "cancel_date",
                  "dataType": "DATE",
                  "complexType": "RANGE",
                  "defaultSelection": {
                    "range": {
                      "dataType": "DATE",
                      "min": {
                        "value": "now-7d/d"
                      },
                      "max": {
                        "value": "now/d"
                      }
                    }
                  }
                }
              ]
            }
