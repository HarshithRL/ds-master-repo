name: "Automation_Deploy_Databricks_PRD"

resources:
  repositories:
    - repository: da-mdp-foundations-deployments
      type: git
      name: da-mdp-foundations-deployments
      ref: refs/heads/main

# Trigger: only when code lands on the 'acc' branch
trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - 'pipelines/**'

variables:
  - template: variables/databricks_variables_prd.yml

stages:
  # Stage 1: Bundle deploy (Foundations template - uploads src/ to workspace, deploys jobs)
  - template: pipelines/templates/deploy_databricks.yml@da-mdp-foundations-deployments
    parameters:
      env: ${{ variables.PIPELINE_ENV }}
      envLong: ${{ variables.ENV_LONG }}
      subscriptionName: ${{ variables.SUBSCRIPTION_NAME }}
      keyVaultName: ${{ variables.KEYVAULT_NAME }}
      spnIdSecretName: ${{ variables.SPN_ID_SECRET_NAME }}
      spnSecretSecretName: ${{ variables.SPN_SECRET_SECRET_NAME }}
      tenantIdSecretName: ${{ variables.TENANT_SECRET_NAME }}
      adbHostnameSecretName: ${{ variables.ADB_HOST_SECRET_NAME }}
      dbxProfile: ${{ variables.DBX_PROFILE }}

  # Stage 2: Deploy Databricks App
  # LESSON LEARNED: `apps deploy --source-code-path` only deploys CODE.
  # It does NOT update env vars or resources from app.yaml.
  # Must use REST API (PATCH /api/2.0/apps/{name}) to update app config.
  - stage: Deploy_App
    displayName: 'Deploy Air Monitoring App'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: deploy_app
        displayName: 'Deploy App to PRD'
        steps:
          - checkout: self

          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'

          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ variables.SUBSCRIPTION_NAME }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                # === Auth ===
                export DATABRICKS_HOST="https://adb-4844910598668398.18.azuredatabricks.net"
                export DATABRICKS_TOKEN=$(az account get-access-token \
                  --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d \
                  --query accessToken -o tsv)

                echo "=== Step 1: Update app config via REST API (env vars + resources) ==="
                # This DIRECTLY sets the app's env vars and resources
                # (apps deploy only updates code, not config!)
                curl -s -X PATCH "$DATABRICKS_HOST/api/2.0/apps/air-monitoring-app" \
                  -H "Authorization: Bearer $DATABRICKS_TOKEN" \
                  -H "Content-Type: application/json" \
                  -d '{
                    "resources": [
                      {
                        "name": "sql-warehouse",
                        "sql_warehouse": {
                          "id": "83294e3f6b44f138",
                          "permission": "CAN_USE"
                        }
                      }
                    ]
                  }' | tee /tmp/update_response.json
                echo ""

                echo "=== Step 2: Overwrite app.yaml in workspace ==="
                databricks workspace import \
                  /Workspace/automation/ds-air-monitoring-app/P/files/src/app.yaml \
                  --file $(Build.SourcesDirectory)/src/app.prd.yaml \
                  --format SOURCE --overwrite

                echo "=== Step 3: Verify app.yaml was written correctly ==="
                databricks workspace export \
                  /Workspace/automation/ds-air-monitoring-app/P/files/src/app.yaml 2>&1 | head -10

                echo "=== Step 4: Deploy app (SNAPSHOT mode to force fresh read) ==="
                databricks apps deploy air-monitoring-app \
                  --source-code-path "/Workspace/automation/ds-air-monitoring-app/P/files/src" \
                  --mode SNAPSHOT

                echo "=== Step 5: Wait and verify ==="
                sleep 15
                echo "App status:"
                databricks apps get air-monitoring-app 2>&1 | grep -E "status|url|name"

                echo "PRD app deployment complete."
            displayName: 'Update config + Deploy App'
