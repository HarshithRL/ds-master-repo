# =============================================================================
# DATABRICKS ASSET BUNDLE — ds-procure-ai
# =============================================================================
# Databricks App (Flask + React + AI Brain). Discovered by the shared
# DS-Master-Repo CI/CD pipeline. Targets must be D / T / A / P.
#
# Lakebase Autoscaling reuses existing project ds-vendor-agent — do not
# create a new one in DEV/TEST. Branch/database values are full resource paths.
# The Postgres dbname is databricks_postgres; the resource ID is hyphenated
# (databricks-postgres). App runtime env lives in app.yaml (not here).
# Do not put PG passwords or DATABRICKS_CONFIG_PROFILE in bundle/app env.
# Target A declares resources.postgres_projects.ds_vendor_agent so ACC creates
# that same Lakebase project in the ACC workspace, then attaches the app.
# =============================================================================

bundle:
  name: ds-procure-ai

include:
  - resources/*.yml

variables:
  lakebase_branch:
    description: Lakebase Autoscaling branch resource path
    default: projects/ds-vendor-agent/branches/production
  lakebase_database:
    description: Lakebase Autoscaling database resource path (hyphenated ID)
    default: projects/ds-vendor-agent/branches/production/databases/databricks-postgres
  catalog:
    description: The Unity Catalog to use (contains bronze/silver/gold schemas)
  databricks_model:
    description: Fallback DATABRICKS_MODEL (system.ai Foundation Model API)
    default: system.ai.claude-opus-4-5
  fast_model:
    description: Fast chat model (system.ai Foundation Model API)
    default: system.ai.claude-sonnet-4-5
  thinking_model:
    description: Thinking chat model (system.ai Foundation Model API)
    default: system.ai.claude-opus-4-6
  sql_warehouse_id:
    description: SQL warehouse id for Mate UC (DATABRICKS_WAREHOUSE_ID). D/T use dau-automation-sqlwh-d-01; override on A/P.
    default: "69ada62b2fb9b9e2"

sync:
  include:
    - frontend/dist/**
  exclude:
    - .venv/**
    - .databricks/**
    - .pytest_cache/**
    - "**/__pycache__/**"
    - "**/tests/**"
    - frontend/node_modules/**
    - frontend/src/**
    - frontend/public/**
    - frontend/package-lock.json
    - graphify-out/**
    - ai_brain/graphify-out/**
    - logs/**
    - backend/logs/**
    - data/**
    - mlruns/**
    - mlartifacts/**
    - power_app/**
    - "*.ps1"
    - .mate-dev.pids
    - "*.pyc"
    - premium-audit.json
    # Local runtime DBs — Apps rejects files >10MB; Lakebase is the deployed store.
    - mate.sqlite
    - "*.sqlite"
    - "*.sqlite-*"
    - "*.db"

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      sql_warehouse_id: "69ada62b2fb9b9e2"  # dau-automation-sqlwh-d-01
      catalog: automation_d
      lakebase_branch: projects/ds-vendor-agent/branches/production
      lakebase_database: projects/ds-vendor-agent/branches/production/databases/databricks-postgres
      databricks_model: system.ai.claude-opus-4-5
      fast_model: system.ai.claude-sonnet-4-5
      thinking_model: system.ai.claude-opus-4-6
    resources:
      apps:
        ds_procure_ai:
          resources:
            - name: secret-key
              secret:
                key: secret-key
                permission: READ
                scope: procure-ai
            - name: azure-di-endpoint
              secret:
                key: azure-document-intelligence-endpoint
                permission: READ
                scope: procure-ai
            - name: azure-di-key
              secret:
                key: azure-document-intelligence-key
                permission: READ
                scope: procure-ai
          config:
            env:
              - name: DATABRICKS_MODEL
                value: ${var.databricks_model}
              - name: DATABRICKS_FAST_MODEL
                value: ${var.fast_model}
              - name: DATABRICKS_THINKING_MODEL
                value: ${var.thinking_model}
              - name: DATABRICKS_FAST_ENDPOINT
                value: databricks-claude-sonnet-4-5
              - name: DATABRICKS_THINKING_ENDPOINT
                value: databricks-claude-opus-4-6
              - name: FLASK_SECRET_KEY
                value: ${bundle.name}-${bundle.target}
              - name: MATE_LOG_FORMAT
                value: json
              - name: MATE_LOG_LEVEL
                value: INFO
              - name: MATE_DB_BACKEND
                value: uc
              - name: MATE_UC_AUTH
                value: obo
              - name: MATE_UC_CATALOG
                value: ${var.catalog}
              - name: MATE_UC_SCHEMA
                value: bronze
              - name: MATE_UC_VOLUME
                value: bronze_volume
              - name: DATABRICKS_WAREHOUSE_ID
                value: ${var.sql_warehouse_id}
              - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
                value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
              - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
                value: "1bdb532656d248bda3c6b58a9b75441f"

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      sql_warehouse_id: "69ada62b2fb9b9e2"  # dau-automation-sqlwh-d-01
      catalog: automation_d
      lakebase_branch: projects/ds-vendor-agent/branches/production
      lakebase_database: projects/ds-vendor-agent/branches/production/databases/databricks-postgres
      databricks_model: system.ai.claude-opus-4-5
      fast_model: system.ai.claude-sonnet-4-5
      thinking_model: system.ai.claude-opus-4-6
    resources:
      apps:
        ds_procure_ai:
          resources:
            - name: secret-key
              secret:
                key: secret-key
                permission: READ
                scope: procure-ai
            - name: azure-di-endpoint
              secret:
                key: azure-document-intelligence-endpoint
                permission: READ
                scope: procure-ai
            - name: azure-di-key
              secret:
                key: azure-document-intelligence-key
                permission: READ
                scope: procure-ai
          config:
            env:
              - name: DATABRICKS_MODEL
                value: ${var.databricks_model}
              - name: DATABRICKS_FAST_MODEL
                value: ${var.fast_model}
              - name: DATABRICKS_THINKING_MODEL
                value: ${var.thinking_model}
              - name: DATABRICKS_FAST_ENDPOINT
                value: databricks-claude-sonnet-4-5
              - name: DATABRICKS_THINKING_ENDPOINT
                value: databricks-claude-opus-4-6
              - name: FLASK_SECRET_KEY
                value: ${bundle.name}-${bundle.target}
              - name: MATE_LOG_FORMAT
                value: json
              - name: MATE_LOG_LEVEL
                value: INFO
              - name: MATE_DB_BACKEND
                value: uc
              - name: MATE_UC_AUTH
                value: obo
              - name: MATE_UC_CATALOG
                value: ${var.catalog}
              - name: MATE_UC_SCHEMA
                value: bronze
              - name: MATE_UC_VOLUME
                value: bronze_volume
              - name: DATABRICKS_WAREHOUSE_ID
                value: ${var.sql_warehouse_id}
              - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
                value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
              - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
                value: "1bdb532656d248bda3c6b58a9b75441f"
    permissions:
      # Local CLI deploys as a user; CI deploys as this workspace SP.
      # service_principal_name + current_user.userName 404s for a human identity.
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - service_principal_name: 1ff203aa-a0ad-475e-85aa-4eac5c23bdc7
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      sql_warehouse_id: "69bb7020516c64f5"  # aut-dsprocureai-consumer-sqlwh-a
      catalog: automation_a
      databricks_model: system.ai.claude-opus-4-5
      fast_model: system.ai.claude-sonnet-4-5
      thinking_model: system.ai.claude-opus-4-6
      lakebase_branch: ${resources.postgres_projects.ds_vendor_agent.id}/branches/production
      lakebase_database: ${resources.postgres_projects.ds_vendor_agent.id}/branches/production/databases/databricks-postgres
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE
    resources:
      postgres_projects:
        ds_vendor_agent:
          project_id: ds-vendor-agent
          display_name: ds-vendor-agent
          pg_version: 17
          permissions:
            - service_principal_name: ${workspace.current_user.userName}
              level: CAN_MANAGE
            - service_principal_name: ${resources.apps.ds_procure_ai.service_principal_client_id}
              level: CAN_USE
            - user_name: pierre.delaguiche@etexgroup.com
              level: CAN_MANAGE
            - user_name: mustafaarda.bicakci@etexgroup.com
              level: CAN_MANAGE
            - user_name: harshith.raghunath@etexgroup.com
              level: CAN_MANAGE
      apps:
        ds_procure_ai:
          name: ds-procure-ai
          config:
            env:
              - name: DATABRICKS_MODEL
                value: ${var.databricks_model}
              - name: DATABRICKS_FAST_MODEL
                value: ${var.fast_model}
              - name: DATABRICKS_THINKING_MODEL
                value: ${var.thinking_model}
              - name: DATABRICKS_FAST_ENDPOINT
                value: databricks-claude-sonnet-4-5
              - name: DATABRICKS_THINKING_ENDPOINT
                value: databricks-claude-opus-4-6
              - name: FLASK_SECRET_KEY
                value: ${bundle.name}-${bundle.target}
              - name: MATE_LOG_FORMAT
                value: json
              - name: MATE_LOG_LEVEL
                value: INFO
              - name: MATE_DB_BACKEND
                value: uc
              - name: MATE_UC_AUTH
                value: obo
              - name: MATE_UC_CATALOG
                value: ${var.catalog}
              - name: MATE_UC_SCHEMA
                value: bronze
              - name: MATE_UC_VOLUME
                value: bronze_volume
              - name: DATABRICKS_WAREHOUSE_ID
                value: ${var.sql_warehouse_id}
              - name: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
                value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
              - name: AZURE_DOCUMENT_INTELLIGENCE_KEY
                value: "1bdb532656d248bda3c6b58a9b75441f"

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      catalog: automation_p
      databricks_model: system.ai.claude-opus-4-5
      fast_model: system.ai.claude-sonnet-4-5
      thinking_model: system.ai.claude-opus-4-6
      # Confirm PRD Lakebase paths before merge to main (PRD pipeline deploys --target P).
      lakebase_branch: projects/ds-vendor-agent/branches/production
      lakebase_database: projects/ds-vendor-agent/branches/production/databases/databricks-postgres
    permissions:
      - service_principal_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE
