resources:
  dashboards:
    etex_ai_cost_executive_overview:
      display_name: "Etex AI Cost Executive Overview"
      serialized_dashboard: |-
        {
          "datasets": [
            {
              "name": "azure_monthly_cost",
              "displayName": "Azure AI Monthly Cost by Component",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH billed AS (SELECT DATE_TRUNC('MONTH', cost_date) AS cost_month, CASE WHEN ai_capability = 'Copilot Studio' THEN 'Copilot Studio (Azure invoice)' WHEN cost_domain = 'Databricks' THEN 'Databricks AI' WHEN cost_domain = 'AI Foundry' THEN 'Azure AI Foundry' WHEN ai_capability = 'GitHub Copilot' THEN 'GitHub Copilot' ELSE 'Other AI invoice' END AS cost_driver, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_date >= DATE_TRUNC('YEAR', ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)) AND cost_date < DATE_TRUNC('MONTH', CURRENT_DATE())), components AS (SELECT cost_month, cost_driver, SUM(cost_eur) AS cost_eur FROM billed GROUP BY 1, 2), monthly AS (SELECT cost_month, SUM(cost_eur) AS total_eur FROM components GROUP BY 1), comparison AS (SELECT m.cost_month, m.total_eur, p.total_eur AS previous_eur, SUM(m.total_eur) OVER (PARTITION BY YEAR(m.cost_month) ORDER BY m.cost_month) AS total_ytd_eur FROM monthly m LEFT JOIN monthly p ON p.cost_month = ADD_MONTHS(m.cost_month, -1)), component_ytd AS (SELECT cost_month, cost_driver, cost_eur, SUM(cost_eur) OVER (PARTITION BY cost_driver, YEAR(cost_month) ORDER BY cost_month) AS component_ytd_eur FROM components) SELECT c.cost_month, c.cost_driver, c.cost_eur, ROUND(m.total_eur, 2) AS total_eur, ROUND(m.previous_eur, 2) AS previous_eur, ROUND(m.total_ytd_eur, 2) AS total_ytd_eur, ROUND(COALESCE(p.cost_eur, 0), 2) AS component_previous_eur, ROUND(c.component_ytd_eur, 2) AS component_ytd_eur, ROUND(100.0 * (c.cost_eur - COALESCE(p.cost_eur, 0)) / NULLIF(p.cost_eur, 0), 1) AS component_change_pct, ROUND(100.0 * (m.total_eur - m.previous_eur) / NULLIF(m.previous_eur, 0), 1) AS change_pct FROM component_ytd c JOIN comparison m ON c.cost_month = m.cost_month LEFT JOIN components p ON p.cost_driver = c.cost_driver AND p.cost_month = ADD_MONTHS(c.cost_month, -1) WHERE c.cost_month >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)",
                "dimensions": [
                  {
                    "name": "cost_month",
                    "expr": "cost_month"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  },
                  {
                    "name": "monthly_total_eur",
                    "expr": "MAX(total_eur)"
                  },
                  {
                    "name": "change_pct",
                    "expr": "MAX(change_pct)"
                  },
                  {
                    "name": "selected_month_eur",
                    "expr": "IF(COUNT(DISTINCT cost_driver) > 1, MAX_BY(total_eur, cost_month), MAX_BY(cost_eur, cost_month))"
                  },
                  {
                    "name": "selected_mom_pct",
                    "expr": "IF(COUNT(DISTINCT cost_driver) > 1, MAX_BY(change_pct, cost_month), MAX_BY(component_change_pct, cost_month))"
                  },
                  {
                    "name": "selected_ytd_eur",
                    "expr": "IF(COUNT(DISTINCT cost_driver) > 1, MAX_BY(total_ytd_eur, cost_month), MAX_BY(component_ytd_eur, cost_month))"
                  },
                  {
                    "name": "selected_previous_eur",
                    "expr": "IF(COUNT(DISTINCT cost_driver) > 1, MAX_BY(previous_eur, cost_month), MAX_BY(component_previous_eur, cost_month))"
                  }
                ]
              }
            },
            {
              "name": "monthly_ai_components_with_credits",
              "displayName": "Monthly AI Invoice and Copilot Credit Equivalent by Component",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH invoice_components AS (SELECT DATE_TRUNC('MONTH', cost_date) AS cost_month, CASE WHEN ai_capability = 'Copilot Studio' THEN 'Copilot Studio (Azure invoice)' WHEN cost_domain = 'Databricks' THEN 'Databricks AI' WHEN cost_domain = 'AI Foundry' THEN 'Azure AI Foundry' WHEN ai_capability = 'GitHub Copilot' THEN 'GitHub Copilot' ELSE 'Other AI invoice' END AS cost_driver, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_date >= DATE_TRUNC('YEAR', ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)) AND cost_date < DATE_TRUNC('MONTH', CURRENT_DATE())), credit_equivalents AS (SELECT CASE WHEN period_start_date < DATE '2026-06-01' THEN DATE '2026-06-01' ELSE CAST(DATE_TRUNC('MONTH', period_start_date) AS DATE) END AS cost_month, 'Copilot Studio (credit equivalent; not invoiced)' AS cost_driver, total_cost_eur AS cost_eur FROM ${var.catalog}.gold.copilot_credit_historical_periods) SELECT * FROM invoice_components UNION ALL SELECT * FROM credit_equivalents",
                "dimensions": [
                  {
                    "name": "cost_month",
                    "expr": "cost_month"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  }
                ]
              }
            },
            {
              "name": "azure_cumulative_cost",
              "displayName": "Azure AI Invoice by Day and Component",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT CAST(cost_date AS DATE) AS cost_date, CASE WHEN ai_capability = 'Copilot Studio' THEN 'Copilot Studio (Azure invoice)' WHEN cost_domain = 'Databricks' THEN 'Databricks AI' WHEN cost_domain = 'AI Foundry' THEN 'Azure AI Foundry' WHEN ai_capability = 'GitHub Copilot' THEN 'GitHub Copilot' ELSE 'Other AI invoice' END AS cost_driver, SUM(cost_eur) AS cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_date <= CURRENT_DATE() GROUP BY 1, 2",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  }
                ]
              }
            },
            {
              "name": "cumulative_ai_components_with_credits",
              "displayName": "Cumulative AI Invoice and Copilot Credit Equivalent by Component",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH components AS (SELECT CAST(cost_date AS DATE) AS cost_date, CASE WHEN ai_capability = 'Copilot Studio' THEN 'Copilot Studio (Azure invoice)' WHEN cost_domain = 'Databricks' THEN 'Databricks AI' WHEN cost_domain = 'AI Foundry' THEN 'Azure AI Foundry' WHEN ai_capability = 'GitHub Copilot' THEN 'GitHub Copilot' ELSE 'Other AI invoice' END AS cost_driver, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_date <= CURRENT_DATE() UNION ALL SELECT CASE WHEN period_start_date < DATE '2026-06-01' THEN DATE '2026-06-01' ELSE CAST(DATE_TRUNC('MONTH', period_start_date) AS DATE) END AS cost_date, 'Copilot Studio (credit equivalent; not invoiced)' AS cost_driver, total_cost_eur AS cost_eur FROM ${var.catalog}.gold.copilot_credit_historical_periods) SELECT cost_date, cost_driver, SUM(cost_eur) AS cost_eur FROM components GROUP BY 1, 2",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  }
                ]
              }
            },
            {
              "name": "etexmate_cumulative_cost",
              "displayName": "EtexMate Invoice by Day",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT CAST(cost_date AS DATE) AS cost_date, 'EtexMate' AS cost_driver, SUM(cost_eur) AS cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_domain = 'AI Foundry' AND LOWER(TRIM(spoke)) IN ('automation', 'intelligent automation') AND cost_date <= CURRENT_DATE() GROUP BY 1, 2",
                "dimensions": [
                  {
                    "name": "cost_date",
                    "expr": "cost_date"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  }
                ]
              }
            },
            {
              "name": "etexmate_monthly_cost",
              "displayName": "EtexMate Monthly Cost",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH billed AS (SELECT DATE_TRUNC('MONTH', cost_date) AS cost_month, 'EtexMate' AS cost_driver, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE is_ai = TRUE AND cost_domain = 'AI Foundry' AND LOWER(TRIM(spoke)) IN ('automation', 'intelligent automation') AND cost_date >= DATE_TRUNC('YEAR', ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)) AND cost_date < DATE_TRUNC('MONTH', CURRENT_DATE())), components AS (SELECT cost_month, cost_driver, SUM(cost_eur) AS cost_eur FROM billed GROUP BY 1, 2), monthly AS (SELECT cost_month, SUM(cost_eur) AS total_eur FROM components GROUP BY 1), comparison AS (SELECT m.cost_month, m.total_eur, p.total_eur AS previous_eur, SUM(m.total_eur) OVER (PARTITION BY YEAR(m.cost_month) ORDER BY m.cost_month) AS total_ytd_eur FROM monthly m LEFT JOIN monthly p ON p.cost_month = ADD_MONTHS(m.cost_month, -1)), component_ytd AS (SELECT cost_month, cost_driver, cost_eur, SUM(cost_eur) OVER (PARTITION BY cost_driver, YEAR(cost_month) ORDER BY cost_month) AS component_ytd_eur FROM components) SELECT c.cost_month, c.cost_driver, c.cost_eur, ROUND(m.total_eur, 2) AS total_eur, ROUND(m.previous_eur, 2) AS previous_eur, ROUND(m.total_ytd_eur, 2) AS total_ytd_eur, ROUND(COALESCE(p.cost_eur, 0), 2) AS component_previous_eur, ROUND(c.component_ytd_eur, 2) AS component_ytd_eur, ROUND(100.0 * (c.cost_eur - COALESCE(p.cost_eur, 0)) / NULLIF(p.cost_eur, 0), 1) AS component_change_pct, ROUND(100.0 * (m.total_eur - m.previous_eur) / NULLIF(m.previous_eur, 0), 1) AS change_pct FROM component_ytd c JOIN comparison m ON c.cost_month = m.cost_month LEFT JOIN components p ON p.cost_driver = c.cost_driver AND p.cost_month = ADD_MONTHS(c.cost_month, -1) WHERE c.cost_month >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -12)",
                "dimensions": [
                  {
                    "name": "cost_month",
                    "expr": "cost_month"
                  },
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  }
                ],
                "measures": [
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(cost_eur)"
                  },
                  {
                    "name": "monthly_total_eur",
                    "expr": "MAX(total_eur)"
                  },
                  {
                    "name": "change_pct",
                    "expr": "MAX(change_pct)"
                  },
                  {
                    "name": "selected_month_eur",
                    "expr": "MAX_BY(cost_eur, cost_month)"
                  },
                  {
                    "name": "selected_mom_pct",
                    "expr": "MAX_BY(component_change_pct, cost_month)"
                  },
                  {
                    "name": "selected_ytd_eur",
                    "expr": "MAX_BY(component_ytd_eur, cost_month)"
                  },
                  {
                    "name": "selected_previous_eur",
                    "expr": "MAX_BY(component_previous_eur, cost_month)"
                  }
                ]
              }
            },
            {
              "name": "etexmate_cost_movements",
              "displayName": "EtexMate Invoice Context",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH invoice AS (SELECT cost_date, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -2) AND cost_date < DATE_TRUNC('MONTH', CURRENT_DATE()) AND is_ai = TRUE AND cost_domain = 'AI Foundry' AND LOWER(TRIM(spoke)) IN ('automation', 'intelligent automation')) SELECT 'EtexMate' AS cost_driver, 'Closed-month Azure invoice' AS cost_basis, ROUND(SUM(CASE WHEN cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -1) THEN cost_eur ELSE 0 END), 2) AS amount_eur, ROUND(SUM(CASE WHEN cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -1) THEN cost_eur ELSE -cost_eur END), 2) AS change_eur FROM invoice",
                "dimensions": [
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  },
                  {
                    "name": "cost_basis",
                    "expr": "cost_basis"
                  }
                ],
                "measures": [
                  {
                    "name": "amount_eur",
                    "expr": "MAX(amount_eur)"
                  },
                  {
                    "name": "change_eur",
                    "expr": "MAX(change_eur)"
                  }
                ]
              }
            },
            {
              "name": "copilot_credit_historical",
              "displayName": "Copilot Credit Historical Periods",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT period_label, period_start_date, period_end_date, period_days, CASE WHEN period_start_date < DATE '2026-06-01' THEN 'Jun 2026 and earlier' ELSE DATE_FORMAT(CAST(DATE_TRUNC('MONTH', period_start_date) AS DATE), 'MMM yyyy') END AS reporting_period, total_credits, total_cost_eur FROM ${var.catalog}.gold.copilot_credit_historical_periods",
                "dimensions": [
                  {
                    "name": "period_label",
                    "expr": "period_label"
                  },
                  {
                    "name": "reporting_period",
                    "expr": "reporting_period"
                  },
                  {
                    "name": "period_start_date",
                    "expr": "period_start_date"
                  },
                  {
                    "name": "period_end_date",
                    "expr": "period_end_date"
                  },
                  {
                    "name": "period_days",
                    "expr": "period_days"
                  }
                ],
                "measures": [
                  {
                    "name": "total_credits",
                    "expr": "SUM(total_credits)"
                  },
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(total_cost_eur)"
                  }
                ]
              }
            },
            {
              "name": "copilot_credit_live",
              "displayName": "Copilot Credit Live Rolling Snapshots",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "SELECT snapshot_date, total_credits, total_cost_eur FROM ${var.catalog}.gold.copilot_credit_live_snapshots",
                "dimensions": [
                  {
                    "name": "snapshot_date",
                    "expr": "snapshot_date"
                  }
                ],
                "measures": [
                  {
                    "name": "total_credits",
                    "expr": "SUM(total_credits)"
                  },
                  {
                    "name": "total_cost_eur",
                    "expr": "SUM(total_cost_eur)"
                  },
                  {
                    "name": "latest_rolling_30d_credits",
                    "expr": "MAX_BY(total_credits, snapshot_date)"
                  },
                  {
                    "name": "latest_rolling_30d_cost_eur",
                    "expr": "MAX_BY(total_cost_eur, snapshot_date)"
                  }
                ]
              }
            },
            {
              "name": "cost_movements",
              "displayName": "AI Invoice Components and Studio Credit Context",
              "catalog": "${var.catalog}",
              "config": {
                "version": "1.1",
                "source": "WITH classified AS (SELECT CASE WHEN ai_capability = 'Copilot Studio' THEN 'Copilot Studio (Azure invoice)' WHEN cost_domain = 'Databricks' THEN 'Databricks AI' WHEN cost_domain = 'AI Foundry' THEN 'Azure AI Foundry' WHEN ai_capability = 'GitHub Copilot' THEN 'GitHub Copilot' ELSE 'Other AI invoice' END AS cost_driver, cost_date, cost_eur FROM ${var.catalog}.gold.ai_foundry_costs_enriched WHERE cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -2) AND cost_date < DATE_TRUNC('MONTH', CURRENT_DATE()) AND is_ai = TRUE), invoice_rows AS (SELECT cost_driver, 'Closed-month Azure invoice' AS cost_basis, ROUND(SUM(CASE WHEN cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -1) THEN cost_eur ELSE 0 END), 2) AS amount_eur, ROUND(SUM(CASE WHEN cost_date >= ADD_MONTHS(DATE_TRUNC('MONTH', CURRENT_DATE()), -1) THEN cost_eur ELSE -cost_eur END), 2) AS change_eur, 1 AS row_sort_order FROM classified GROUP BY cost_driver), historical_ranked AS (SELECT period_start_date, total_cost_eur, ROW_NUMBER() OVER (ORDER BY period_start_date DESC) AS historical_rank FROM ${var.catalog}.gold.copilot_credit_historical_periods), credit_row AS (SELECT 'Copilot Studio (credit equivalent)' AS cost_driver, CONCAT('Historical credit equivalent | ', DATE_FORMAT(MAX(CASE WHEN historical_rank = 1 THEN period_start_date END), 'MMM yyyy'), ' vs ', DATE_FORMAT(MAX(CASE WHEN historical_rank = 2 THEN period_start_date END), 'MMM yyyy'), ' (not invoiced)') AS cost_basis, ROUND(MAX(CASE WHEN historical_rank = 1 THEN total_cost_eur END), 2) AS amount_eur, ROUND(MAX(CASE WHEN historical_rank = 1 THEN total_cost_eur END) - MAX(CASE WHEN historical_rank = 2 THEN total_cost_eur END), 2) AS change_eur, 2 AS row_sort_order FROM historical_ranked) SELECT * FROM invoice_rows UNION ALL SELECT * FROM credit_row",
                "dimensions": [
                  {
                    "name": "cost_driver",
                    "expr": "cost_driver"
                  },
                  {
                    "name": "cost_basis",
                    "expr": "cost_basis"
                  },
                  {
                    "name": "row_sort_order",
                    "expr": "row_sort_order"
                  }
                ],
                "measures": [
                  {
                    "name": "amount_eur",
                    "expr": "MAX(amount_eur)"
                  },
                  {
                    "name": "change_eur",
                    "expr": "MAX(change_eur)"
                  }
                ]
              }
            }
          ],
          "pages": [
            {
              "name": "executive_overview",
              "displayName": "Executive Overview",
              "layout": [
                {
                  "widget": {
                    "name": "cumulative_period",
                    "queries": [
                      {
                        "name": "cumulative_period_cost_date",
                        "query": {
                          "datasetName": "azure_cumulative_cost",
                          "fields": [
                            {
                              "name": "cost_date",
                              "expression": "`cost_date`"
                            },
                            {
                              "name": "cost_date_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "cumulative_period_monthly_cost_month",
                        "query": {
                          "datasetName": "azure_monthly_cost",
                          "fields": [
                            {
                              "name": "cost_month",
                              "expression": "`cost_month`"
                            },
                            {
                              "name": "cost_month_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "cumulative_period_components_cost_month",
                        "query": {
                          "datasetName": "monthly_ai_components_with_credits",
                          "fields": [
                            {
                              "name": "cost_month",
                              "expression": "`cost_month`"
                            },
                            {
                              "name": "cost_month_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "cumulative_period_components_with_credits_cost_date",
                        "query": {
                          "datasetName": "cumulative_ai_components_with_credits",
                          "fields": [
                            {
                              "name": "cost_date",
                              "expression": "`cost_date`"
                            },
                            {
                              "name": "cost_date_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "filter-date-range-picker",
                      "frame": {
                        "showTitle": true,
                        "title": "Period"
                      },
                      "encodings": {
                        "fields": [
                          {
                            "fieldName": "cost_date",
                            "queryName": "cumulative_period_cost_date"
                          },
                          {
                            "fieldName": "cost_month",
                            "queryName": "cumulative_period_monthly_cost_month"
                          },
                          {
                            "fieldName": "cost_month",
                            "queryName": "cumulative_period_components_cost_month"
                          },
                          {
                            "fieldName": "cost_date",
                            "queryName": "cumulative_period_components_with_credits_cost_date"
                          }
                        ]
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 6,
                    "height": 1
                  }
                },
                {
                  "widget": {
                    "name": "executive_cost_component",
                    "queries": [
                      {
                        "name": "executive_component_cumulative",
                        "query": {
                          "datasetName": "azure_cumulative_cost",
                          "fields": [
                            {
                              "name": "cost_driver",
                              "expression": "`cost_driver`"
                            },
                            {
                              "name": "cost_driver_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "executive_component_cumulative_with_credits",
                        "query": {
                          "datasetName": "cumulative_ai_components_with_credits",
                          "fields": [
                            {
                              "name": "cost_driver",
                              "expression": "`cost_driver`"
                            },
                            {
                              "name": "cost_driver_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "executive_component_monthly",
                        "query": {
                          "datasetName": "azure_monthly_cost",
                          "fields": [
                            {
                              "name": "cost_driver",
                              "expression": "`cost_driver`"
                            },
                            {
                              "name": "cost_driver_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "executive_component_monthly_with_credits",
                        "query": {
                          "datasetName": "monthly_ai_components_with_credits",
                          "fields": [
                            {
                              "name": "cost_driver",
                              "expression": "`cost_driver`"
                            },
                            {
                              "name": "cost_driver_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      },
                      {
                        "name": "executive_component_movements",
                        "query": {
                          "datasetName": "cost_movements",
                          "fields": [
                            {
                              "name": "cost_driver",
                              "expression": "`cost_driver`"
                            },
                            {
                              "name": "cost_driver_associativity",
                              "expression": "COUNT_IF(`associative_filter_predicate_group`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "widgetType": "filter-multi-select",
                      "frame": {
                        "showTitle": true,
                        "title": "Cost component"
                      },
                      "encodings": {
                        "fields": [
                          {
                            "fieldName": "cost_driver",
                            "queryName": "executive_component_cumulative"
                          },
                          {
                            "fieldName": "cost_driver",
                            "queryName": "executive_component_cumulative_with_credits"
                          },
                          {
                            "fieldName": "cost_driver",
                            "queryName": "executive_component_monthly"
                          },
