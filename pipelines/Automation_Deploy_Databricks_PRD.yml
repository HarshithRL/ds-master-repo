name: "Automation_Deploy_Databricks_PRD"

resources:
  repositories:
    - repository: da-mdp-foundations-deployments
      type: git
      name: da-mdp-foundations-deployments
      ref: refs/heads/main

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - '*.md'
      - 'pipelines/**'

variables:
  - template: variables/databricks_variables_prd.yml

stages:
  # Stage 1: Bundle deploy (Foundations template - uploads src/ to workspace, deploys jobs)
  - template: pipelines/templates/deploy_databricks.yml@da-mdp-foundations-deployments
    parameters:
      env: ${{ variables.PIPELINE_ENV }}
      envLong: ${{ variables.ENV_LONG }}
      subscriptionName: ${{ variables.SUBSCRIPTION_NAME }}
      keyVaultName: ${{ variables.KEYVAULT_NAME }}
      spnIdSecretName: ${{ variables.SPN_ID_SECRET_NAME }}
      spnSecretSecretName: ${{ variables.SPN_SECRET_SECRET_NAME }}
      tenantIdSecretName: ${{ variables.TENANT_SECRET_NAME }}
      adbHostnameSecretName: ${{ variables.ADB_HOST_SECRET_NAME }}
      dbxProfile: ${{ variables.DBX_PROFILE }}

  # Stage 2: Deploy Databricks App
  # Uses AzureCLI task (service connection auth) to bypass Key Vault IP firewall
  - stage: Deploy_App
    displayName: 'Deploy Air Monitoring App'
    pool:
      vmImage: 'ubuntu-latest'
    jobs:
      - job: deploy_app
        displayName: 'Deploy App to PRD'
        steps:
          - checkout: self

          - script: |
              curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            displayName: 'Install Databricks CLI'

          - task: AzureCLI@2
            inputs:
              azureSubscription: ${{ variables.SUBSCRIPTION_NAME }}
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                # Get AAD token for Databricks API (resource: 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d)
                export DATABRICKS_HOST="https://adb-4844910598668398.18.azuredatabricks.net"
                export DATABRICKS_TOKEN=$(az account get-access-token \
                  --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d \
                  --query accessToken -o tsv)

                echo "Overwriting app.yaml with PRD-specific config..."
                databricks workspace import \
                  /Workspace/automation/ds-air-monitoring-app/P/files/src/app.yaml \
                  --file $(Build.SourcesDirectory)/src/app.prd.yaml \
                  --format AUTO --overwrite

                echo "Deploying air-monitoring-app..."
                databricks apps deploy air-monitoring-app \
                  --source-code-path "/Workspace/automation/ds-air-monitoring-app/P/files/src"

                echo "PRD app deployment triggered."
            displayName: 'Deploy App (AzureCLI + Databricks CLI)'
