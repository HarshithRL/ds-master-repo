                              "expression": "MEASURE(`CM Total EUR`)"
                            },
                            {
                              "name": "measure(Billed+Delivered Pct)",
                              "expression": "MEASURE(`Billed+Delivered Pct`)"
                            }
                          ],
                          "filters": [
