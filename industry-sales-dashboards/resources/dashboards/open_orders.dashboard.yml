                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 12,
                    "height": 2
                  }
                },
                {
                  "widget": {
                    "name": "kpi_total",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ds_overview_allocation",
                          "fields": [
                            {
                              "name": "measure(CM Total EUR)",
                              "expression": "MEASURE(`CM Total EUR`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "version": 2,
                      "frame": {
                        "title": "Total Allocated (Current Month)",
                        "showTitle": true,
                        "description": "Sum of allocated order lines for the current calendar month across all CS teams",
                        "showDescription": true
                      },
                      "widgetType": "counter",
                      "encodings": {
                        "value": {
                          "fieldName": "measure(CM Total EUR)",
                          "format": {
                            "type": "number-currency",
                            "currencyCode": "EUR",
                            "abbreviation": "compact",
                            "decimalPlaces": {
                              "type": "exact",
                              "places": 1
                            }
                          }
                        }
                      },
                      "data": {
                        "queryName": "main_query"
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 4,
                    "width": 3,
                    "height": 4
                  }
                },
                {
                  "widget": {
                    "name": "kpi_billed_pct",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "fields": [
                            {
                              "name": "measure(Overview_Allocation_Consolidated__Billed+Delivered Pct)",
                              "expression": "MEASURE(`Overview_Allocation_Consolidated`.`Billed+Delivered Pct`)"
                            }
                          ],
                          "disaggregated": false
                        }
                      }
                    ],
                    "spec": {
                      "frame": {
