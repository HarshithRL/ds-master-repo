# Air Monitoring V2 App — Environment-agnostic
# UNITY_CATALOG and WAREHOUSE_ID are auto-detected from DATABRICKS_HOST at runtime
# by config.py (_ENV_OVERRIDES). No need to set them here.
# This same app.yaml works on DEV, ACC, and PRD without modification.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: BRONZE_SCHEMA
    value: "bronze"
  - name: VOLUME_NAME
    value: "bronze_volume"
  - name: AUTH_MODE
    value: "user"
  - name: DOC_INTELLIGENCE_ENDPOINT
    value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
  - name: DOC_INTELLIGENCE_KEY
    value: "1bdb532656d248bda3c6b58a9b75441f"
  - name: OPENAI_API_KEY
    value: "CqKjJbBku9Uf2PQLxKvDgaXF5xt3BU5u8yvQJsev3cwfycMxVosuJQQJ99BCACHYHv6XJ3w3AAAAACOGmDfg"
  - name: AZURE_TENANT_ID
    value: "e23c7299-f64d-4de4-a6a1-b40d3145528c"
  - name: USE_KEYVAULT
    value: "false"

# SQL Warehouse resources — list all environments.
# Only the warehouse that exists in the current workspace will be active.
# Needed to grant sql OAuth scope for user-auth token forwarding.
resources:
  - name: "sql-warehouse-dev"
    sql_warehouse:
      id: "69ada62b2fb9b9e2"
      permission: "CAN_USE"
  - name: "sql-warehouse-acc"
    sql_warehouse:
      id: "fe5f9b40ac3a9b6e"
      permission: "CAN_USE"
  - name: "sql-warehouse-prd"
    sql_warehouse:
      id: "83294e3f6b44f138"
      permission: "CAN_USE"

