# =============================================================================
# DATABRICKS ASSET BUNDLE — agent-dashboard
# =============================================================================
# Agent Dashboard Phase 1: Excel/CSV bronze ingest → silver dims/facts →
# metric views → validate → publish Lakeview dashboard.
# Follows DS-Master-Repo hello-world targets (D / T / A / P).
# =============================================================================

bundle:
  name: ds-cicd-agent-dashboard

include:
  - resources/*.yml

variables:
  policy_id:
    description: Cluster policy ID to use (reserved for classic clusters)
  catalog:
    description: Unity Catalog (contains bronze/silver/gold schemas)
  warehouse_id:
    description: SQL warehouse ID for the Lakeview dashboard
  dashboard_id:
    description: Existing Lakeview dashboard ID (DEV default; ACC/PRD may differ after first deploy)
  schema:
    description: Schema used by dashboard datasets (typically silver)

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_id: 01f19237ae0419ea830abdda6219869d
      schema: silver

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B9730019AB
      catalog: automation_d
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_id: 01f19237ae0419ea830abdda6219869d
      schema: silver
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE

  A:
    mode: production
    workspace:
      host: https://adb-4796304964978539.19.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005677
      catalog: automation_a
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_id: 01f19237ae0419ea830abdda6219869d
      schema: silver
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
        level: CAN_MANAGE

  P:
    mode: production
    workspace:
      host: https://adb-4844910598668398.18.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/${bundle.target}
    variables:
      policy_id: 306312B973005150
      catalog: automation_p
      warehouse_id: 69ada62b2fb9b9e2
      dashboard_id: 01f19237ae0419ea830abdda6219869d
      schema: silver
    permissions:
      - user_name: pierre.delaguiche@etexgroup.com
        level: CAN_MANAGE
      - user_name: mustafaarda.bicakci@etexgroup.com
        level: CAN_MANAGE
      - user_name: harshith.raghunath@etexgroup.com
