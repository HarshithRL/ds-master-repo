# ==============================================================
# Air Monitoring — Migration Load: OUTPUT TABLE only
#
# Reads output_table_*.xlsx from the target volume and
# appends new rows (row_id dedup) into bronze.air_monitoring_output.
#
# Run: databricks bundle run migration_load_output --target A
# ==============================================================

resources:
  jobs:
    migration_load_output:
      name: "air-monitoring-migration-load-output-${bundle.target}"

      tasks:
        - task_key: load_output_table
          notebook_task:
            notebook_path: ../src/migration_exports/3_Load_from_Excel_ACC_PRD.py
            base_parameters:
              TARGET_CATALOG: "${var.catalog}"
              OUTPUT_EXCEL:   "auto"
              SITES_EXCEL:    "auto"
              LOAD_WHAT:      "output"
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id:  "Standard_DS3_v2"
            num_workers: 1
            policy_id: "${var.policy_id}"
            data_security_mode: "USER_ISOLATION"

      email_notifications:
        on_failure:
          - mustafaarda.bicakci@etexgroup.com

      # No recurring schedule — run on demand only.
