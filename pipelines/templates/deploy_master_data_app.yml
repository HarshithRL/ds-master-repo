parameters:
  - name: target
    type: string
    values:
      - T
      - A
      - P

stages:
  - stage: Deploy_Master_Data_App
    displayName: Deploy Master Data app runtime
    condition: and(not(failed()), not(canceled()))
    jobs:
      - deployment: Deploy_Master_Data_App_Runtime
        displayName: Build and start Master Data app
        environment: ${{ variables.PIPELINE_ENV }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  path: s/DS-Master-Repo
                - task: AzureKeyVault@2
                  displayName: Load existing environment deployment credentials
                  inputs:
                    azureSubscription: ${{ variables.SUBSCRIPTION_NAME }}
                    KeyVaultName: ${{ variables.KEYVAULT_NAME }}
                    SecretsFilter: '${{ variables.SPN_ID_SECRET_NAME }},${{ variables.SPN_SECRET_SECRET_NAME }},${{ variables.ADB_HOST_SECRET_NAME }}'
                    RunAsPreJob: false
                - bash: |
                    set -euo pipefail
                    curl --fail --silent --show-error --location \
                      https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh \
                      --output "$(Agent.TempDirectory)/install-databricks-cli.sh"
                    sh "$(Agent.TempDirectory)/install-databricks-cli.sh"
                  displayName: Install Databricks CLI
                - bash: |
                    set -euo pipefail
                    case "$BUNDLE_TARGET" in
                      T) expected_host="https://adb-7181820732839861.1.azuredatabricks.net" ;;
                      A) expected_host="https://adb-4796304964978539.19.azuredatabricks.net" ;;
                      P) expected_host="https://adb-4844910598668398.18.azuredatabricks.net" ;;
                      *) printf 'Unsupported bundle target\n' >&2; exit 1 ;;
                    esac
                    if [[ "${DATABRICKS_HOST%/}" != "$expected_host" ]]; then
                      printf 'Deployment host does not match bundle target\n' >&2
                      exit 1
                    fi
                    databricks bundle deploy --target "$BUNDLE_TARGET" --auto-approve
                    databricks apps deploy ds-master-data-app \
                      --source-code-path "/Workspace/automation/ds-master-data-app/$BUNDLE_TARGET/files/src"
                    databricks apps get ds-master-data-app --output json \
                      > "$(Agent.TempDirectory)/master-data-app.json"
                    jq --exit-status '.app_status.state == "RUNNING"' \
                      "$(Agent.TempDirectory)/master-data-app.json"
                  displayName: Sync bundle, deploy app and verify runtime
                  workingDirectory: $(Pipeline.Workspace)/s/DS-Master-Repo/master-data-app
                  env:
                    BUNDLE_TARGET: ${{ parameters.target }}
                    DATABRICKS_HOST: $(${{ variables.ADB_HOST_SECRET_NAME }})
                    DATABRICKS_CLIENT_ID: $(${{ variables.SPN_ID_SECRET_NAME }})
                    DATABRICKS_CLIENT_SECRET: $(${{ variables.SPN_SECRET_SECRET_NAME }})
                    DATABRICKS_AUTH_TYPE: oauth-m2m