resources:
  jobs:
    migration_load:
      name: air_monitoring_migration_load

      # Not scheduled — trigger manually after placing Excel files in the
      # target volume: /Volumes/<catalog>/bronze/bronze_volume/migration_exports/
      # Run via CI/CD pipeline: bundle run migration_load --target A
      schedule:
        quartz_cron_expression: 0 0 0 1 1 ?
        timezone_id: Europe/Brussels
        pause_status: PAUSED

      tasks:
        - task_key: load_excel_to_tables
          notebook_task:
            notebook_path: ../src/migration_exports/Export_Load_Excel_ACC_PRD.py
            base_parameters:
              TARGET_CATALOG: ${var.catalog}
              OUTPUT_EXCEL: "auto"   # picks latest output_table*.xlsx in volume
              SITES_EXCEL:  "auto"   # picks latest sites*.xlsx in volume
          job_cluster_key: migration_cluster

      job_clusters:
        - job_cluster_key: migration_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
            policy_id: ${var.policy_id}
            data_security_mode: SINGLE_USER

      email_notifications:
        on_failure:
          - mustafaarda.bicakci@etexgroup.com
