# Air Monitoring V2 App — Environment-agnostic
# UNITY_CATALOG and WAREHOUSE_ID are auto-detected from DATABRICKS_HOST at runtime
# by config.py (_ENV_OVERRIDES). No need to set them here.
# This same app.yaml works on DEV, ACC, and PRD without modification.
command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - "0.0.0.0"

env:
  - name: BRONZE_SCHEMA
    value: "bronze"
  - name: VOLUME_NAME
    value: "bronze_volume"
  - name: AUTH_MODE
    value: "user"
  - name: DOC_INTELLIGENCE_ENDPOINT
    value: "https://we-spoke-mdp-t-formrecogniser.cognitiveservices.azure.com/"
  - name: DOC_INTELLIGENCE_KEY
    value: "1bdb532656d248bda3c6b58a9b75441f"
  - name: OPENAI_API_KEY
    value: "CqKjJbBku9Uf2PQLxKvDgaXF5xt3BU5u8yvQJsev3cwfycMxVosuJQQJ99BCACHYHv6XJ3w3AAAAACOGmDfg"
  - name: AZURE_TENANT_ID
    value: "e23c7299-f64d-4de4-a6a1-b40d3145528c"
  - name: USE_KEYVAULT
    value: "false"


