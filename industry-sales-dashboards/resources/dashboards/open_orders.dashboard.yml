            {
              "name": "allocation_logic",
              "displayName": "Allocation Logic",
              "layout": [
                {
                  "widget": {
                    "name": "doc_header",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## Industry Division \u2014 Open Orders Allocation Logic\n",
                        "This page explains how the dashboard calculates order values and assigns them to time buckets (Current Month, Year-to-Date, Future), and how we determine whether an order line is \"open\", \"delivered\", or \"billed\"."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 0,
                    "width": 12,
                    "height": 2
                  }
                },
                {
                  "widget": {
                    "name": "doc_orders_included",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**1. Which orders are included?**\n",
                        "\n",
                        "We include sales orders from the **Industry Division** (Business Unit 34) that meet all of these criteria:\n",
                        "\n",
                        "* **Document types:** Standard Order, Rush Order, Consignment Issue, or SAP types YOR, YSO, YKE, YKB\n",
                        "* **Not rejected:** The order line has not been fully rejected (Rejection Status \u2260 C)\n",
                        "* **Has a delivery date in the current year or later**"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 2,
                    "width": 12,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "doc_time_split",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**2. How is the order value split across time periods?**\n",
                        "\n",
                        "A single order line can have multiple **schedule lines** in SAP \u2014 each representing a planned delivery batch with its own date and quantity. We use these schedule lines to split the total order value across time periods.\n",
                        "\n",
                        "| Period | Definition |\n",
                        "| --- | --- |\n",
                        "| **Current Month (CM)** | Planned goods issue date falls within the current calendar month |\n",
                        "| **Year-to-Date (YTD)** | Planned goods issue date is in the current year but before the current month |\n",
                        "| **Future (FUT)** | Planned goods issue date is after the current month |\n",
                        "\n",
                        "The allocation follows a **4-rule hierarchy** based on the schedule line confirmation status of each order item:\n",
                        "\n",
                        "| Rule | When it applies | How value is split |\n",
                        "| --- | --- | --- |\n",
                        "| **Rule 1a \u2014 Confirmed SLs** | The item has schedule lines with confirmed quantities (confirmed_qty > 0) | Value is split proportionally by confirmed quantity across all confirmed SLs. Uses full 24-month history for FIFO delivery matching. If total confirmed \u2265 order qty, confirmed SLs get 100% of value; otherwise value is capped at confirmed share. |\n",
                        "| **Rule 1b \u2014 Partial (unconfirmed SLs on partially-confirmed items)** | The item has BOTH confirmed AND unconfirmed SLs, and total confirmed qty < order qty | The *remaining* value (order value \u00d7 (1 \u2212 confirmed share)) is split proportionally across unconfirmed SLs by their order quantity. This prevents partially-confirmed items from falling through the cracks. |\n",
                        "| **Rule 1b \u2014 Full (unconfirmed SLs on fully-unconfirmed items)** | The item has schedule lines but NONE are confirmed (only order quantities, confirmed_qty = 0) | Full order value is split proportionally by schedule line order quantity |\n",
                        "| **Rule 2 \u2014 No SLs** | The item has no schedule lines at all | The full value is assigned to the period matching the item-level requested delivery date |\n",
                        "\n",
                        "**Why 4 rules instead of 3?** Previously, Rule 1b only covered items with *zero* confirmed SLs. Items that were partially confirmed (e.g. July SL confirmed, September SL unconfirmed) had their unconfirmed portion dropped entirely \u2014 understating open order value. The new Rule 1b Partial captures this remainder."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 5,
                    "width": 12,
                    "height": 11
                  }
                },
                {
                  "widget": {
                    "name": "doc_delivery_status",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**3. How do we determine delivery status?**\n",
                        "\n",
                        "| Bucket | Meaning |\n",
                        "| --- | --- |\n",
                        "| **Billed** | The customer has been invoiced for this portion |\n",
                        "| **Delivered (not billed)** | Goods have left the warehouse but no invoice yet |\n",
                        "| **Open Past Due** | Not yet delivered AND the planned date is in the past |\n",
                        "| **Open Not Yet Due** | Not yet delivered AND the planned date is today or in the future |\n",
                        "\n",
                        "**FIFO delivery allocation (First In, First Out)**\n",
                        "\n",
                        "SAP records deliveries at the order line level but does not tell us which specific schedule line those pieces belong to. We use a **FIFO assumption**: deliveries are matched to schedule lines in date order, earliest first.\n",
                        "\n",
                        "*Example \u2014 Order 0015247609, Line 20:*\n",
                        "\n",
                        "| Schedule line | Planned date | Confirmed qty |\n",
                        "| --- | --- | --- |\n",
                        "| 1 | 03.07.2026 | 650 |\n",
                        "| 2 | 21.08.2026 | 390 |\n",
                        "\n",
                        "Total delivered: 650. FIFO consumes earliest first \u2192 July line fully delivered (650/650), August line still open (0/390)."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 16,
                    "width": 12,
                    "height": 9
                  }
                },
                {
                  "widget": {
                    "name": "doc_kpis",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**4. KPI Formulas**\n",
                        "\n",
                        "| KPI | Formula |\n",
                        "| --- | --- |\n",
                        "| **CM Total** | Sum of all allocated value where scope = Current Month |\n",
                        "| **CM Billed + Delivered** | Sum of Billed and Delivered (not billed) value for Current Month |\n",
                        "| **CM Open Past Due** | Sum of Open Past Due value for Current Month only |\n",
                        "| **YTD Open Past Due** | Sum of Open Past Due value for Year-to-Date scope only |\n",
                        "| **Billed + Delivered %** | (Billed + Delivered) / CM Total |"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 25,
                    "width": 6,
                    "height": 6
                  }
                },
                {
                  "widget": {
                    "name": "doc_run_rate",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**6. Run rate status**\n",
                        "\n",
                        "For each CS team, we compare delivery progress against the calendar:\n",
                        "\n",
                        "* **Month progress** = Working days elapsed / Total working days in the month\n",
                        "* **Delivery progress** = (Billed + Delivered value) / Total allocated CM value\n",
                        "\n",
                        "| Status | Condition |\n",
                        "| --- | --- |\n",
                        "| \ud83d\udfe2 On Track | Delivery progress within 5% of month progress |\n",
                        "| \ud83d\udfe0 Behind | 5\u201325% below month progress |\n",
                        "| \ud83d\udd34 Significantly Behind | More than 25% below |"
                      ]
                    }
                  },
                  "position": {
                    "x": 6,
                    "y": 25,
                    "width": 6,
                    "height": 6
                  }
                },
                {
                  "widget": {
                    "name": "doc_cs_teams",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**5. CS Team assignment**\n",
                        "\n",
                        "Each order is assigned to a Customer Service team based on the sales organization: **Europe**, **US**, **Asia**, **Skamol**, **FSi**. The mapping is maintained in the `cs_team_sales_org_mapping` table."
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 31,
                    "width": 6,
                    "height": 3
                  }
                },
                {
                  "widget": {
                    "name": "doc_assumptions",
                    "multilineTextboxSpec": {
                      "lines": [
                        "**7. Key assumptions and changelog**\n",
                        "\n",
                        "1. **FIFO is an assumption** \u2014 SAP does not provide schedule-line-level delivery data\n",
                        "2. **Billing and delivery are at item level** \u2014 we cannot distinguish which invoice belongs to which schedule line\n",
                        "3. **Working days** exclude weekends (Sat/Sun) but not public holidays\n",
                        "4. **Confirmed SL history** uses a 24-month lookback window to ensure accurate FIFO allocation for long-running orders\n",
                        "5. **Partially-confirmed items** \u2014 both the confirmed and unconfirmed portions are allocated (neither is dropped)\n",
                        "\n",
                        "**Changelog**\n",
                        "\n",
                        "| Date | Change |\n",
                        "| --- | --- |\n",
                        "| 04 Sep 2026 | Added Rule 1b Partial for partially-confirmed items; applied consistently across all 5 allocation datasets (overview, run rate, all open orders, top late orders, segment focus) |\n",
                        "| 29 Jul 2026 | Initial allocation logic documentation |"
                      ]
                    }
                  },
