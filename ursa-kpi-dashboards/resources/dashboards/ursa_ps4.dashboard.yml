resources:
  dashboards:
    ursa_ps4_daily_kpi_tracker:
      display_name: URSA PS4 Daily KPI Tracker
      warehouse_id: ${var.warehouse_id}
      embed_credentials: false
      serialized_dashboard: |
        {
          "datasets": [
            {
              "name": "ursa_kpi_data",
              "displayName": "URSA KPI Daily Data",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_ursa_kpi_data${var.result_suffix}`\n",
                "ORDER BY sort_order, company_code, report_date\n"
              ]
            },
            {
              "name": "test_invoiced_value",
              "displayName": "Test - Total Invoiced Value (VBRK)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_test_invoiced_value${var.result_suffix}`\n",
                "ORDER BY `Company Code`, `Billing Date`\n"
              ]
            },
            {
              "name": "hypercare_mock",
              "displayName": "Hypercare Daily KPI Matrix (Mock)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_hypercare_mock${var.result_suffix}`\n",
                "ORDER BY country_name, sort_order, snapshot_date\n"
              ]
            },
            {
              "name": "hc_baseline",
              "displayName": "Hypercare Baselines (Oct-Dec 2025 Avg)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_hc_baseline${var.result_suffix}`\n"
              ]
            },
            {
              "name": "hc_actuals_vs_baseline",
              "displayName": "Actuals vs Baseline (Heatmap)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_hc_actuals_vs_baseline${var.result_suffix}`\n",
                "ORDER BY country_name, sort_order, col_order\n"
              ]
            },
            {
              "name": "hc_matrix_formatted",
              "displayName": "Hypercare Matrix (Formatted Cells)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_hc_matrix_formatted${var.result_suffix}`\n",
                "ORDER BY country_name, sort_order, snapshot_date\n"
              ]
            },
            {
              "name": "o2c_live_matrix",
              "displayName": "O2C Live Matrix (synapse-prd.pbi)",
              "queryLines": [
                "SELECT * FROM `${var.catalog}`.gold.`URSA_KPI_result_o2c_live_matrix${var.result_suffix}`\n",
                "ORDER BY kpi_stream, kpi_name, country_name, plant_label, snapshot_date\n"
              ]
            }
          ],
          "pages": [
            {
              "name": "a66962f7",
              "displayName": "Overview",
              "layout": [
                {
                  "widget": {
                    "name": "overview_pivot",
                    "queries": [
                      {
                        "name": "main_query",
                        "query": {
                          "datasetName": "ursa_kpi_data",
                          "fields": [
                            {
                              "name": "category",
                              "expression": "`category`"
                            },
                            {
                              "name": "kpi_name",
                              "expression": "`kpi_name`"
                            },
                            {
                              "name": "report_date",
                              "expression": "`report_date`"
                            },
                            {
                              "name": "sum(daily_value)",
                              "expression": "SUM(`daily_value`)"
                            }
                          ],
                          "cubeGroupingSets": {
                            "sets": [
                              {
                                "fieldNames": [
                                  "category",
                                  "kpi_name"
                                ]
                              },
                              {
                                "fieldNames": [
                                  "report_date"
                                ]
                              }
                            ]
                          },
                          "disaggregated": false,
                          "orders": [
                            {
                              "direction": "ASC",
                              "expression": "`category`"
                            },
                            {
                              "direction": "ASC",
                              "expression": "`kpi_name`"
                            },
                            {
                              "direction": "ASC",
                              "expression": "`report_date`"
                            }
                          ]
                        }
                      }
                    ],
                    "spec": {
                      "frame": {
                        "showTitle": true,
                        "title": {
                          "value": "KPI Overview by Area",
                          "fields": []
                        }
                      },
                      "version": 4,
                      "widgetType": "pivot",
                      "encodings": {
                        "rows": {
                          "fields": [
                            {
                              "fieldName": "category",
                              "scale": {
                                "type": "categorical"
                              }
                            },
                            {
                              "fieldName": "kpi_name",
                              "scale": {
                                "type": "categorical"
                              }
                            }
                          ]
                        },
                        "columns": {
                          "fields": [
                            {
                              "fieldName": "report_date",
                              "scale": {
                                "type": "categorical"
                              }
                            }
                          ]
                        },
                        "cells": {
                          "fields": [
                            {
                              "fieldName": "sum(daily_value)",
                              "cellType": "text"
                            }
                          ],
                          "displayAs": "rows"
                        }
                      },
                      "data": {
                        "queryName": "main_query"
                      }
                    }
                  },
                  "position": {
                    "x": 0,
                    "y": 2,
                    "width": 12,
                    "height": 12
                  }
                },
                {
                  "widget": {
                    "name": "title",
                    "multilineTextboxSpec": {
                      "lines": [
                        "## URSA PS4 Daily KPI Tracker\n",
                        "Overview across all areas \u2014 filter by company code and date range using the sidebar"
                      ]
                    }
                  },
                  "position": {
                    "x": 0,
