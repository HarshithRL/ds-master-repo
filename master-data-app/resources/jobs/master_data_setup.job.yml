resources:
  jobs:
    master_data_app_setup_tables:
      name: "ds-master-data-app - Setup and Seed Bronze Tables"
      tags:
        project: master-data-app
        purpose: setup-and-seed
      schedule:
        quartz_cron_expression: 0 0 0 1 1 ?
        timezone_id: Europe/Brussels
        pause_status: PAUSED
      tasks:
        - task_key: setup_tables
          spark_python_task:
            python_file: ../../src/setup_tables.py
            parameters:
              - ${var.catalog}
              - /Volumes/${var.catalog}/bronze/bronze_volume/master_data_app
          job_cluster_key: setup_cluster
          libraries:
            - pypi:
                package: openpyxl==3.1.5
      job_clusters:
        - job_cluster_key: setup_cluster
          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 0
            spark_conf:
              spark.master: "local[*]"
            policy_id: ${var.policy_id}
            data_security_mode: USER_ISOLATION
      permissions:
        - user_name: mustafaarda.bicakci@etexgroup.com
          level: CAN_MANAGE
        - user_name: pierre.delaguiche@etexgroup.com
          level: CAN_MANAGE