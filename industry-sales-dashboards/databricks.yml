bundle:
  name: industry-sales-dashboards

include:
  - resources/dashboards/*.yml
  - resources/jobs/*.yml

sync:
  exclude:
    - source_dashboards/**
    - tests/**
    - scripts/**
    - validation/**

variables:
  catalog:
    description: Target automation catalog containing existing bronze, silver, and gold schemas
  source_catalog:
    description: Shared read-only Synapse source catalog, independently configurable from the output catalog
    default: synapse-prd
  policy_id:
    description: Target workspace Job Compute policy
  warehouse_id:
    description: Target SQL warehouse for dashboard publication and refresh
  refresh_pause_status:
    description: Schedule pause status; DEV and TEST remain paused
  mapping_table_name:
    description: Bundle-owned lookup table name within each fixed schema
    default: industry_sales_cs_team_sales_org_mapping

permissions:
  - user_name: mustafaarda.bicakci@etexgroup.com
    level: CAN_MANAGE
  - user_name: pierre.delaguiche@etexgroup.com
    level: CAN_MANAGE
  - user_name: sahil.ailsingani@etexgroup.com
    level: CAN_MANAGE
  - user_name: harshith.raghunath@etexgroup.com
    level: CAN_MANAGE
  - user_name: noel.vranckx@etexgroup.com
    level: CAN_MANAGE

targets:
  D:
    mode: development
    default: true
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/${bundle.name}/D
    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      warehouse_id: 69ada62b2fb9b9e2
      refresh_pause_status: PAUSED
      mapping_table_name: industry_sales_cs_team_sales_org_mapping_dev

  T:
    mode: production
    workspace:
      host: https://adb-7181820732839861.1.azuredatabricks.net
      root_path: /Workspace/automation/${bundle.name}/T
    variables:
      catalog: automation_d
      policy_id: 306312B9730019AB
      warehouse_id: 69ada62b2fb9b9e2
      refresh_pause_status: PAUSED
    permissions:
      - service_principal_name: 1ff203aa-a0ad-475e-85aa-4eac5c23bdc7
        level: CAN_MANAGE
      - group_name: SEC.RBAC.MDP.DATAAUTOMATION.AUTOMATION.DATAANALYST.DEFAULT
        level: CAN_MANAGE
      - group_name: SEC.RBAC.MDP.DATAAUTOMATION.AUTOMATION.DATASCIENTIST.DEFAULT
        level: CAN_MANAGE

  A:
